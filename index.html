  const googleAccountTokensRef = useRef({});
  const [googleAccounts, setGoogleAccounts] = useState([]); // metadados não sensíveis (ver comentário acima)
  const [googleAccountStatus, setGoogleAccountStatus] = useState({}); // { [accountId]: "conectando"|"conectado"|"desconectado"|"sessao-expirada"|"erro" } — nunca persistido, some ao recarregar a página
  const [googleAccountError, setGoogleAccountError] = useState({}); // { [accountId]: mensagem amigável }
  const [googleCalendarsByAccount, setGoogleCalendarsByAccount] = useState({}); // { [accountId]: [{id,nome,cor,principal}] } — recarregado a cada sessão, não persistido
  const [googleEvents, setGoogleEvents] = useState([]); // eventos da Google Agenda carregados na sessão atual — não persistidos (recarregados a cada sincronização)
  const [googleEventsSyncStatus, setGoogleEventsSyncStatus] = useState("idle"); // idle | syncing | error
  const [googleEventLinks, setGoogleEventLinks] = useState([]); // persistido: [{id: accountId__calendarId__eventId, projectId}] — vínculo evento↔projeto sobrevive porque os eventos em si são recarregados a cada sessão

  useEffect(() => {
    if (authStatus === "nao-configurado") return;
    let cancelled = false;
    let tries = 0;
    const tick = () => {
      if (cancelled) return;
      if (window.google && window.google.accounts && window.google.accounts.oauth2) {
        tokenClientRef.current = window.google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: GOOGLE_DRIVE_SCOPE,
          callback: () => {},
        });
        attemptSilentSignIn();
        return;
      }
      tries += 1;
      if (tries > 100) { setAuthStatus("erro"); return; } // ~20s sem o script do Google carregar
      setTimeout(tick, 200);
    };
    tick();
    return () => { cancelled = true; };
  }, []);

  /* Carrega a biblioteca do Google Picker (usada em Documentos, para selecionar arquivo/pasta do
     Drive) em segundo plano, assim que a chave de API estiver configurada — sem chave, nem tenta,
     e o botão de selecionar do Drive mostra um aviso em vez de travar esperando algo que não vai
     carregar. */
  useEffect(() => {
    if (GOOGLE_PICKER_API_KEY.indexOf("COLE_AQUI") === 0) return;
    let cancelled = false;
    let tries = 0;
    const tick = () => {
      if (cancelled) return;
      if (window.gapi && window.gapi.load) {
        window.gapi.load("picker", () => { pickerLoadedRef.current = true; });
        return;
      }
      tries += 1;
      if (tries > 100) return; // ~20s sem o script do Google carregar — Picker fica indisponível nesta sessão
      setTimeout(tick, 200);
    };
    tick();
    return () => { cancelled = true; };
  }, []);

  /* Abre o Google Picker para escolher um arquivo ("file") ou uma pasta ("folder") do Drive de uma
     das contas conectadas (accountId null = conta de dados da Central). Usa sempre o token da conta
     escolhida — nunca mistura contas — e nunca guarda nada além do que já fica em memória por conta
     (ver googleAccountTokensRef). O resultado devolvido a onPick é só {id, nome, link, mimeType} do
     item escolhido — o próprio Drive continua sendo o dono do arquivo; a Central guarda só o link. */
  function openDrivePicker({ accountId, mode, startFolderId, onPick }) {
    if (GOOGLE_PICKER_API_KEY.indexOf("COLE_AQUI") === 0) {
      setToast("Google Picker não configurado — veja o Guia de Configuração, Parte 9.");
      return;
    }
    if (!pickerLoadedRef.current || !window.google || !window.google.picker) {
      setToast("O Google Picker ainda está carregando — tente de novo em alguns segundos.");
      return;
    }
    const token = accountId
      ? (googleAccountTokensRef.current[accountId] && googleAccountTokensRef.current[accountId].accessToken)
      : accessTokenRef.current;
    if (!token) {
      setToast("Essa conta não está conectada nesta sessão — reconecte em Configurações > Contas Google.");
      return;
    }
    const view = mode === "folder"
      ? new window.google.picker.DocsView(window.google.picker.ViewId.FOLDERS).setSelectFolderEnabled(true).setIncludeFolders(true)
      : new window.google.picker.DocsView(window.google.picker.ViewId.DOCS).setIncludeFolders(true).setSelectFolderEnabled(false);
    if (startFolderId) view.setParent(startFolderId);
    const picker = new window.google.picker.PickerBuilder()
      .addView(view)
      .setOAuthToken(token)
      .setDeveloperKey(GOOGLE_PICKER_API_KEY)
      .setCallback((data) => {
        if (data.action === window.google.picker.Action.PICKED) {
          const doc = data.docs[0];
          onPick({ id: doc.id, nome: doc.name, link: doc.url, mimeType: doc.mimeType }, accountId || null);
        }
      })
      .build();
    picker.setVisible(true);
  }

  /* Tenta reconectar sem mostrar nenhuma tela do Google, reaproveitando a sessão do Google já
     aberta no navegador e o consentimento já dado antes (prompt "" = silencioso, sem popup de
     escolha de conta nem de revisão de permissões). Nada fica persistido para isso — só o token
     em memória de sempre; quem garante a continuidade é a própria sessão do Google no navegador.
     Como não parte de um clique, alguns navegadores podem bloquear a tentativa — por isso o
     temporizador de segurança abaixo garante que a tela de login manual aparece de qualquer forma
     em vez de travar em "verificando" para sempre. */
  function attemptSilentSignIn() {
    if (!tokenClientRef.current) { setAuthStatus("deslogado"); return; }
    let settled = false;
    const fallback = setTimeout(() => { if (!settled) { settled = true; setAuthStatus("deslogado"); } }, 3000);
    tokenClientRef.current.callback = (resp) => {
      if (settled) return;
      settled = true;
      clearTimeout(fallback);
      if (resp.error) { setAuthStatus("deslogado"); return; }
      accessTokenRef.current = resp.access_token;
      setAuthStatus("logado");
    };
    try {
      tokenClientRef.current.requestAccessToken({ prompt: "" });
    } catch (e) {
      if (!settled) { settled = true; clearTimeout(fallback); setAuthStatus("deslogado"); }
    }
  }

  function signInWithGoogle() {
    if (!tokenClientRef.current) return;
    setAuthStatus("entrando");
    tokenClientRef.current.callback = (resp) => {
      if (resp.error) {
        // tentativa silenciosa não resolveu (ex.: primeiro uso, ou consentimento revogado) —
        // agora sim pede a tela completa de escolha de conta e permissões
        tokenClientRef.current.callback = (resp2) => {
          if (resp2.error) { setAuthStatus("erro"); return; }
          accessTokenRef.current = resp2.access_token;
          setAuthStatus("logado");
        };
        tokenClientRef.current.requestAccessToken({ prompt: "consent" });
        return;
      }
      accessTokenRef.current = resp.access_token;
      setAuthStatus("logado");
    };
    tokenClientRef.current.requestAccessToken({ prompt: "" });
  }

  function signOutGoogle() {
    if (window.google && window.google.accounts && window.google.accounts.oauth2 && accessTokenRef.current) {
      window.google.accounts.oauth2.revoke(accessTokenRef.current, () => {});
    }
    accessTokenRef.current = null;
    dbRef.current = null;
    driveFileIdRef.current = null;
    driveStateRef.current = null;
    setDbStatus("checking");
    setAuthStatus("deslogado");
  }

  function driveFetch(url, options = {}) {
    const withAuth = (opts) => ({ ...opts, headers: { ...(opts.headers || {}), Authorization: "Bearer " + accessTokenRef.current } });
    return fetch(url, withAuth(options)).then(async (res) => {
      if (res.status !== 401 || !tokenClientRef.current) return res;
      const refreshed = await new Promise((resolve) => {
        tokenClientRef.current.callback = (resp) => {
          if (resp.error) { resolve(false); return; }
          accessTokenRef.current = resp.access_token;
          resolve(true);
        };
        tokenClientRef.current.requestAccessToken({ prompt: "" });
      });
      if (!refreshed) { setAuthStatus("sessao-expirada"); return res; }
      return fetch(url, withAuth(options));
    });
  }

  async function driveFindOrCreateFile() {
    const q = encodeURIComponent("name='" + DRIVE_DATA_FILENAME + "' and trashed=false");
    const listRes = await driveFetch("https://www.googleapis.com/drive/v3/files?q=" + q + "&spaces=drive&fields=files(id,name)");
    if (!listRes.ok) throw new Error("Falha ao consultar o Google Drive (HTTP " + listRes.status + ")");
    const listJson = await listRes.json();
    if (listJson.files && listJson.files.length > 0) return listJson.files[0].id;
    const metadata = { name: DRIVE_DATA_FILENAME, mimeType: "application/json" };
    const boundary = "cpboundary" + Date.now();
    const body = "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(metadata) +
      "\r\n--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" + JSON.stringify({ meta: {}, collections: {} }) +
      "\r\n--" + boundary + "--";
    const createRes = await driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
      method: "POST",
      headers: { "Content-Type": "multipart/related; boundary=" + boundary },
      body,
    });
    if (!createRes.ok) throw new Error("Falha ao criar o arquivo de dados no Google Drive (HTTP " + createRes.status + ")");
    const createJson = await createRes.json();
    return createJson.id;
  }

  async function driveLoadFileContent(fileId) {
    const res = await driveFetch("https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media");
    if (!res.ok) return { meta: {}, collections: {} };
    try {
      const text = await res.text();
      if (!text) return { meta: {}, collections: {} };
      const parsed = JSON.parse(text);
      return { meta: parsed.meta || {}, collections: parsed.collections || {} };
    } catch (e) { return { meta: {}, collections: {} }; }
  }

  /* ==========================================================================
     CONTAS GOOGLE CONECTADAS (Fase 2) — Drive e/ou Agenda, além da conta de dados
     Cada conta tem seu próprio token client e access token (googleAccountTokensRef,
     só em memória). Uma falha de conexão ou de sincronização em uma conta nunca deve
     afetar a conta de dados da Central nem as outras contas conectadas — por isso todo
     erro aqui é isolado por accountId, tanto no estado quanto no try/catch.
     ========================================================================== */
  function buildGoogleAccountScope({ usaDrive, usaAgenda }) {
    const scopes = [GOOGLE_OPENID_SCOPE, GOOGLE_USERINFO_EMAIL_SCOPE];
    if (usaDrive) scopes.push(GOOGLE_DRIVE_SCOPE);
    if (usaAgenda) scopes.push(GOOGLE_CALENDAR_READONLY_SCOPE);
    return scopes.join(" ");
  }

  /* fetch autenticado para uma conta adicional específica — mesmo padrão de driveFetch (refresh
     silencioso em 401, uma tentativa), mas isolado por conta: uma sessão expirada aqui só marca
     essa conta como "sessao-expirada", nunca mexe em authStatus nem nas outras contas */
  function googleAccountFetch(accountId, url, options = {}) {
    const tokenEntry = googleAccountTokensRef.current[accountId];
    if (!tokenEntry) return Promise.reject(new Error("Conta Google não conectada."));
    const withAuth = (opts) => ({ ...opts, headers: { ...(opts.headers || {}), Authorization: "Bearer " + tokenEntry.accessToken } });
    return fetch(url, withAuth(options)).then(async (res) => {
      if (res.status !== 401) return res;
      const refreshed = await new Promise((resolve) => {
        tokenEntry.tokenClient.callback = (resp) => {
          if (resp.error) { resolve(false); return; }
          tokenEntry.accessToken = resp.access_token;
          resolve(true);
        };
        tokenEntry.tokenClient.requestAccessToken({ prompt: "" });
      });
      if (!refreshed) { setGoogleAccountStatus((prev) => ({ ...prev, [accountId]: "sessao-expirada" })); return res; }
      return fetch(url, withAuth(options));
    });
  }

  /* conecta uma conta Google nova (ou reconecta, se o e-mail escolhido já corresponder a uma conta
     já cadastrada) com o escopo montado a partir do que a pessoa marcou (Drive e/ou Agenda) */
  function connectGoogleAccount({ apelido, usaDrive, usaAgenda }) {
    if (!usaDrive && !usaAgenda) { setToast("Selecione Google Drive e/ou Google Agenda para conectar a conta."); return; }
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
      setToast("O login do Google ainda não carregou. Aguarde alguns segundos e tente novamente.");
      return;
    }
    const tempId = "ga" + (Date.now() % 100000) + Math.floor(Math.random() * 99);
    setGoogleAccountStatus((prev) => ({ ...prev, [tempId]: "conectando" }));
    const scope = buildGoogleAccountScope({ usaDrive, usaAgenda });
    const tokenClient = window.google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope,
      callback: async (resp) => {
        if (resp.error) {
          setGoogleAccountStatus((prev) => { const n = { ...prev }; delete n[tempId]; return n; });
          setToast("Não foi possível conectar a conta Google.");
          return;
        }
        try {
          const userinfoRes = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
            headers: { Authorization: "Bearer " + resp.access_token },
          });
          if (!userinfoRes.ok) throw new Error("Falha ao identificar a conta (HTTP " + userinfoRes.status + ")");
          const info = await userinfoRes.json();
          const email = info.email || "";
          // evita duplicar: se essa conta (mesmo e-mail) já estiver cadastrada, reconecta nela em vez de criar outra
          const existing = googleAccounts.find((a) => a.email === email);
          const accountId = existing ? existing.id : tempId;
          googleAccountTokensRef.current[accountId] = { tokenClient, accessToken: resp.access_token };
          setGoogleAccountStatus((prev) => {
            const n = { ...prev };
            if (existing) delete n[tempId];
            n[accountId] = "conectado";
            return n;
          });
          setGoogleAccountError((prev) => { const n = { ...prev }; delete n[accountId]; return n; });
          const rec = existing
            ? { ...existing, usaDrive: existing.usaDrive || !!usaDrive, usaAgenda: existing.usaAgenda || !!usaAgenda }
            : {
                id: accountId, email, apelido: (apelido || "").trim() || email,
                usaDrive: !!usaDrive, usaAgenda: !!usaAgenda,
                calendariosSelecionados: ["primary"], ultimaSincronizacao: null, criadoEm: new Date().toISOString(),
              };
          setGoogleAccounts((prev) => (existing ? prev.map((a) => (a.id === accountId ? rec : a)) : [...prev, rec]));
          persistDoc("googleAccountsMeta", accountId, rec);
          setToast((existing ? "Conta reconectada: " : "Conta Google conectada: ") + email);
          if (rec.usaAgenda) {
            await fetchAccountCalendarList(accountId);
            await syncGoogleAgenda([rec], { silent: true });
          }
        } catch (e) {
          console.warn("Falha ao identificar conta Google:", e);
          setGoogleAccountStatus((prev) => ({ ...prev, [tempId]: "erro" }));
          setGoogleAccountError((prev) => ({ ...prev, [tempId]: "Não foi possível identificar essa conta Google." }));
        }
      },
    });
    tokenClient.requestAccessToken({ prompt: "consent" });
  }

  /* reconecta uma conta já cadastrada (após expirar ou após "Desconectar") — usa o mesmo escopo já
     salvo para essa conta e sugere o e-mail certo no seletor de contas do Google (hint) */
  function reconnectGoogleAccount(accountId) {
    const acc = googleAccounts.find((a) => a.id === accountId);
    if (!acc) return;
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
      setToast("O login do Google ainda não carregou. Aguarde alguns segundos e tente novamente.");
      return;
    }
    setGoogleAccountStatus((prev) => ({ ...prev, [accountId]: "conectando" }));
    const scope = buildGoogleAccountScope({ usaDrive: acc.usaDrive, usaAgenda: acc.usaAgenda });
    const tokenClient = window.google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope,
      hint: acc.email,
      callback: (resp) => {
        if (resp.error) {
          setGoogleAccountStatus((prev) => ({ ...prev, [accountId]: "erro" }));
          setGoogleAccountError((prev) => ({ ...prev, [accountId]: "Não foi possível reconectar essa conta." }));
          return;
        }
        googleAccountTokensRef.current[accountId] = { tokenClient, accessToken: resp.access_token };
        setGoogleAccountStatus((prev) => ({ ...prev, [accountId]: "conectado" }));
        setGoogleAccountError((prev) => { const n = { ...prev }; delete n[accountId]; return n; });
        setToast("Conta reconectada: " + acc.email);
        if (acc.usaAgenda) { fetchAccountCalendarList(accountId).then(() => syncGoogleAgenda([acc], { silent: true })); }
      },
    });
    tokenClient.requestAccessToken({ prompt: "consent" });
  }

  /* desconecta (revoga o token e esquece a sessão em memória) mas mantém o cadastro da conta, para
     reconectar depois — os eventos dessa conta somem da tela até reconectar e sincronizar de novo */
  function disconnectGoogleAccount(accountId) {
    const tok = googleAccountTokensRef.current[accountId];
    if (tok && tok.accessToken && window.google && window.google.accounts && window.google.accounts.oauth2) {
      window.google.accounts.oauth2.revoke(tok.accessToken, () => {});
    }
    delete googleAccountTokensRef.current[accountId];
    setGoogleAccountStatus((prev) => ({ ...prev, [accountId]: "desconectado" }));
    setGoogleCalendarsByAccount((prev) => { const n = { ...prev }; delete n[accountId]; return n; });
    setGoogleEvents((prev) => prev.filter((e) => e.accountId !== accountId));
  }

  /* remove definitivamente uma conta conectada: desconecta, apaga o cadastro (Drive) e os vínculos
     evento↔projeto dela — as reuniões já importadas a partir de eventos dessa conta não são apagadas */
  function removeGoogleAccount(accountId) {
    disconnectGoogleAccount(accountId);
    setGoogleAccounts((prev) => prev.filter((a) => a.id !== accountId));
    setGoogleAccountStatus((prev) => { const n = { ...prev }; delete n[accountId]; return n; });
    setGoogleAccountError((prev) => { const n = { ...prev }; delete n[accountId]; return n; });
    deleteDocRemote("googleAccountsMeta", accountId);
    const prefix = accountId + "__";
    const linksToRemove = googleEventLinks.filter((l) => l.id.indexOf(prefix) === 0);
    if (linksToRemove.length) {
      setGoogleEventLinks((prev) => prev.filter((l) => l.id.indexOf(prefix) !== 0));
      linksToRemove.forEach((l) => deleteDocRemote("googleEventLinks", l.id));
    }
    setToast("Conta Google removida.");
  }

  async function fetchAccountCalendarList(accountId) {
    try {
      const res = await googleAccountFetch(accountId, "https://www.googleapis.com/calendar/v3/users/me/calendarList?maxResults=250");
      if (!res || !res.ok) throw new Error("Falha ao listar calendários (HTTP " + (res && res.status) + ")");
      const json = await res.json();
      const cals = (json.items || []).map((c) => ({ id: c.id, nome: c.summaryOverride || c.summary || c.id, cor: c.backgroundColor || "", principal: !!c.primary }));
      setGoogleCalendarsByAccount((prev) => ({ ...prev, [accountId]: cals }));
      return cals;
    } catch (e) {
      console.warn("Falha ao listar calendários da conta " + accountId + ":", e);
      setToast("Não foi possível carregar os calendários dessa conta.");
      return [];
    }
  }

  /* altera quais calendários dessa conta entram na Central (padrão: só o principal) */
  function updateGoogleAccountCalendarios(accountId, calendarIds) {
    setGoogleAccounts((prev) => prev.map((a) => {
      if (a.id !== accountId) return a;
      const next = { ...a, calendariosSelecionados: calendarIds };
      persistDoc("googleAccountsMeta", accountId, next);
      return next;
    }));
  }

  /* busca eventos das contas conectadas com Agenda habilitada, numa janela fixa (60 dias atrás a 180
     dias à frente) — suficiente para o Calendário e o Cronograma Geral da Central. Se contasOverride
     for passado (ex.: logo após conectar uma conta), sincroniza só essa conta, preservando os eventos
     já carregados das demais. Cada conta/calendário é tratado com seu próprio try/catch: uma falha em
     um não impede os outros de sincronizarem. */
  async function syncGoogleAgenda(contasOverride, opts = {}) {
    const silent = !!opts.silent;
    const usingOverride = !!contasOverride;
    const contas = (contasOverride || googleAccounts).filter((a) => a.usaAgenda && (usingOverride || googleAccountStatus[a.id] === "conectado"));
    if (contas.length === 0) { if (!silent) setToast("Nenhuma conta com Google Agenda conectada."); return; }
    setGoogleEventsSyncStatus("syncing");
    const timeMin = new Date(Date.now() - 60 * 24 * 60 * 60 * 1000).toISOString();
    const timeMax = new Date(Date.now() + 180 * 24 * 60 * 60 * 1000).toISOString();
    const allEvents = [];
    let anyError = false;
    for (const conta of contas) {
      const calendarIds = (conta.calendariosSelecionados && conta.calendariosSelecionados.length) ? conta.calendariosSelecionados : ["primary"];
      for (const calendarId of calendarIds) {
        try {
          const url = "https://www.googleapis.com/calendar/v3/calendars/" + encodeURIComponent(calendarId) +
            "/events?singleEvents=true&orderBy=startTime&maxResults=250&timeMin=" + encodeURIComponent(timeMin) + "&timeMax=" + encodeURIComponent(timeMax);
          const res = await googleAccountFetch(conta.id, url);
          if (!res || !res.ok) { anyError = true; continue; }
          const json = await res.json();
          (json.items || []).forEach((ev) => {
            if (ev.status === "cancelled") return;
            const startIso = (ev.start && (ev.start.dateTime || ev.start.date)) || null;
            if (!startIso) return;
            allEvents.push({
              key: conta.id + "__" + calendarId + "__" + ev.id,
              accountId: conta.id, calendarId, eventId: ev.id,
              titulo: ev.summary || "(sem título)",
              descricao: ev.description || "",
              local: ev.location || "",
              data: startIso.slice(0, 10),
              horario: ev.start.dateTime ? startIso.slice(11, 16) : "",
              diaInteiro: !ev.start.dateTime,
              fim: (ev.end && (ev.end.dateTime || ev.end.date)) || null,
              organizador: ev.organizer ? (ev.organizer.displayName || ev.organizer.email || "") : "",
              participantes: (ev.attendees || []).map((p) => p.displayName || p.email).filter(Boolean),
              meetLink: ev.hangoutLink || "",
              htmlLink: ev.htmlLink || "",
            });
          });
        } catch (e) {
          console.warn("Falha ao buscar eventos da agenda:", conta.email, calendarId, e);
          anyError = true;
        }
      }
      const nowIso = new Date().toISOString();
      setGoogleAccounts((prev) => prev.map((a) => {
        if (a.id !== conta.id) return a;
        const next = { ...a, ultimaSincronizacao: nowIso };
        persistDoc("googleAccountsMeta", conta.id, next);
        return next;
      }));
    }
    const processedIds = new Set(contas.map((c) => c.id));
    setGoogleEvents((prev) => [...prev.filter((e) => !processedIds.has(e.accountId)), ...allEvents]);
    setGoogleEventsSyncStatus(anyError ? "error" : "idle");
    if (!silent) {
      if (anyError) setToast("Agenda sincronizada com alguns erros — verifique as contas conectadas.");
      else setToast("Google Agenda sincronizada.");
    }
  }

  /* vincula (ou desvincula, se projectId for null) um evento do Google Agenda a um projeto da Central */
  function linkGoogleEventToProject(eventKey, projectId) {
    setGoogleEventLinks((prev) => {
      const next = prev.filter((l) => l.id !== eventKey);
      if (projectId) next.push({ id: eventKey, projectId });
      return next;
    });
    if (projectId) persistDoc("googleEventLinks", eventKey, { id: eventKey, projectId });
    else deleteDocRemote("googleEventLinks", eventKey);
  }

  /* importa um evento do Google Agenda como reunião da Central — evita duplicar se esse evento já
     tiver sido importado antes (dedup por accountId+calendarId+eventId, guardado em meeting.googleEvent) */
  function importGoogleEventAsMeeting(ev, projectId) {
    if (!projectId) { setToast("Selecione um projeto para importar este evento como reunião."); return null; }
    const dup = meetings.find((m) => m.googleEvent && m.googleEvent.accountId === ev.accountId && m.googleEvent.calendarId === ev.calendarId && m.googleEvent.eventId === ev.eventId);
    if (dup) { setToast("Este evento do Google Agenda já foi importado como reunião."); return dup; }
    const rec = addMeetingManual({
      titulo: ev.titulo, projectId, data: ev.data, horario: ev.horario, objetivo: ev.descricao || "",
      googleEvent: { accountId: ev.accountId, calendarId: ev.calendarId, eventId: ev.eventId },
    });
    linkGoogleEventToProject(ev.key, projectId);
    setToast("Reunião importada do Google Agenda.");
    return rec;
  }

  /* Executa de fato o PATCH no Google Drive e resolve/rejeita os "waiters" (chamadores que estão
     aguardando essa gravação específica) de acordo com a resposta HTTP real (response.ok) — nunca
     apenas com o agendamento do envio. Nunca deixa dois PATCH em voo ao mesmo tempo: se chegar uma
     mudança nova enquanto este está em andamento, ela fica marcada como "dirty" e é reenviada assim
     que este terminar, já com o estado mais recente. */
  function performDriveSave(waiters) {
    driveSaveInFlightRef.current = true;
    setDriveSaveStatus("saving");
    const payload = JSON.stringify(driveStateRef.current);
    driveFetch("https://www.googleapis.com/upload/drive/v3/files/" + driveFileIdRef.current + "?uploadType=media", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: payload,
    }).then((res) => {
      if (!res || !res.ok) {
        const err = new Error("Falha ao salvar no Google Drive" + (res ? " (HTTP " + res.status + ")" : ""));
        setDriveSaveStatus("error");
        waiters.forEach((w) => w.reject(err));
      } else {
        setDriveSaveStatus("saved");
        waiters.forEach((w) => w.resolve());
      }
    }).catch((e) => {
      console.warn("Falha ao salvar no Google Drive:", e);
      setDriveSaveStatus("error");
      waiters.forEach((w) => w.reject(e));
    }).finally(() => {
      driveSaveInFlightRef.current = false;
      if (driveSaveDirtyRef.current) {
        driveSaveDirtyRef.current = false;
        const nextWaiters = driveSaveWaitersRef.current;
        driveSaveWaitersRef.current = [];
        performDriveSave(nextWaiters);
      }
    });
  }

  /* Agenda a gravação (com o mesmo debounce de antes) e devolve uma Promise que só resolve depois
     da confirmação real (response.ok) do PATCH correspondente — quem chama pode usar isso para só
     mostrar "salvo" quando o salvamento de fato aconteceu, e "erro ao salvar" caso contrário. */
  function scheduleDriveSave() {
    return new Promise((resolve, reject) => {
      driveSaveWaitersRef.current.push({ resolve, reject });
      clearTimeout(driveSaveTimerRef.current);
      driveSaveTimerRef.current = setTimeout(() => {
        if (!driveFileIdRef.current || !driveStateRef.current) {
          const waiters = driveSaveWaitersRef.current;
          driveSaveWaitersRef.current = [];
          setDriveSaveStatus("error");
          waiters.forEach((w) => w.reject(new Error("armazenamento indisponível")));
          return;
        }
        if (driveSaveInFlightRef.current) {
          driveSaveDirtyRef.current = true; // será reenviado assim que o PATCH atual terminar
          return;
        }
        const waiters = driveSaveWaitersRef.current;
        driveSaveWaitersRef.current = [];
        performDriveSave(waiters);
      }, 800);
    });
  }

  /* adaptador com a mesma "forma" de chamadas (collection/doc/get/set/delete) usada pelo resto do
     app, para que persistDoc/deleteDocRemote e o carregamento abaixo não precisem mudar nada.
     set()/delete() agora devolvem a Promise real de scheduleDriveSave(), então quem aguardar por
     elas só recebe sucesso depois da confirmação HTTP do Google Drive. */
  function buildDriveDbAdapter() {
    const state = driveStateRef.current;
    return {
      doc(path) {
        return {
          async get() {
            const val = state.meta[path];
            return { exists: val !== undefined, data: () => val };
          },
          set(data) { state.meta[path] = data; return scheduleDriveSave(); },
        };
      },
      collection(name) {
        if (!state.collections[name]) state.collections[name] = {};
        return {
          async get() {
            const docs = Object.values(state.collections[name]).map((data) => ({ data: () => data }));
            return { size: docs.length, docs };
          },
          doc(id) {
            return {
              set(data) { state.collections[name][id] = data; return scheduleDriveSave(); },
              delete() { delete state.collections[name][id]; return scheduleDriveSave(); },
            };
          },
        };
      },
    };
  }

  useEffect(() => {
    if (theme === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
  }, [theme]);

  useEffect(() => {
    document.title = identidadeVisual.nomeApp || "Central de Projetos";
  }, [identidadeVisual.nomeApp]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 3200);
    return () => clearTimeout(t);
  }, [toast]);

  useEffect(() => {
    if (authStatus === "nao-configurado" || authStatus === "verificando" || authStatus === "deslogado" || authStatus === "entrando" || authStatus === "erro" || authStatus === "sessao-expirada") return;
    if (dbRef.current) return; // já inicializado nesta sessão
    let cancelled = false;
    (async () => {
      try {
        const fileId = await driveFindOrCreateFile();
        if (cancelled) return;
        driveFileIdRef.current = fileId;
        driveStateRef.current = await driveLoadFileContent(fileId);
        if (cancelled) return;
        const d = buildDriveDbAdapter();
        dbRef.current = d;
        const seedSnap = await d.doc("meta/seed").get();
        let loadedDocuments = null;
        let loadedProjetosArr = null;
        if (seedSnap.exists && seedSnap.data() && seedSnap.data().done) {
          setDbStatus("loading");
          const collections = {
            tasks: setTasks, meetings: setMeetings, decisions: setDecisions, pendencies: setPendencies, risks: setRisks, changes: setChanges, diary: setDiary, notes: setNotes, documents: setDocuments, reminders: setReminders, projetos: setProjects, marcos: setMilestones,
            empresas: setEmpresas, pessoas: setPessoas,
            listas: (arr) => { const obj = {}; arr.forEach((doc) => { obj[doc.id] = doc.itens || []; }); setListas((prev) => ({ ...prev, ...obj })); },
            identidadeVisual: (arr) => { if (arr[0]) setIdentidadeVisual(arr[0]); },
            googleAccountsMeta: setGoogleAccounts, googleEventLinks: setGoogleEventLinks,
          };
          let projetosCount = 0, marcosCount = 0;
          for (const [name, setter] of Object.entries(collections)) {
            const snap = await d.collection(name).get();
            if (cancelled) return;
            if (snap.size > 0) { const arr = snap.docs.map((doc) => doc.data()); setter(arr); if (name === "documents") loadedDocuments = arr; if (name === "projetos") loadedProjetosArr = arr; }
            if (name === "projetos") projetosCount = snap.size;
            if (name === "marcos") marcosCount = snap.size;
          }
          // Projetos e Marcos passaram a ser editáveis e persistidos nesta versão — quem já usava
          // versões anteriores do protótipo ainda não tem essas coleções salvas; nesse caso, semeamos
          // a partir dos dados fictícios (os mesmos já usados como estado inicial) para que a edição
          // futura persista de fato, sem duplicar nem perder nada.
          // marcador próprio (independente da contagem) para não confundir "nunca teve essas coleções"
          // (versão antiga, precisa semear) com "foi limpo de propósito" (ex.: ao trocar de empresa)
          const projetosMarcosSeedSnap = await d.doc("meta/projetosMarcosSeed").get();
          if (!(projetosMarcosSeedSnap.exists && projetosMarcosSeedSnap.data() && projetosMarcosSeedSnap.data().done)) {
            if (projetosCount === 0) await Promise.all(PROJECTS.map((rec) => d.collection("projetos").doc(rec.id).set(rec)));
            if (marcosCount === 0) await Promise.all(MILESTONES.map((rec) => d.collection("marcos").doc(rec.id).set(rec)));
            await d.doc("meta/projetosMarcosSeed").set({ done: true, seededAt: new Date().toISOString() });
          }
          // migração única: a versão anterior do protótipo guardava "documentos e links de apoio" numa
          // coleção separada (resources). A partir desta versão, tudo vive em "documents" (Materiais).
          // Preserva qualquer registro real já salvo por quem abriu o artifact antes desta atualização.
          const migSnap = await d.doc("meta/materiaisMigration").get();
          if (!(migSnap.exists && migSnap.data() && migSnap.data().done)) {
            const resSnap = await d.collection("resources").get();
            if (resSnap.size > 0) {
              const base = loadedDocuments || DOCUMENTS;
              const existingIds = new Set(base.map((x) => x.id));
              const converted = resSnap.docs.map((doc) => doc.data()).filter((r) => !existingIds.has(r.id)).map((r) => ({
                id: r.id, nome: r.titulo, projectId: r.projectId,
                categoria: r.tipo === "documento" ? "Material de apoio" : "Link",
                classificacao: "Material de apoio", versao: "—", data: r.criadoEm || TODAY,
                responsavelOrigem: "clara", descricao: "Migrado da antiga lista de documentos e links de apoio.",
                link: r.url, registrosRelacionados: [],
              }));
              if (converted.length > 0) {
                const merged = [...base, ...converted];
                if (!cancelled) setDocuments(merged);
                await Promise.all(converted.map((rec) => d.collection("documents").doc(rec.id).set(rec)));
              }
            }
            await d.doc("meta/materiaisMigration").set({ done: true, migratedAt: new Date().toISOString() });
          }
          // migração única: Empresas, Pessoas, Listas e Categorias configuráveis e Identidade Visual são
          // novos nesta versão. Quem já usava o app antes não tem essas coleções salvas; semeamos aqui,
          // preservando qualquer "área" de projeto já digitada livremente antes de existir esse cadastro.
          const configMigSnap = await d.doc("meta/configuracoesMigration").get();
          if (!(configMigSnap.exists && configMigSnap.data() && configMigSnap.data().done)) {
            const pessoasSnap = await d.collection("pessoas").get();
            if (pessoasSnap.size === 0) {
              const pessoaClara = { id: "clara", nome: PEOPLE.clara.nome, email: "", empresaId: null, area: "", cargo: "", ativo: true, podeResponsavel: true, podeSponsor: true, observacoes: "", iniciais: PEOPLE.clara.iniciais };
              await d.collection("pessoas").doc("clara").set(pessoaClara);
              if (!cancelled) setPessoas([pessoaClara]);
            }
            const listasSnap = await d.collection("listas").get();
            if (listasSnap.size === 0) {
              const areasExistentes = [...new Set((loadedProjetosArr || []).map((p) => (p.area || "").trim()).filter(Boolean))];
              const listasParaGravar = Object.entries(DEFAULT_LISTS).map(([listId, def]) => {
                const itens = listId === "projeto_area" ? areasExistentes.map((nome, i) => ({ id: nome, nome, ativo: true, ordem: i, systemRole: null })) : def.itens;
                return { id: listId, itens };
              });
              await Promise.all(listasParaGravar.map((doc) => d.collection("listas").doc(doc.id).set(doc)));
              if (!cancelled) {
                const obj = {}; listasParaGravar.forEach((doc) => { obj[doc.id] = doc.itens; });
                setListas((prev) => ({ ...prev, ...obj }));
              }
            }
            const ivSnap = await d.collection("identidadeVisual").get();
            if (ivSnap.size === 0) {
              await d.collection("identidadeVisual").doc("config").set(IDENTIDADE_VISUAL_PADRAO);
              if (!cancelled) setIdentidadeVisual(IDENTIDADE_VISUAL_PADRAO);
            }
            await d.doc("meta/configuracoesMigration").set({ done: true, migratedAt: new Date().toISOString() });
          }
        } else {
          setDbStatus("seeding");
          const seedData = {
            tasks: TASKS, meetings: MEETINGS, decisions: DECISIONS, pendencies: PENDENCIES, risks: RISKS, changes: CHANGES, diary: DIARY, notes: NOTES, documents: DOCUMENTS, reminders: REMINDERS, projetos: PROJECTS, marcos: MILESTONES,
            empresas: EMPRESAS,
            pessoas: [{ id: "clara", nome: PEOPLE.clara.nome, email: "", empresaId: null, area: "", cargo: "", ativo: true, podeResponsavel: true, podeSponsor: true, observacoes: "", iniciais: PEOPLE.clara.iniciais }],
            listas: Object.entries(DEFAULT_LISTS).map(([listId, def]) => ({ id: listId, itens: def.itens })),
            identidadeVisual: [IDENTIDADE_VISUAL_PADRAO],
          };
          for (const [name, arr] of Object.entries(seedData)) {
            await Promise.all(arr.map((rec) => d.collection(name).doc(rec.id).set(rec)));
          }
          if (!cancelled) {
            setPessoas(seedData.pessoas);
            const obj = {}; seedData.listas.forEach((doc) => { obj[doc.id] = doc.itens; });
            setListas((prev) => ({ ...prev, ...obj }));
            setIdentidadeVisual(IDENTIDADE_VISUAL_PADRAO);
          }
          await d.doc("meta/seed").set({ done: true, seededAt: new Date().toISOString() });
          await d.doc("meta/materiaisMigration").set({ done: true, migratedAt: new Date().toISOString() });
          await d.doc("meta/projetosMarcosSeed").set({ done: true, seededAt: new Date().toISOString() });
          await d.doc("meta/configuracoesMigration").set({ done: true, migratedAt: new Date().toISOString() });
        }
        if (!cancelled) setDbStatus("ready");
      } catch (e) {
        console.warn("Falha ao inicializar armazenamento do protótipo:", e);
        if (!cancelled) setDbStatus("error");
      }
    })();
    return () => { cancelled = true; };
  }, [authStatus]);

  function persistDoc(collectionName, id, data) {
    const d = dbRef.current;
    if (!d || !id) return;
    d.collection(collectionName).doc(id).set(data).catch((e) => console.warn("Falha ao salvar", collectionName, id, e));
  }
  /* variante que devolve a Promise (rejeitando em caso de erro) — usada pelo autosave da Anotação,
     que precisa saber se o salvamento realmente terminou para mostrar o status correto */
  function persistDocAwaitable(collectionName, id, data) {
    const d = dbRef.current;
    if (!d || !id) return Promise.reject(new Error("armazenamento indisponível"));
    return d.collection(collectionName).doc(id).set(data);
  }
  function deleteDocRemote(collectionName, id) {
    const d = dbRef.current;
    if (!d || !id) return;
    d.collection(collectionName).doc(id).delete().catch((e) => console.warn("Falha ao excluir", collectionName, id, e));
  }

      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);

  });
  const [downloadsStatus] = useState("ready"); // download do navegador — sempre disponível

     o protótipo do zero, por exemplo ao trocar de empresa */
  async function limparTudo() {
    const collections = ["tasks", "meetings", "decisions", "pendencies", "risks", "changes", "diary", "notes", "reminders", "documents", "projetos", "marcos"];
    setTasks([]); setMeetings([]); setDecisions([]); setPendencies([]); setRisks([]); setChanges([]);
    setDiary([]); setNotes([]); setReminders([]); setDocuments([]); setProjects([]); setMilestones([]);
    if (driveStateRef.current) {

  /* devolve true (backup realmente gerado e baixado) ou false (falhou ou foi cancelado) — quem chama
     (ex.: "Exportar tudo e limpar dados") depende desse retorno para decidir se pode prosseguir */
  async function downloadBackup() {
    if (!downloadsRef.current) { setToast("Exportação de backup não está disponível nesta visualização."); return false; }
    try {
      const payload = {
        formatVersion: 2,
        exportadoEm: new Date().toISOString(),
        data: { ...BACKUP_COLLECTIONS },
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const filename = "central-projetos-backup-" + TODAY + ".json";
      await downloadsRef.current.save({ filename, data: blob });
      setToast("Backup exportado.");
      return true;
    } catch (e) {
      if (e && e.code === "declined") return false;
      console.warn("Falha ao exportar backup:", e);
      setToast("Não foi possível exportar o backup.");
      return false;
    }
  }

  /* substitui uma coleção inteira no Google Drive — não engole erros: quem chama (importBackup)
     precisa saber se alguma gravação falhou antes de anunciar a restauração como concluída */
  async function replaceCollection(name, newArr) {
    const d = dbRef.current;
    if (!d || !Array.isArray(newArr)) return;
    const snap = await d.collection(name).get();
    const oldIds = new Set(snap.docs.map((doc) => doc.id));
    const newIds = new Set(newArr.map((r) => r.id));
    const toDelete = [...oldIds].filter((id) => !newIds.has(id));
    await Promise.all([
      ...toDelete.map((id) => d.collection(name).doc(id).delete()),
      ...newArr.map((rec) => d.collection(name).doc(rec.id).set(rec)),
    ]);
  }

  async function importBackup(parsed) {
    const data = parsed && parsed.data;
    if (!data || typeof data !== "object") { setToast("Arquivo de backup inválido."); return false; }
    const map = Object.entries(BACKUP_SETTERS);
    const toApply = map.filter(([name]) => Array.isArray(data[name]));
    // atualiza a tela de imediato (resposta visual rápida), mas só anuncia a restauração como
    // concluída depois que todas as gravações no Google Drive tiverem sido confirmadas
    toApply.forEach(([name, setter]) => setter(data[name]));
    try {
      await Promise.all(toApply.map(([name]) => replaceCollection(name, data[name])));
    } catch (e) {
      console.warn("Falha ao restaurar backup:", e);
      setToast("Erro ao restaurar backup no Google Drive — os dados na tela foram atualizados, mas nem tudo foi salvo. Tente novamente.");
      return false;
    }
    setToast("Backup restaurado — dados atuais substituídos.");
    return true;
  }

      criadoEm: TODAY, statusAlteradoEm: TODAY, concluidoEm: null,

    // quando quem chamou já registra sua própria entrada de diário (ex.: confirmação de sugestões de IA),

    }

  function setTaskStatus(id, status) {

      const next = { ...t, status, statusAlteradoEm: TODAY, concluidoEm: status === "Concluído" ? TODAY : t.concluidoEm };
      persistDoc("tasks", id, next);
      return next;
    }));
  }
  function updateTaskRecord(id, patch) {
    let next = null;
    setTasks((prev) => prev.map((t) => {
      if (t.id !== id) return t;
      next = { ...t, ...patch };
      if (patch.status && patch.status !== t.status) {
        next.statusAlteradoEm = TODAY;
        next.concluidoEm = patch.status === "Concluído" ? TODAY : t.concluidoEm;

  /* --------------------------------- notas (editor completo) --------------------------------- */
  function nowHora() { const n = new Date(); return String(n.getHours()).padStart(2, "0") + ":" + String(n.getMinutes()).padStart(2, "0"); }
  /* cria a nota já no primeiro autosave do editor — só esse momento gera registro no Diário */
  function addNote({ titulo, conteudo, conteudoHtml, categoria, tags, materiaisRelacionados, projectId, meetingId, origemTipo, origemArquivo }) {
    const hora = nowHora();
    const id = "n" + (Date.now() % 100000) + Math.floor(Math.random() * 99);
    const html = conteudoHtml != null ? conteudoHtml : plainTextToHtml(conteudo);
    const rec = {
      id, projectId: projectId || null, meetingId: meetingId || null,
      titulo: (titulo || "").trim() || "Nota sem título",
      categoria: categoria || null, tags: Array.isArray(tags) ? tags : [], materiaisRelacionados: Array.isArray(materiaisRelacionados) ? materiaisRelacionados : [],
      conteudoHtml: html, conteudo: conteudo != null ? conteudo : htmlToPlainText(html),
      /* origemTipo: "Anotação" (padrão) | "Ata" | "Transcrição" — só é diferente de "Anotação" quando a nota
         nasce de uma importação de Word (ver ImportarWordModal); origemArquivo guarda o nome do .docx importado,
         só para referência — o arquivo original em si não é armazenado (ver limitações da Fase 1). */
      origemTipo: origemTipo || "Anotação", origemArquivo: origemArquivo || null,
      criadoEm: TODAY, criadoHora: hora, editadoEm: TODAY, editadoHora: hora,
    };
    /* rec._persisted: promise que só resolve depois da confirmação real (response.ok) do Google
       Drive — usada pelo autosave do editor de notas para saber quando pode mostrar "salvo" de
       verdade no primeiro salvamento de uma nota nova (addNote não pode virar async porque outros
       pontos do app dependem de receber o registro, com o id, de forma síncrona). */
    const persistPromise = persistDocAwaitable("notes", id, rec);
    rec._persisted = persistPromise;
    persistPromise.catch((e) => console.warn("Falha ao salvar", "notes", id, e));
    setNotes((prev) => [rec, ...prev]);
    if (rec.projectId) {
      addDiaryEntry({
        projectId: rec.projectId, data: TODAY, hora, tipo: "atualizacao",
        titulo: "Nova anotação criada — " + rec.titulo,
        descricao: rec.meetingId ? "Anotação de reunião registrada no projeto." : "Anotação registrada no projeto.",
        relacionado: { tipo: "nota", id },
      });
    }
    return rec;

  /* ----------------------------- listas e categorias configuráveis ----------------------------- */
  /* cada lista é persistida como UM documento (id = listId) com um array "itens" — qualquer alteração
     num item reescreve a lista inteira. "id" de um item nunca muda depois de criado (é o que fica
     gravado nos registros que o usam); "nome" é livremente editável. */
  function slugForListItem(nome, existingIds) {
    let base = normalize(nome).replace(/[^a-z0-9]+/g, "_").replace(/(^_+|_+$)/g, "") || "item";
    let slug = base, n = 2;
    while (existingIds.includes(slug)) { slug = base + "_" + n; n++; }
    return slug;
  }
  function persistLista(listId, itens) { persistDoc("listas", listId, { id: listId, itens }); }
  function addListItem(listId, nome) {
    const nomeTrim = (nome || "").trim();
    if (!nomeTrim) return null;
    const atuais = listas[listId] || [];
    const id = slugForListItem(nomeTrim, atuais.map((i) => i.id));
    const item = { id, nome: nomeTrim, ativo: true, ordem: atuais.length, systemRole: null };
    const next = [...atuais, item];
    setListas((prev) => ({ ...prev, [listId]: next }));
    persistLista(listId, next);
    return item;
  }
  function updateListItem(listId, itemId, patch) {
    const atuais = listas[listId] || [];
    const next = atuais.map((i) => (i.id === itemId ? { ...i, ...patch } : i));
    setListas((prev) => ({ ...prev, [listId]: next }));
    persistLista(listId, next);
  }
  function toggleListItemAtivo(listId, itemId) {
    const atual = (listas[listId] || []).find((i) => i.id === itemId);
    if (atual) updateListItem(listId, itemId, { ativo: !atual.ativo });
  }
  function moveListItem(listId, itemId, direction) {
    const atuais = [...(listas[listId] || [])].sort((a, b) => a.ordem - b.ordem);
    const idx = atuais.findIndex((i) => i.id === itemId);
    const swapWith = idx + direction;
    if (idx < 0 || swapWith < 0 || swapWith >= atuais.length) return;
    const a = atuais[idx].ordem, b = atuais[swapWith].ordem;
    atuais[idx] = { ...atuais[idx], ordem: b };
    atuais[swapWith] = { ...atuais[swapWith], ordem: a };
    setListas((prev) => ({ ...prev, [listId]: atuais }));
    persistLista(listId, atuais);
  }
  /* onde cada lista é usada, para impedir exclusão definitiva de itens já utilizados (ficam só
     desativados) — ver ponto "Evitar exclusão definitiva de itens já utilizados" */
  function isListItemInUse(listId, itemId) {
    const checkers = {
      projeto_status: (id) => projects.some((p) => p.status === id),
      projeto_saude: (id) => projects.some((p) => p.saude === id),
      projeto_area: (id) => projects.some((p) => p.area === id),
      tarefa_status: (id) => tasks.some((t) => t.status === id),
      decisao_status: (id) => decisions.some((d) => d.status === id),
      pendencia_status: (id) => pendencies.some((p) => p.status === id),
      pendencia_prioridade: (id) => pendencies.some((p) => p.prioridade === id),
      risco_tipo: (id) => risks.some((r) => r.tipo === id),
      risco_status: (id) => risks.some((r) => r.status === id),
      risco_probabilidade: (id) => risks.some((r) => r.probabilidade === id),
      risco_impacto: (id) => risks.some((r) => r.impacto === id),
      marco_status: (id) => milestones.some((m) => m.status === id),
      material_tipo: (id) => documents.some((d) => d.categoria === id),
      material_classificacao: (id) => documents.some((d) => d.classificacao === id),
      nota_categoria: (id) => notes.some((n) => n.categoria === id),
      nota_tag_sugerida: (id) => notes.some((n) => (n.tags || []).includes(id)),
      mudanca_tipo: (id) => changes.some((c) => c.tipo === id),
      reuniao_categoria: (id) => meetings.some((m) => m.categoria === id),
    };
    return checkers[listId] ? checkers[listId](itemId) : false;
  }
  function deleteListItem(listId, itemId) {
    const item = (listas[listId] || []).find((i) => i.id === itemId);
    if (!item) return { ok: false, motivo: "Item não encontrado." };
    if (item.systemRole) return { ok: false, motivo: "Este item é usado internamente pelo app e não pode ser excluído — desative-o em vez de excluir." };
    if (isListItemInUse(listId, itemId)) return { ok: false, motivo: "Este item já está em uso em um ou mais registros e não pode ser excluído — desative-o em vez de excluir." };
    const next = (listas[listId] || []).filter((i) => i.id !== itemId);
    setListas((prev) => ({ ...prev, [listId]: next }));
    persistLista(listId, next);
    return { ok: true };
  }

  /* -------------------- confirmação de sugestões de IA (reunião) -------------------- */
  function confirmAiSuggestions(meeting, reviewState) {
    let addedCount = 0;
    const now = new Date();
    const hora = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    const projectId = meeting.projectId;
    const newIds = { decisoesIds: [], pendenciasIds: [], tarefasIds: [], riscosIds: [], mudancasIds: [] };

    reviewState.decisoes.forEach((item) => {
      if (item._status !== "added") return;
      const id = "d" + (Date.now() % 100000) + Math.floor(Math.random() * 99);
      const rec = {
        id, projectId, data: TODAY, decisao: item.titulo, contexto: item.contexto || "",
        motivo: "Identificado a partir da análise de IA da reunião “" + meeting.titulo + "”.",
        alternativas: "", participantes: meeting.participantes, responsavel: "clara",
        impacto: item.impacto || "A avaliar", status: "Em análise",
        reuniaoOrigemId: meeting.id, documentosRelacionadosIds: [],
      };
      setDecisions((prev) => [rec, ...prev]);
      persistDoc("decisions", id, rec);
      addDiaryEntry({ projectId, data: TODAY, hora, tipo: "decisao", titulo: "Decisão registrada (via IA) — " + item.titulo, descricao: "Gerada a partir da análise de IA da reunião “" + meeting.titulo + "”.", relacionado: { tipo: "decisao", id } });
      newIds.decisoesIds.push(id);
      addedCount++;
    });

    reviewState.pendencias.forEach((item) => {
      if (item._status !== "added") return;
      const id = "pd" + (Date.now() % 100000) + Math.floor(Math.random() * 99);
      const rec = {
        id, pendencia: item.titulo, projectId, responsavel: "clara", dependeDe: item.dependeDe || "clara",
        dataAbertura: TODAY, prazo: item.prazoSugerido || null, status: "Aberta", prioridade: "Média",
        ultimoFollowUp: TODAY, proximoAcompanhamento: item.prazoSugerido || null,
        origem: { tipo: "reuniao", id: meeting.id }, observacoes: "Criada a partir da análise de IA.",
      };
      setPendencies((prev) => [rec, ...prev]);
      persistDoc("pendencies", id, rec);
      addDiaryEntry({ projectId, data: TODAY, hora, tipo: "pendencia", titulo: "Pendência criada (via IA) — " + item.titulo, descricao: "Gerada a partir da análise de IA da reunião “" + meeting.titulo + "”.", relacionado: { tipo: "pendencia", id } });
      newIds.pendenciasIds.push(id);
      addedCount++;
    });

    reviewState.tarefas.forEach((item) => {
      if (item._status !== "added") return;
      const rec = addTask({
        titulo: item.titulo, projectId, origem: { tipo: "reuniao", id: meeting.id },
        prioridade: 2, responsavel: item.responsavelSugerido || "clara", prazo: item.prazoSugerido || null,
        suppressDiary: true,
      });
      addDiaryEntry({ projectId, data: TODAY, hora, tipo: "atualizacao", titulo: "Tarefa criada (via IA) — " + item.titulo, descricao: "Enviada para Minha Central e para o projeto.", relacionado: { tipo: "tarefa", id: rec.id } });
      newIds.tarefasIds.push(rec.id);
      addedCount++;
    });

    reviewState.riscos.forEach((item) => {
      if (item._status !== "added") return;
      const id = "r" + (Date.now() % 100000) + Math.floor(Math.random() * 99);
      const rec = {
        id, tipo: item.tipo || "Risco", projectId, descricao: item.titulo, impacto: item.impacto || "A avaliar",
        probabilidade: item.probabilidade || null, responsavel: "clara",
        planoAcao: "A definir.", prazo: null, status: "Ativo", origem: { tipo: "reuniao", id: meeting.id },
      };
      setRisks((prev) => [rec, ...prev]);
      persistDoc("risks", id, rec);
      addDiaryEntry({ projectId, data: TODAY, hora, tipo: "risco", titulo: (item.tipo || "Risco") + " registrado (via IA) — " + item.titulo, descricao: "Gerado a partir da análise de IA da reunião “" + meeting.titulo + "”.", relacionado: { tipo: "risco", id } });
      newIds.riscosIds.push(id);
      addedCount++;
    });

    reviewState.mudancas.forEach((item) => {
      if (item._status !== "added") return;
      const id = "c" + (Date.now() % 100000) + Math.floor(Math.random() * 99);
      const rec = {
        id, data: TODAY, projectId, tipo: item.tipo || "Mudança de escopo", situacaoAnterior: item.situacaoAnterior || "—",
        novaDefinicao: item.titulo, motivo: "Identificado a partir da análise de IA.", solicitante: "clara",
        impacto: item.impacto || "A avaliar", responsavelAprovacao: "clara", origem: { tipo: "reuniao", id: meeting.id },
      };
      setChanges((prev) => [rec, ...prev]);
      persistDoc("changes", id, rec);
      addDiaryEntry({ projectId, data: TODAY, hora, tipo: "mudanca", titulo: "Mudança registrada (via IA) — " + item.titulo, descricao: "Gerada a partir da análise de IA da reunião “" + meeting.titulo + "”.", relacionado: { tipo: "mudanca", id } });
      newIds.mudancasIds.push(id);
      addedCount++;
    });

    const updatedMeeting = {
      ...meeting,
      aiAnalysis: { status: "reviewed", geradoEm: new Date().toISOString() },
      decisoesIds: [...meeting.decisoesIds, ...newIds.decisoesIds],
      pendenciasIds: [...meeting.pendenciasIds, ...newIds.pendenciasIds],
      tarefasIds: [...meeting.tarefasIds, ...newIds.tarefasIds],
      riscosIds: [...meeting.riscosIds, ...newIds.riscosIds],
      mudancasIds: [...meeting.mudancasIds, ...newIds.mudancasIds],
    };
    setMeetings((prev) => prev.map((m) => m.id === meeting.id ? updatedMeeting : m));
    persistDoc("meetings", meeting.id, updatedMeeting);
    setToast(addedCount > 0 ? `${addedCount} ${addedCount === 1 ? "item adicionado" : "itens adicionados"} ao projeto` : "Nenhum item foi adicionado — sugestões descartadas");
  }

      extra: [n.categoria, ...(n.tags || []), n.conteudo, n.meetingId ? (meetings.find((m) => m.id === n.meetingId) || {}).titulo : ""].filter(Boolean).join(" "),
    }));
    reminders.forEach((r) => idx.push({ type: "lembrete", id: r.id, title: r.texto, subtitle: r.projectId ? `${projectById(r.projectId).nome} · Lembrete` : "Geral · Lembrete", projectId: r.projectId }));

function DbStatusLine({ status, saveStatus, onSignOut }) {
  const map = {
    checking: { dot: "neutral", text: "Verificando armazenamento…" },
    seeding: { dot: "info", text: "Preparando seu Google Drive…" },
    loading: { dot: "info", text: "Carregando seus dados do Drive…" },
    unavailable: { dot: "neutral", text: "Alterações não são salvas nesta visualização" },
    error: { dot: "danger", text: "Erro ao salvar — tentando de novo" },
  };
  /* quando o armazenamento já está pronto ("ready"), o estado exibido passa a refletir o
     salvamento em si (driveSaveStatus), em vez de afirmar "salvo" só porque a inicialização terminou */
  const saveMap = {
    idle: { dot: "success", text: "Conectado ao Google Drive" },
    saving: { dot: "info", text: "Salvando alterações…" },
    saved: { dot: "success", text: "Alterações salvas" },
    error: { dot: "danger", text: "Erro ao salvar" },
  };
  const s = status === "ready" ? (saveMap[saveStatus] || saveMap.idle) : (map[status] || map.checking);
  return (
    <div className="db-status" title="Os dados ficam salvos num arquivo no seu Google Drive pessoal" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
      <span><span className={cx("db-status-dot", "tone-" + s.dot)} />{s.text}</span>
      {onSignOut && <button onClick={onSignOut} style={{ background: "none", border: "none", color: "inherit", opacity: 0.6, fontSize: 11.5, cursor: "pointer", textDecoration: "underline", padding: 0 }}>Sair</button>}
    </div>
  );
}

   ================================================================================== */
const TITLES = { portfolio: "Central de Projetos", central: "Minha Central", search: "Busca geral", planning: "Calendário & Cronograma", notes: "Anotações", reminders: "Lembretes", backup: "Dados e Backup", settings: "Configurações" };
function Topbar({ route, navigate, setSidebarOpen, searchQuery, setSearchQuery, searchResults, searchFocused, setSearchFocused, goToRecord }) {
  const blurTimeout = useRef(null);
  const project = route.view === "project" ? projectById(route.projectId) : null;
  const title = project ? project.nome : (TITLES[route.view] || "");
  const grouped = useMemo(() => {
    const groups = {};
    searchResults.forEach((r) => { (groups[r.type] = groups[r.type] || []).push(r); });
    return groups;
  }, [searchResults]);
  const TYPE_LABELS = { projeto: "Projetos", reuniao: "Reuniões", decisao: "Decisões", pendencia: "Pendências", documento: "Documentos", tarefa: "Tarefas", diario: "Diário", risco: "Riscos", mudanca: "Mudanças", marco: "Marcos", nota: "Notas", lembrete: "Lembretes" };

  function selectResult(r) {
    setSearchFocused(false);
    setSearchQuery("");
    if (r.type === "projeto") navigate("project", { projectId: r.id, tab: "visao" });
    else goToRecord(r.type, r.id);
  }

  return (
    <header className="topbar">
      <button className="icon-btn mobile-menu-btn" onClick={() => setSidebarOpen(true)}><Icon name="menu" /></button>
      <div className="topbar-title">
        <h1>{title}</h1>
        {project && (
          <div className="topbar-breadcrumb">
            <button onClick={() => navigate("portfolio")}>Central de Projetos</button>
            <Icon name="chevronRight" size={11} />
            <span>{project.nome}</span>
          </div>
        )}
        {!project && route.view !== "search" && <div className="topbar-breadcrumb">{fmtDateWeekday(TODAY)}</div>}
      </div>

      <div className="search-wrap">
        <Icon name="search" size={14} className="search-icon" />
        <input className="search-input" type="text" placeholder="Buscar projetos, reuniões, decisões, documentos, tarefas…"
          value={searchQuery}
          onChange={(e) => setSearchQuery(e.target.value)}
          onFocus={() => setSearchFocused(true)}
          onBlur={() => { blurTimeout.current = setTimeout(() => setSearchFocused(false), 150); }}
          onKeyDown={(e) => { if (e.key === "Enter" && searchQuery.trim()) { setSearchFocused(false); navigate("search"); } }}
        />
        {searchFocused && searchQuery.trim() && (
          <div className="search-results">
            {searchResults.length === 0 && <div className="search-empty">Nenhum resultado para “{searchQuery}”.</div>}
            {Object.keys(grouped).slice(0, 6).map((type) => (
              <div className="search-results-group" key={type}>
                <div className="search-results-group-title">{TYPE_LABELS[type] || type}</div>
                {grouped[type].slice(0, 4).map((r) => (
                  <div className="search-result-item" key={type + r.id} onMouseDown={() => selectResult(r)}>
                    <strong>{r.title}</strong>
                    <span>{r.subtitle}</span>
                  </div>
                ))}
              </div>
            ))}
            {searchResults.length > 0 && (
              <div className="search-result-item" style={{ textAlign: "center" }} onMouseDown={() => { setSearchFocused(false); navigate("search"); }}>
                <strong style={{ color: "var(--link)" }}>Ver todos os {searchResults.length} resultados para “{searchQuery}”</strong>
              </div>
            )}
          </div>
        )}
      </div>
    </header>
  );
}

function PortfolioView({ ctx }) {
  const [filters, setFilters] = useState({ status: "Todos", saude: "Todas", area: "Todas", empresa: "Todas", prioridade: "Todas", responsavel: "Todos", periodo: "Todos", arquivado: "ativos" });
  const [viewMode, setViewMode] = useState("cards");
  const { tasks, pendencies, decisions, milestones, diary, openProject, setQuickList, goToRecord } = ctx;
  const allProjects = ctx.projects;
  const liveProjects = allProjects.filter((p) => !p.arquivado); // base para KPIs — arquivados não entram nos indicadores do portfólio

  const areas = useMemo(() => Array.from(new Set(allProjects.map((p) => p.area))), [allProjects]);
  const responsaveis = useMemo(() => Array.from(new Set(allProjects.map((p) => p.responsavel))), [allProjects]);

  function matchesPeriodo(p) {
    if (filters.periodo === "Todos") return true;
    const dias = daysUntil(p.prazoPrevisto);
    if (filters.periodo === "Atrasados") return p.status !== "Concluído" && dias < 0;
    if (filters.periodo === "30 dias") return dias >= 0 && dias <= 30;
    if (filters.periodo === "90 dias") return dias >= 0 && dias <= 90;
    if (filters.periodo === "Mais de 90 dias") return dias > 90;
    return true;
  }
  const filtered = allProjects.filter((p) =>
    (filters.arquivado === "ativos" ? !p.arquivado : filters.arquivado === "arquivados" ? !!p.arquivado : true) &&
    (filters.status === "Todos" || p.status === filters.status) &&
    (filters.saude === "Todas" || p.saude === filters.saude) &&
    (filters.area === "Todas" || p.area === filters.area) &&
    (filters.empresa === "Todas" || (filters.empresa === "__pessoal__" ? !p.empresaId : p.empresaId === filters.empresa)) &&
    (filters.prioridade === "Todas" || String(priorityInfo(p.prioridade).valor) === filters.prioridade) &&
    (filters.responsavel === "Todos" || p.responsavel === filters.responsavel) &&
    matchesPeriodo(p)
  );
  const defaultFilters = { status: "Todos", saude: "Todas", area: "Todas", empresa: "Todas", prioridade: "Todas", responsavel: "Todos", periodo: "Todos", arquivado: "ativos" };
  const filtersActive = Object.keys(defaultFilters).some((k) => filters[k] !== defaultFilters[k]);

  /* KPIs — sempre calculados sobre projetos ativos (não arquivados) */
  const ativos = liveProjects.filter((p) => p.status !== "Concluído" && p.status !== "Pausado").length;
  const comAlerta = liveProjects.filter((p) => p.status !== "Concluído" && (p.saude === "Atenção" || p.saude === "Crítico"));
  const pendAtrasadas = pendencies.filter((p) => p.status === "Atrasada" || (p.prazo && daysUntil(p.prazo) < 0 && p.status !== "Resolvida"));
  const tarefasHoje = tasks.filter((t) => t.responsavel === "clara" && t.prazo === TODAY && t.status !== "Concluído");
  const decisoesPendentes = decisions.filter((d) => d.status === "Em análise" || d.status === "Aguardando definição");
  const marcosProximos = milestones.filter((m) => !m.dataRealizada && daysUntil(m.previsao) >= 0 && daysUntil(m.previsao) <= 14);

  const projetosAtrasados = liveProjects.filter((p) => p.status !== "Concluído" && daysUntil(p.prazoPrevisto) < 0);
  const semAtualizacao = liveProjects.filter((p) => isStale(p, ctx));

  return (
    <div>

        <KpiTile label="Minhas tarefas hoje" value={tarefasHoje.length} tone="accent" sub={fmtDateLong(TODAY)} onClick={() => ctx.navigate("central")} />

        <KpiTile label="Marcos próximos" value={marcosProximos.length} tone="info" sub="nos próximos 14 dias" onClick={() => setQuickList({ title: "Marcos nos próximos 14 dias", items: marcosProximos.map((m) => ({ type: "marco", id: m.id })) })} />
      </div>

      <div className="mini-stats-row">

   ================================================================================== */
/* "Meu foco hoje" — até 5 itens, por regra simples e determinística, sem duplicar. */
function computeMeuFocoHoje(ctx) {
  const openTasks = ctx.tasks.filter((t) => t.responsavel === "clara" && t.status !== "Concluído");
  const openPend = ctx.pendencies.filter((p) => p.responsavel === "clara" && p.status !== "Resolvida");
  const picked = [];
  const keys = new Set();
  function add(kind, item, motivo) {
    const key = kind + item.id;
    if (keys.has(key) || picked.length >= 5) return;
    keys.add(key);
    picked.push({ kind, item, motivo });
  }
  openTasks.filter((t) => t.prazo && daysUntil(t.prazo) < 0).forEach((t) => add("tarefa", t, "Atrasada"));
  openPend.filter((p) => p.prazo && daysUntil(p.prazo) < 0).forEach((p) => add("pendencia", p, "Atrasada"));
  openTasks.filter((t) => t.prazo && daysUntil(t.prazo) === 0).forEach((t) => add("tarefa", t, "Vence hoje"));
  openPend.filter((p) => p.prazo && daysUntil(p.prazo) === 0).forEach((p) => add("pendencia", p, "Vence hoje"));
  openTasks.filter((t) => priorityInfo(t.prioridade).valor <= 1).forEach((t) => add("tarefa", t, "Prioridade alta"));
  openPend.filter((p) => p.prioridade === "Alta").forEach((p) => add("pendencia", p, "Prioridade alta"));
  openTasks.filter((t) => t.status === "Aguardando").forEach((t) => add("tarefa", t, "Follow-up necessário"));
  openPend.filter((p) => p.proximoAcompanhamento && daysUntil(p.proximoAcompanhamento) <= 0).forEach((p) => add("pendencia", p, "Acompanhamento vencido"));
  return picked.slice(0, 5);
}
function FocoHojeRow({ entry, ctx }) {
  const { kind, item, motivo } = entry;
  const isTask = kind === "tarefa";
  const project = item.projectId ? projectById(item.projectId) : null;
  const title = isTask ? item.titulo : item.pendencia;
  return (
    <div className="item-row" onClick={() => ctx.openDrawer(isTask ? "tarefa" : "pendencia", item.id)}>
      <span className={cx("feed-icon", isTask ? "tone-info" : "tone-warning")} style={{ marginTop: 1 }}><Icon name={isTask ? "check" : "clock"} size={14} /></span>
      <div className="item-row-main">
        <span className="item-row-title">{title}</span>
        <div className="item-row-tags">
          <Pill tone="neutral">{project ? project.nome : "Pessoal"}</Pill>
          <Pill tone={motivo === "Atrasada" ? "danger" : "accent"}>{motivo}</Pill>
        </div>
      </div>
      <div className="item-row-side">
        <span className="item-row-date">{isTask ? (item.prazo ? fmtDate(item.prazo) : "sem prazo") : (item.prazo ? fmtDate(item.prazo) : "—")}</span>
      </div>
    </div>
  );
}
function MinhaCentralView({ ctx }) {
  const { tasks, addTask, setTaskStatus, openDrawer } = ctx;
  const [novoTitulo, setNovoTitulo] = useState("");
  const [novoProjeto, setNovoProjeto] = useState("");
  const [filtroStatus, setFiltroStatus] = useState("Todos");
  const foco = useMemo(() => computeMeuFocoHoje(ctx), [ctx.tasks, ctx.pendencies]);

  function handleAdd(e) {
    e.preventDefault();
    if (!novoTitulo.trim()) return;
    addTask({ titulo: novoTitulo.trim(), projectId: novoProjeto || null });
    setNovoTitulo("");
  }

  // nesta versão, "Minha Central" consolida tarefas — filtro por responsável poderia ser adicionado depois
  const mine = filtroStatus === "Todos" ? tasks : tasks.filter((t) => t.status === filtroStatus);
  const buckets = { atrasadas: [], hoje: [], semana: [], proximas: [], aguardando: [], semPrazo: [], concluidas: [] };
  mine.forEach((t) => {
    if (t.status === "Concluído") { buckets.concluidas.push(t); return; }
    if (t.status === "Aguardando") { buckets.aguardando.push(t); return; }
    if (!t.prazo) { buckets.semPrazo.push(t); return; }
    const diff = daysUntil(t.prazo);
    if (diff < 0) buckets.atrasadas.push(t);
    else if (diff === 0) buckets.hoje.push(t);
    else if (diff <= 7) buckets.semana.push(t);
    else buckets.proximas.push(t);
  });
  const sortByPrazo = (a, b) => (a.prazo || "9999") < (b.prazo || "9999") ? -1 : 1;
  Object.keys(buckets).forEach((k) => buckets[k].sort(sortByPrazo));

  const sections = [
    { key: "atrasadas", label: "Atrasadas", tone: "danger", icon: "alert" },
    { key: "hoje", label: "Hoje", icon: "target" },
    { key: "semana", label: "Esta semana", icon: "calendar" },
    { key: "aguardando", label: "Aguardando terceiros", tone: "warning", icon: "clock" },
    { key: "proximas", label: "Próximas", icon: "chevronRight" },
    { key: "semPrazo", label: "Sem prazo", icon: "layers" },
    { key: "concluidas", label: "Concluídas recentemente", icon: "check" },
  ];

  return (
    <div className="content-scroll narrow" style={{ padding: 0 }}>
      <div className="section-head">
        <h2>Organização diária</h2>
        <span className="hint">{mine.filter((t) => t.status !== "Concluído").length} tarefas em aberto</span>
      </div>

      <div style={{ display: "flex", gap: 8, alignItems: "center", margin: "0 0 14px" }}>
        <span className="k" style={{ fontSize: 11.5 }}>Filtrar por status</span>
        <select value={filtroStatus} onChange={(e) => setFiltroStatus(e.target.value)} style={{ ...fieldInputStyle, width: "auto" }}>
          <option value="Todos">Todos</option>
          {(ctx.listas.tarefa_status || []).filter((i) => i.ativo).map((i) => <option key={i.id} value={i.id}>{i.nome}</option>)}
        </select>
      </div>

      <div className="group-heading tone-accent"><Icon name="target" size={13} /> Meu foco hoje <span className="n">{foco.length}</span></div>
      {foco.length === 0 && <div style={{ fontSize: 12.5, color: "var(--text-muted)", padding: "0 0 10px 4px" }}>Nada urgente por aqui hoje.</div>}
      <div className="list-stack" style={{ marginBottom: 22 }}>
        {foco.map((entry) => <FocoHojeRow key={entry.kind + entry.item.id} entry={entry} ctx={ctx} />)}
      </div>

      <form className="quick-add" onSubmit={handleAdd}>
        <Icon name="plus" size={15} style={{ color: "var(--text-muted)", marginLeft: 4 }} />
        <input type="text" placeholder="Nova mini tarefa — ex.: Cobrar fornecedor sobre integração" value={novoTitulo} onChange={(e) => setNovoTitulo(e.target.value)} />
        <select value={novoProjeto} onChange={(e) => setNovoProjeto(e.target.value)}>
          <option value="">Sem projeto</option>
          {ctx.projects.filter((p) => !p.arquivado).map((p) => <option key={p.id} value={p.id}>{p.nome}</option>)}
        </select>
        <button type="submit" className="btn btn-primary btn-sm">Adicionar</button>
      </form>

      {sections.map((s) => (
        <div key={s.key}>
          <div className={cx("group-heading", s.tone && "tone-" + s.tone)}>
            <Icon name={s.icon} size={13} /> {s.label} <span className="n">{buckets[s.key].length}</span>
          </div>
          {buckets[s.key].length === 0 && <div style={{ fontSize: 12.5, color: "var(--text-muted)", padding: "0 0 6px 4px" }}>Nada por aqui.</div>}
          <div className="list-stack" style={{ marginBottom: 6 }}>
            {buckets[s.key].slice(0, s.key === "concluidas" ? 6 : 50).map((t) => (
              <TaskRow key={t.id} task={t} onOpen={() => openDrawer("tarefa", t.id)} onToggle={() => setTaskStatus(t.id, t.status === "Concluído" ? "A fazer" : "Concluído")} />
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}
