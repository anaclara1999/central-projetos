          <div className="project-header-meta-item"><span className="k">Responsável</span><span className="v"><PersonChip personKey={project.responsavel} /></span></div>
          {project.sponsor && <div className="project-header-meta-item"><span className="k">Sponsor</span><span className="v"><PersonChip personKey={project.sponsor} /></span></div>}
          <div className="project-header-meta-item"><span className="k">Início</span><span className="v mono">{fmtDate(project.dataInicio)}</span></div>
          <div className="project-header-meta-item"><span className="k">Prazo previsto</span><span className="v mono">{fmtDate(project.prazoPrevisto)}</span></div>
          <div className="project-header-meta-item"><span className="k">Próximo marco</span><span className="v">{proximoMarco ? `${proximoMarco.marco} (${fmtDate(proximoMarco.previsao)})` : "—"}</span></div>
          <div className="project-header-meta-item"><span className="k">Próxima ação</span><span className="v">{project.proximaAcao || "—"}</span></div>
          <div className="project-header-meta-item"><span className="k">Última atualização</span><span className="v mono">{fmtDate(project.ultimaAtualizacao)}</span></div>
        </div>
      </div>

      <div className="attention-row">
        <AttentionTile label="Pendências abertas" n={stats.pendAbertas} onClick={() => setTab("visao")} />
        <AttentionTile label="Pendências atrasadas" n={stats.pendAtrasadas} tone={stats.pendAtrasadas > 0 ? "danger" : null} onClick={() => setTab("visao")} />
        <AttentionTile label="Minhas tarefas" n={stats.minhasTarefas} onClick={() => setTab("tarefas")} />
        <AttentionTile label="Riscos ativos" n={stats.riscosAtivos} tone={stats.riscosAtivos > 0 ? "warning" : null} onClick={() => setTab("visao")} />
        <AttentionTile label="Decisões pendentes" n={stats.decisoesPendentes} onClick={() => setTab("visao")} />
        <AttentionTile label="Próximo marco" n={proximoMarco ? daysUntil(proximoMarco.previsao) + "d" : "—"} onClick={() => setTab("cronograma")} isText />
      </div>

      <div className="tabs-strip">
        {TABS.map((t) => (
          <button key={t.key} className={cx("tab-btn", tab === t.key && "active")} onClick={() => setTab(t.key)}>
            {t.label}
            {tabCounts[t.key] !== undefined && <span className="badge-count">{tabCounts[t.key]}</span>}
          </button>
        ))}
      </div>

      {tab === "visao" && <VisaoGeralTab project={project} ctx={ctx} setTab={setTab} />}
      {tab === "tarefas" && <TarefasTab project={project} ctx={ctx} />}
      {tab === "reunioes" && <ReunioesTab project={project} ctx={ctx} />}
      {tab === "notas" && <NotasTab project={project} ctx={ctx} setTab={setTab} />}
      {tab === "materiais" && <MateriaisTab project={project} ctx={ctx} />}
      {tab === "cronograma" && <CronogramaTab project={project} ctx={ctx} />}
      {tab === "diario" && <DiarioTab project={project} ctx={ctx} />}
    </div>
  );
}

function AttentionTile({ label, n, tone, onClick, isText }) {
  return (
    <div className={cx("attention-tile", tone && "tone-" + tone)} onClick={onClick}>
      <span className={cx("n", !isText && "mono")}>{n}</span>
      <span className="l">{label}</span>
    </div>
  );
}

/* -------------------------------- VISÃO GERAL -------------------------------- */
function VisaoGeralTab({ project, ctx, setTab }) {
  const diaryItems = ctx.diary.filter((d) => d.projectId === project.id).sort((a, b) => (a.data + a.hora < b.data + b.hora ? 1 : -1)).slice(0, 5);
  const marcos = ctx.milestones.filter((m) => m.projectId === project.id).sort((a, b) => a.previsao < b.previsao ? -1 : 1);
  const dependeDe = (project.dependeDeIds || []).map((id) => projectById(id)).filter(Boolean);
  const dependenciaPara = ctx.projects.filter((p) => (p.dependeDeIds || []).includes(project.id));

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 20 }}>
        <div>
          <div className="section-head"><h2>Sobre o projeto</h2></div>
          <div className="card" style={{ padding: 16, marginBottom: 22 }}>
            <p style={{ fontSize: 13, color: "var(--text-secondary)", lineHeight: 1.6 }}>{project.descricao}</p>
            {project.observacoes && (
              <div className="field-block" style={{ margin: "12px 0 0" }}>
                <span className="k">Observações</span>
                <span className="v">{project.observacoes}</span>
              </div>
            )}
            <div className="field-block" style={{ margin: "12px 0 0" }}>
              <span className="k">Pasta no Drive</span>
              <span className="v" style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                {project.pastaDrive && <a href={project.pastaDrive.link} target="_blank" rel="noreferrer"><Icon name="external" size={12} /> {project.pastaDrive.nome}</a>}
                <DrivePickerButton ctx={ctx} mode="folder"
                  onPick={(doc, accountId) => ctx.updateProject(project.id, { pastaDrive: { accountId, id: doc.id, nome: doc.nome, link: doc.link } })}
                  label={project.pastaDrive ? "Trocar pasta" : "Selecionar pasta no Drive"} />
              </span>
            </div>
          </div>

          {(dependeDe.length > 0 || dependenciaPara.length > 0) && (
            <>
              <div className="section-head"><h2>Dependências</h2></div>
              <div className="card" style={{ padding: 16, marginBottom: 22 }}>
                {dependeDe.length > 0 && (
                  <div className="field-block" style={{ margin: "0 0 12px" }}>
                    <span className="k">Depende de</span>
                    <div className="subrecord-chip-list">{dependeDe.map((p) => <span key={p.id} className="subrecord-chip" onClick={() => ctx.openProject(p.id)}><Icon name="layers" size={12} /> {p.nome}</span>)}</div>
                  </div>
                )}
                {dependenciaPara.length > 0 && (
                  <div className="field-block" style={{ margin: 0 }}>
                    <span className="k">É dependência para</span>
                    <div className="subrecord-chip-list">{dependenciaPara.map((p) => <span key={p.id} className="subrecord-chip" onClick={() => ctx.openProject(p.id)}><Icon name="layers" size={12} /> {p.nome}</span>)}</div>
                  </div>
                )}
              </div>
            </>
          )}

          <div className="section-head"><h2>Últimos acontecimentos</h2><button className="btn btn-ghost btn-sm" onClick={() => setTab("diario")}>Ver diário completo</button></div>
          <div className="card" style={{ padding: "6px 16px", marginBottom: 22 }}>
            {diaryItems.length === 0 && <EmptyState text="Nenhum registro no diário ainda." />}
            <div className="feed-list">
              {diaryItems.map((d) => (
                <div className="feed-item" key={d.id} onClick={() => d.relacionado && ctx.goToRecord(d.relacionado.tipo, d.relacionado.id)}>
                  <FeedIcon tipo={d.tipo} />
                  <div className="feed-body">
                    <span className="feed-time">{relLabel(d.data, d.hora)}</span>
                    <span className="feed-title">{d.titulo}</span>
                    <span className="feed-desc">{d.descricao}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>

        <div>
          <div className="section-head"><h2>Cronograma</h2><button className="btn btn-ghost btn-sm" onClick={() => setTab("cronograma")}>Ver tudo</button></div>
          <div className="card" style={{ padding: "6px 16px", marginBottom: 22 }}>
            <div className="milestone-track">
              {marcos.slice(0, 5).map((m, i) => <MilestoneRow key={m.id} m={m} isLast={i === Math.min(4, marcos.length - 1)} onOpen={() => ctx.openDrawer("marco", m.id)} />)}
            </div>
          </div>
        </div>
      </div>

      {/* Decisões, Pendências, Riscos e Mudanças: categorias dentro da Visão Geral, não abas
          próprias — cada bloco reaproveita o mesmo componente que antes vivia numa aba dedicada. */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginTop: 8, paddingTop: 22, borderTop: "1px solid var(--border)" }}>
        <DecisoesTab project={project} ctx={ctx} />
        <PendenciasTab project={project} ctx={ctx} />
        <RiscosTab project={project} ctx={ctx} />
        <MudancasTab project={project} ctx={ctx} />
      </div>
    </div>
  );
}

/* ----------------------------------- DIÁRIO ----------------------------------- */
function DiarioTab({ project, ctx }) {
  const [filterType, setFilterType] = useState("Todos");
  const all = ctx.diary.filter((d) => d.projectId === project.id);
  const types = Array.from(new Set(all.map((d) => d.tipo)));
  const list = (filterType === "Todos" ? all : all.filter((d) => d.tipo === filterType)).sort((a, b) => (a.data + a.hora < b.data + b.hora ? 1 : -1));
  const groups = {};
  list.forEach((d) => { (groups[d.data] = groups[d.data] || []).push(d); });

  return (
    <div>
      <div className="section-head">
        <h2>Diário do projeto</h2>
        <span className="hint">Memória cronológica de tudo o que aconteceu — reuniões, decisões, documentos, mudanças e mais.</span>
      </div>
      <div className="diary-filter-chips">
        <span className={cx("chip", filterType === "Todos" && "active")} onClick={() => setFilterType("Todos")}>Todos</span>
        {types.map((t) => <span key={t} className={cx("chip", filterType === t && "active")} onClick={() => setFilterType(t)}>{DIARY_TYPE_LABEL[t] || t}</span>)}
      </div>

      {Object.keys(groups).length === 0 && <EmptyState text="Nenhum registro para este filtro." />}
      {Object.keys(groups).sort().reverse().map((date) => (
        <div className="diary-day-group" key={date}>
          <div className="diary-day-label"><Icon name="calendar" size={14} /> {fmtDateWeekday(date)}</div>
          <div className="diary-entries">
            {groups[date].map((d) => (
              <div className="diary-entry" key={d.id}>
                <div className="diary-entry-time">{d.hora}</div>
                <div className="diary-entry-title" onClick={() => d.relacionado && ctx.goToRecord(d.relacionado.tipo, d.relacionado.id)}>{d.titulo}</div>
                <div className="diary-entry-desc">{d.descricao}</div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ----------------------------------- TAREFAS ----------------------------------- */
function TarefasTab({ project, ctx }) {
  const [novoTitulo, setNovoTitulo] = useState("");
  const [filtroStatus, setFiltroStatus] = useState("Todos");
  const listaCompleta = ctx.tasks.filter((t) => t.projectId === project.id).sort((a, b) => (a.prazo || "9999") < (b.prazo || "9999") ? -1 : 1);
  const list = filtroStatus === "Todos" ? listaCompleta : listaCompleta.filter((t) => t.status === filtroStatus);
  const abertas = list.filter((t) => t.status !== "Concluído");
  const concluidas = list.filter((t) => t.status === "Concluído");

  function handleAdd(e) {
    e.preventDefault();
    if (!novoTitulo.trim()) return;
    ctx.addTask({ titulo: novoTitulo.trim(), projectId: project.id });
    setNovoTitulo("");
  }

  return (
    <div>
      <div className="section-head"><h2>Tarefas do projeto</h2><span className="hint">{abertas.length} em aberto</span></div>
      <form className="quick-add" onSubmit={handleAdd}>
        <Icon name="plus" size={15} style={{ color: "var(--text-muted)", marginLeft: 4 }} />
        <input type="text" placeholder="Nova tarefa vinculada a este projeto" value={novoTitulo} onChange={(e) => setNovoTitulo(e.target.value)} />
        <button type="submit" className="btn btn-primary btn-sm">Adicionar</button>
      </form>
      <div style={{ display: "flex", gap: 8, alignItems: "center", margin: "0 0 14px" }}>
        <span className="k" style={{ fontSize: 11.5 }}>Filtrar por status</span>
        <select value={filtroStatus} onChange={(e) => setFiltroStatus(e.target.value)} style={{ ...fieldInputStyle, width: "auto" }}>
          <option value="Todos">Todos</option>
          {(ctx.listas.tarefa_status || []).filter((i) => i.ativo).map((i) => <option key={i.id} value={i.id}>{i.nome}</option>)}
        </select>
      </div>
      <div className="list-stack" style={{ marginBottom: 22 }}>
        {abertas.length === 0 && <EmptyState text="Nenhuma tarefa em aberto neste projeto." />}
        {abertas.map((t) => <TaskRow key={t.id} task={t} onOpen={() => ctx.openDrawer("tarefa", t.id)} onToggle={() => ctx.setTaskStatus(t.id, "Concluído")} />)}
      </div>
      {concluidas.length > 0 && (
        <>
          <div className="group-heading">Concluídas <span className="n">{concluidas.length}</span></div>
          <div className="list-stack">
            {concluidas.map((t) => <TaskRow key={t.id} task={t} onOpen={() => ctx.openDrawer("tarefa", t.id)} onToggle={() => ctx.setTaskStatus(t.id, "A fazer")} />)}
          </div>
        </>
      )}
    </div>
  );
}

function DecisoesTab({ project, ctx }) {

function DecisionRow({ d, onOpen }) {

/* --------------------------------- PENDÊNCIAS ----------------------------------- */
function PendenciasTab({ project, ctx }) {
  const all = ctx.pendencies.filter((p) => p.projectId === project.id);
  const atrasadas = all.filter((p) => p.status === "Atrasada" || (p.prazo && daysUntil(p.prazo) < 0 && p.status !== "Resolvida"));
  const hoje = all.filter((p) => p.prazo && daysUntil(p.prazo) === 0 && p.status !== "Resolvida" && !atrasadas.includes(p));
  const prox7 = all.filter((p) => p.prazo && daysUntil(p.prazo) > 0 && daysUntil(p.prazo) <= 7 && p.status !== "Resolvida");
  const aguardando = all.filter((p) => !atrasadas.includes(p) && !hoje.includes(p) && !prox7.includes(p) && p.status !== "Resolvida");
  const resolvidas = all.filter((p) => p.status === "Resolvida");

  const groups = [
    { label: "Atrasadas", tone: "danger", items: atrasadas },
    { label: "Vencem hoje", tone: "warning", items: hoje },
    { label: "Próximos 7 dias", items: prox7 },
    { label: "Aguardando terceiros", items: aguardando },
    { label: "Resolvidas", items: resolvidas },
  ];
  return (
    <div>
      <div className="section-head"><h2>Pendências</h2><span className="hint">{all.filter((p) => p.status !== "Resolvida").length} em aberto</span></div>
      {groups.map((g) => g.items.length > 0 && (
        <div key={g.label}>
          <div className={cx("group-heading", g.tone && "tone-" + g.tone)}>{g.label} <span className="n">{g.items.length}</span></div>
          <div className="list-stack" style={{ marginBottom: 10 }}>
            {g.items.map((p) => <PendencyRow key={p.id} p={p} onOpen={() => ctx.openDrawer("pendencia", p.id)} />)}
          </div>
        </div>
      ))}
      {all.length === 0 && <EmptyState text="Nenhuma pendência registrada." />}
    </div>
  );
}
function PendencyRow({ p, onOpen }) {
  return (
    <div className="item-row" onClick={onOpen}>
      <span className="feed-icon tone-warning" style={{ marginTop: 1 }}><Icon name="clock" size={14} /></span>
      <div className="item-row-main">
        <span className="item-row-title">{p.pendencia}</span>
        <span className="item-row-sub">Depende de <PersonChip personKey={p.dependeDe} /></span>
      </div>
      <div className="item-row-side">
        <Pill tone={pendTone(p.status)}>{p.status}</Pill>
        <span className="item-row-date">{p.prazo ? fmtDate(p.prazo) : "sem prazo"}</span>
      </div>
    </div>
  );
}

/* --------------------------------- MATERIAIS ----------------------------------- */
function MateriaisTab({ project, ctx }) {
  const [cat, setCat] = useState("Todas");
  const [classif, setClassif] = useState("Todas");
  const [nome, setNome] = useState("");
  const [tipoMaterial, setTipoMaterial] = useState("");
  const [classificacao, setClassificacao] = useState("Material de apoio");
  const [link, setLink] = useState("");

  const all = ctx.documents.filter((d) => d.projectId === project.id);
  const categorias = Array.from(new Set(all.map((d) => d.categoria)));
  const list = all
    .filter((d) => cat === "Todas" || d.categoria === cat)
    .filter((d) => classif === "Todas" || d.classificacao === classif);

  function handleAdd(e) {
    e.preventDefault();
    if (!nome.trim()) return;
    ctx.addDocument({ projectId: project.id, nome, categoria: tipoMaterial, classificacao, link });
    setNome(""); setLink("");
  }
  function handlePickFile(doc, accountId) {
    ctx.addDocument({ projectId: project.id, nome: doc.nome, categoria: tipoMaterial, classificacao, link: doc.link, driveAccountId: accountId, driveFileId: doc.id });
  }

  return (
    <div>
      <div className="section-head"><h2>Documentos</h2><span className="hint">PRDs, atas, apresentações, planilhas, links e demais referências reunidas para o projeto</span></div>

      <form className="quick-add" onSubmit={handleAdd} style={{ flexWrap: "wrap" }}>
        <input type="text" placeholder="Nome do documento" value={nome} onChange={(e) => setNome(e.target.value)} style={{ flex: "1 1 200px" }} />
        <ConfigListSelect ctx={ctx} listId="material_tipo" value={tipoMaterial} onChange={setTipoMaterial} allowEmpty emptyLabel="Tipo…" style={{}} />
        <ConfigListSelect ctx={ctx} listId="material_classificacao" value={classificacao} onChange={setClassificacao} style={{}} />
        <input type="text" placeholder="Link (https://…)" value={link} onChange={(e) => setLink(e.target.value)} style={{ flex: "1 1 200px" }} />
        <button type="submit" className="btn btn-primary btn-sm">Adicionar documento</button>
      </form>
      <div style={{ margin: "0 0 14px" }}>
        <DrivePickerButton ctx={ctx} mode="file" startFolder={project.pastaDrive} onPick={handlePickFile} label="Selecionar do Google Drive" />
      </div>

      <div className="diary-filter-chips">
        <span className={cx("chip", cat === "Todas" && "active")} onClick={() => setCat("Todas")}>Todos os tipos</span>
        {categorias.map((c) => <span key={c} className={cx("chip", cat === c && "active")} onClick={() => setCat(c)}>{c}</span>)}
      </div>
      <div className="diary-filter-chips">
        <span className={cx("chip", classif === "Todas" && "active")} onClick={() => setClassif("Todas")}>Todas as classificações</span>
        {(ctx.listas.material_classificacao || []).filter((i) => i.ativo).map((i) => <span key={i.id} className={cx("chip", classif === i.id && "active")} onClick={() => setClassif(i.id)}>{i.nome}</span>)}
      </div>

      <div className="list-stack">
        {list.length === 0 && <EmptyState text="Nenhum documento para este filtro." />}
        {list.map((d) => (
          <div className="item-row" key={d.id} onClick={() => ctx.openDrawer("documento", d.id)}>
            <span className="feed-icon tone-neutral" style={{ marginTop: 1 }}><Icon name="doc" size={14} /></span>
            <div className="item-row-main">
              <span className="item-row-title">{d.nome}</span>
              <span className="item-row-sub">{d.descricao}</span>
              <div className="item-row-tags">
                <Pill tone="neutral">{d.categoria}</Pill>
                <Pill tone={d.classificacao === "Documento oficial" ? "info" : "accent"}>{d.classificacao}</Pill>
                {d.versao && d.versao !== "—" && <span style={{ fontSize: 11.5, color: "var(--text-muted)" }}>{d.versao}</span>}
              </div>
            </div>
            <div className="item-row-side">
              <span className="item-row-date">{fmtDate(d.data)}</span>
              <PersonChip personKey={d.responsavelOrigem} />
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* --------------------------------- CRONOGRAMA ----------------------------------- */
function CronogramaTab({ project, ctx }) {
  const list = ctx.milestones.filter((m) => m.projectId === project.id).sort((a, b) => a.previsao < b.previsao ? -1 : 1);
  return (
    <div>
      <div className="section-head">
        <h2>Cronograma e marcos</h2>
        <button className="btn btn-primary btn-sm" onClick={() => ctx.openMilestoneForm(project.id)}><Icon name="plus" size={13} /> Novo marco</button>
      </div>
      <span className="hint">Visão executiva — apenas grandes entregas</span>

function CalendarView({ ctx }) {
  const [cursor, setCursor] = useState(() => {
    const [y, m] = TODAY.split("-");
    return { year: parseInt(y, 10), month: parseInt(m, 10) - 1 };
  });
  const [filterFonte, setFilterFonte] = useState("todos"); // todos | central | google
  const [filterConta, setFilterConta] = useState("todas");
  const [filterCalendario, setFilterCalendario] = useState("todos");
  const [filterProjeto, setFilterProjeto] = useState("todos");

  const monthLabel = `${MESES_FULL[cursor.month][0].toUpperCase()}${MESES_FULL[cursor.month].slice(1)} de ${cursor.year}`;
  const monthStart = new Date(cursor.year, cursor.month, 1);
  const firstWeekday = monthStart.getDay();
  const daysInMonth = new Date(cursor.year, cursor.month + 1, 0).getDate();

  function isoFor(day) { return `${cursor.year}-${String(cursor.month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`; }

  const eventProjectByKey = useMemo(() => {
    const map = {};
    (ctx.googleEventLinks || []).forEach((l) => { map[l.id] = l.projectId; });
    return map;
  }, [ctx.googleEventLinks]);

  const calendariosDaContaFiltrada = filterConta !== "todas" ? (ctx.googleCalendarsByAccount[filterConta] || []) : [];

  const itemsByDay = useMemo(() => {
    const map = {};
    function push(iso, item) { if (!iso) return; (map[iso] = map[iso] || []).push(item); }
    if (filterFonte !== "google") {
      ctx.tasks.forEach((t) => {
        if (!t.prazo || t.status === "Concluído") return;
        if (filterProjeto !== "todos" && t.projectId !== filterProjeto) return;
        push(t.prazo, { type: "tarefa", id: t.id, label: t.titulo, kind: "tarefa" });
      });
      ctx.milestones.forEach((m) => {
        if (filterProjeto !== "todos" && m.projectId !== filterProjeto) return;
        push(m.previsao, { type: "marco", id: m.id, label: m.marco, kind: "marco" });
      });
      ctx.meetings.forEach((m) => {
        if (filterProjeto !== "todos" && m.projectId !== filterProjeto) return;
        push(m.data, { type: "reuniao", id: m.id, label: m.titulo, kind: "reuniao" });
      });
    }
    if (filterFonte !== "central") {
      (ctx.googleEvents || []).forEach((ev) => {
        if (filterConta !== "todas" && ev.accountId !== filterConta) return;
        if (filterCalendario !== "todos" && ev.calendarId !== filterCalendario) return;
        if (filterProjeto !== "todos" && eventProjectByKey[ev.key] !== filterProjeto) return;
        push(ev.data, { type: "googleEvent", id: ev.key, label: ev.titulo, kind: "google" });
      });
    }
    return map;
  }, [ctx.tasks, ctx.milestones, ctx.meetings, ctx.googleEvents, eventProjectByKey, filterFonte, filterConta, filterCalendario, filterProjeto]);

  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  function goMonth(delta) {
    setCursor((c) => {
      let month = c.month + delta, year = c.year;
      if (month < 0) { month = 11; year -= 1; }
      if (month > 11) { month = 0; year += 1; }
      return { year, month };
    });
  }
  function goToday() {
    const [y, m] = TODAY.split("-");
    setCursor({ year: parseInt(y, 10), month: parseInt(m, 10) - 1 });
  }

  return (
    <div>
      <p className="planning-hint">Tarefas em aberto, marcos, reuniões e eventos do Google Agenda consolidados por data.</p>
      <div className="calendar-toolbar" style={{ flexWrap: "wrap", rowGap: 10 }}>
        <button className="icon-btn" onClick={() => goMonth(-1)} title="Mês anterior"><Icon name="chevronRight" size={14} style={{ transform: "rotate(180deg)" }} /></button>
        <strong className="calendar-month-label">{monthLabel}</strong>
        <button className="icon-btn" onClick={() => goMonth(1)} title="Próximo mês"><Icon name="chevronRight" size={14} /></button>
        <button className="btn btn-ghost btn-sm" onClick={goToday}>Hoje</button>
        <div className="calendar-legend">
          <span><span className="calendar-legend-dot" style={{ background: "var(--info)" }} /> Reunião</span>
          <span><span className="calendar-legend-dot" style={{ background: "var(--accent-strong)" }} /> Tarefa</span>
          <span><span className="calendar-legend-dot" style={{ background: "var(--success)" }} /> Marco</span>
          <span><span className="calendar-legend-dot" style={{ background: "var(--neutral)" }} /> Google Agenda</span>
        </div>
      </div>
      <div className="field-grid" style={{ margin: "0 0 16px" }}>
        <div className="field">
          <span className="k">Fonte</span>
          <select value={filterFonte} onChange={(e) => setFilterFonte(e.target.value)} style={fieldInputStyle}>
            <option value="todos">Todas</option>
            <option value="central">Só Central</option>
            <option value="google">Só Google Agenda</option>
          </select>
        </div>
        {filterFonte !== "central" && (
          <div className="field">
            <span className="k">Conta Google</span>
            <select value={filterConta} onChange={(e) => { setFilterConta(e.target.value); setFilterCalendario("todos"); }} style={fieldInputStyle}>
              <option value="todas">Todas</option>
              {ctx.googleAccounts.filter((a) => a.usaAgenda).map((a) => <option key={a.id} value={a.id}>{a.apelido || a.email}</option>)}
            </select>
          </div>
        )}
        {filterFonte !== "central" && filterConta !== "todas" && (
          <div className="field">
            <span className="k">Calendário</span>
            <select value={filterCalendario} onChange={(e) => setFilterCalendario(e.target.value)} style={fieldInputStyle}>
              <option value="todos">Todos</option>
              {calendariosDaContaFiltrada.map((c) => <option key={c.id} value={c.id}>{c.nome}</option>)}
            </select>
          </div>
        )}
        <div className="field">
          <span className="k">Projeto</span>
          <select value={filterProjeto} onChange={(e) => setFilterProjeto(e.target.value)} style={fieldInputStyle}>
            <option value="todos">Todos</option>
            {ctx.projects.map((p) => <option key={p.id} value={p.id}>{p.nome}</option>)}
          </select>
        </div>
      </div>
      <div className="calendar-grid">
        {["dom", "seg", "ter", "qua", "qui", "sex", "sáb"].map((d) => <div key={d} className="calendar-weekday">{d}</div>)}
        {cells.map((day, i) => {
          if (day === null) return <div key={"e" + i} className="calendar-cell empty" />;
          const iso = isoFor(day);
          const items = itemsByDay[iso] || [];
          const isToday = iso === TODAY;
          return (
            <div key={iso} className={cx("calendar-cell", isToday && "today", items.length > 0 && "has-items")}
              onClick={() => items.length > 0 && ctx.setQuickList({ title: fmtDateLong(iso), items: items.map((it) => ({ type: it.type, id: it.id })) })}>
              <span className="calendar-day-num">{day}</span>
              <div className="calendar-day-items">
                {items.slice(0, 3).map((it, idx) => (
                  <span key={idx} className={cx("calendar-item-chip", "kind-" + it.kind)}>{it.label}</span>
                ))}
                {items.length > 3 && <span className="calendar-more">+{items.length - 3} mais</span>}
              </div>
              <div className="calendar-day-dots">
                {Array.from(new Set(items.map((it) => it.kind))).map((k) => <span key={k} className={cx("calendar-dot", "kind-" + k)} />)}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ==================================================================================
   CRONOGRAMA GERAL (GANTT EXECUTIVO)
   ================================================================================== */
function GanttView({ ctx }) {
  const projects = ctx.projects.filter((p) => !p.arquivado);
  const toTime = (iso) => new Date(iso + "T00:00:00").getTime();

  const allDates = [];
  projects.forEach((p) => { allDates.push(p.dataInicio, p.prazoPrevisto); });
  ctx.milestones.forEach((m) => allDates.push(m.previsao));
  allDates.push(TODAY);

  let minT = Math.min(...allDates.map(toTime));
  let maxT = Math.max(...allDates.map(toTime));
  const pad = Math.max((maxT - minT) * 0.04, 1000 * 60 * 60 * 24 * 5);
  minT -= pad; maxT += pad;
  const span = maxT - minT;
  function pct(iso) { return ((toTime(iso) - minT) / span) * 100; }
  const todayPct = pct(TODAY);

  const months = [];
  const cursor = new Date(minT);
  cursor.setDate(1);
  while (cursor.getTime() <= maxT) {
    months.push({ label: `${MESES_ABBR[cursor.getMonth()]}/${String(cursor.getFullYear()).slice(2)}`, pct: ((cursor.getTime() - minT) / span) * 100 });
    cursor.setMonth(cursor.getMonth() + 1);
  }

  return (
    <div>
      <p className="planning-hint">Linha do tempo executiva de todos os projetos, com marcos. Clique numa barra ou marco para abrir.</p>
      <div className="card gantt-card">
        <div className="gantt-scroll">
          <div className="gantt-months">
            {months.map((mo, i) => <div key={i} className="gantt-month-tick" style={{ left: mo.pct + "%" }}>{mo.label}</div>)}
          </div>
          <div className="gantt-rows">
            <div className="gantt-today-line" style={{ left: todayPct + "%" }} title={"Hoje — " + fmtDate(TODAY)} />
            {projects.map((p) => {
              const startPct = pct(p.dataInicio);
              const endPct = pct(p.prazoPrevisto);
              const milestones = ctx.milestones.filter((m) => m.projectId === p.id);
              return (
                <div className="gantt-row" key={p.id}>
                  <div className="gantt-row-label" onClick={() => ctx.openProject(p.id)} title={p.nome}>{p.nome}</div>
                  <div className="gantt-row-track">
                    <div className={cx("gantt-bar", "tone-saude-" + statusClass(p.saude))}
                      style={{ left: startPct + "%", width: Math.max(endPct - startPct, 1.2) + "%" }}
                      onClick={() => ctx.openProject(p.id)}
                      title={`${p.nome}: ${fmtDate(p.dataInicio)} — ${fmtDate(p.prazoPrevisto)} (${p.percentual}% concluído) · ${p.status} · Saúde: ${p.saude}`}>
                      <div className="gantt-bar-fill" style={{ width: p.percentual + "%" }} />
                    </div>
                    {milestones.map((m) => (
                      <div key={m.id} className={cx("gantt-milestone", (m.status === "Em risco" || m.status === "Atrasado") && "risk", m.status === "Concluído" && "done")}
                        style={{ left: pct(m.previsao) + "%" }}
                        title={`${m.marco} — ${fmtDate(m.previsao)} (${m.status})`}
                        onClick={(e) => { e.stopPropagation(); ctx.openDrawer("marco", m.id); }} />
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
      <div className="gantt-legend">
        <span><span className="dot" style={{ background: "var(--danger)" }} /> Saúde crítica</span>
        <span><span className="dot" style={{ background: "var(--warning)" }} /> Saúde em atenção</span>
        <span><span className="dot" style={{ background: "var(--success)" }} /> Saudável</span>
        <span><span className="diamond" /> Marco</span>
        <span><span className="line" /> Hoje</span>
      </div>
    </div>
  );
}

const NOTE_SORT_OPTIONS = [
  { key: "recentes", label: "Mais recentes" },
  { key: "antigas", label: "Mais antigas" },
  { key: "titulo", label: "Título" },
  { key: "projeto", label: "Projeto" },
];
function sortNotes(list, sortKey) {
  const arr = [...list];
  if (sortKey === "antigas") return arr.sort((a, b) => (a.editadoEm + (a.editadoHora || "")) > (b.editadoEm + (b.editadoHora || "")) ? 1 : -1);
  if (sortKey === "titulo") return arr.sort((a, b) => (a.titulo || "").localeCompare(b.titulo || ""));
  if (sortKey === "projeto") return arr.sort((a, b) => {
    const pa = a.projectId ? (projectById(a.projectId) || {}).nome || "" : "";
    const pb = b.projectId ? (projectById(b.projectId) || {}).nome || "" : "";
    return pa.localeCompare(pb);
  });
  return arr.sort((a, b) => (a.editadoEm + (a.editadoHora || "")) < (b.editadoEm + (b.editadoHora || "")) ? 1 : -1);
}
function matchesPeriodoNote(n, periodo) {
  if (periodo === "Todos") return true;
  const dias = daysBetween(n.editadoEm || n.criadoEm, TODAY);
  if (periodo === "7 dias") return dias <= 7;
  if (periodo === "30 dias") return dias <= 30;
  return true;
}

      {showImport && <ImportarWordModal ctx={ctx} onClose={() => setShowImport(false)} />}

      <div className="filters-bar">
        <select value={filterProject} onChange={(e) => setFilterProject(e.target.value)}>
          <option value="Todos">Projeto: todos</option>
          <option value="geral">Geral (sem projeto)</option>
          {ctx.projects.map((p) => <option key={p.id} value={p.id}>{p.nome}</option>)}
        </select>
        <select value={filterCategoria} onChange={(e) => setFilterCategoria(e.target.value)}>
          <option value="Todas">Categoria: todas</option>
          {(ctx.listas.nota_categoria || []).filter((i) => i.ativo).map((i) => <option key={i.id} value={i.id}>{i.nome}</option>)}
        </select>
        {allTags.length > 0 && (
          <select value={filterTag} onChange={(e) => setFilterTag(e.target.value)}>
            <option value="Todas">Tag: todas</option>
            {allTags.map((t) => <option key={t} value={t}>{t}</option>)}
          </select>
        )}
        <select value={filterPeriodo} onChange={(e) => setFilterPeriodo(e.target.value)}>
          <option value="Todos">Período: todos</option>
          <option value="7 dias">Últimos 7 dias</option>

        </select>

      <div className="notes-grid">
        {sorted.map((n) => <NoteCard key={n.id} note={n} ctx={ctx} onOpen={() => ctx.openNoteEditor(n.id)} />)}
      </div>
    </div>
  );
}

          <button className="btn btn-primary btn-sm" onClick={() => ctx.openNoteEditor("new", { projectId: project.id })}><Icon name="plus" size={13} /> Nova anotação</button>
        </div>
      </div>
      <span className="hint">Use a anotação como bloco de notas durante reuniões e levantamentos deste projeto</span>
      {showImport && <ImportarWordModal ctx={ctx} projectId={project.id} onClose={() => setShowImport(false)} />}

      <div className="filters-bar" style={{ marginTop: 14 }}>
        <select value={filterCategoria} onChange={(e) => setFilterCategoria(e.target.value)}>
          <option value="Todas">Categoria: todas</option>
          {(ctx.listas.nota_categoria || []).filter((i) => i.ativo).map((i) => <option key={i.id} value={i.id}>{i.nome}</option>)}
        </select>
        {allTags.length > 0 && (
          <select value={filterTag} onChange={(e) => setFilterTag(e.target.value)}>
            <option value="Todas">Tag: todas</option>
            {allTags.map((t) => <option key={t} value={t}>{t}</option>)}
          </select>
        )}
      </div>

      {notes.length === 0 && <EmptyState icon="book" text="Nenhuma nota registrada neste projeto ainda." />}
      <div className="notes-grid" style={{ marginBottom: 10, marginTop: 14 }}>
        {notes.map((n) => <NoteCard key={n.id} note={n} ctx={ctx} onOpen={() => ctx.openNoteEditor(n.id)} />)}
      </div>
      <p className="hint" style={{ marginTop: 4 }}>
        Documentos, links e outras referências de levantamento ficam na aba{" "}
        <a onClick={() => setTab && setTab("materiais")} style={{ cursor: "pointer" }}>Documentos</a>.
      </p>
    </div>
  );
}

   EDITOR COMPLETO DE ANOTAÇÕES (tela cheia dedicada)
   ================================================================================== */
const TOOLBAR_BUTTONS = [
  { cmd: "bold", label: "B", title: "Negrito (Ctrl+B)", style: { fontWeight: 800 } },
  { cmd: "italic", label: "I", title: "Itálico (Ctrl+I)", style: { fontStyle: "italic" } },
  { cmd: "underline", label: "U", title: "Sublinhado (Ctrl+U)", style: { textDecoration: "underline" } },
  { sep: true },
  { cmd: "block:<h2>", label: "H2", title: "Título" },
  { cmd: "block:<h3>", label: "H3", title: "Subtítulo" },
  { cmd: "block:<p>", label: "¶", title: "Texto normal" },
  { sep: true },
  { cmd: "insertUnorderedList", label: "•", title: "Lista com marcadores" },
  { cmd: "insertOrderedList", label: "1.", title: "Lista numerada" },
  { cmd: "checklist", label: "☑", title: "Lista de verificação" },
  { cmd: "block:<blockquote>", label: "❝", title: "Citação" },
  { sep: true },
  { cmd: "link", label: "🔗", title: "Inserir link" },
  { cmd: "highlight", label: "◼", title: "Destacar texto" },
  { cmd: "insertHorizontalRule", label: "—", title: "Separador" },
  { cmd: "block:<pre>", label: "</>", title: "Bloco de código" },
  { sep: true },
  { cmd: "undo", label: "↺", title: "Desfazer (Ctrl+Z)" },
  { cmd: "redo", label: "↻", title: "Refazer" },
];
function EditorToolbar({ onCommand }) {
  return (
    <div className="note-editor-toolbar">
      {TOOLBAR_BUTTONS.map((b, i) => b.sep
        ? <span key={i} className="note-toolbar-sep" />
        : (
          <button key={b.cmd} type="button" className="note-toolbar-btn" title={b.title} style={b.style}
            onMouseDown={(e) => e.preventDefault()} onClick={() => onCommand(b.cmd)}>
            {b.label}
          </button>
        ))}
    </div>
  );
}
/* insere manualmente via Range (em vez de execCommand insertHTML) porque precisamos posicionar o
   cursor exatamente dentro do span de texto do item — o execCommand deixa o cursor após todo o
   HTML inserido, o que faria o próximo texto digitado cair fora do checklist */
function insertChecklistItemAtCursor() {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  range.deleteContents();
  const div = document.createElement("div");
  div.className = "note-checklist-item";
  div.setAttribute("data-checked", "false");
  div.innerHTML = '<span class="note-checklist-mark" contenteditable="false">☐</span><span class="note-checklist-text">&nbsp;</span>';
  range.insertNode(div);
  const textSpan = div.querySelector(".note-checklist-text");
  const newRange = document.createRange();
  newRange.selectNodeContents(textSpan);
  newRange.collapse(true);
  sel.removeAllRanges();
  sel.addRange(newRange);
}
function NoteEditorView({ route, ctx, navigate }) {
  const isNew = !route.noteId || route.noteId === "new";
  const [titulo, setTitulo] = useState("");
  const [categoria, setCategoria] = useState("");
  const [tagsState, setTagsState] = useState([]);
  const [tagInput, setTagInput] = useState("");
  const [projectIdState, setProjectIdState] = useState(route.projectId || "");
  const [meetingIdState, setMeetingIdState] = useState(route.meetingId || "");
  const [materiais, setMateriais] = useState([]);
  const [saveStatus, setSaveStatus] = useState("idle"); // idle | saving | saved | error
  const [lastSavedAt, setLastSavedAt] = useState(null);
  const [draftBanner, setDraftBanner] = useState(null);
  const [ready, setReady] = useState(false);

  const editorRef = useRef(null);
  const realIdRef = useRef(isNew ? null : route.noteId);
  const draftIdRef = useRef(realIdRef.current || ("new-" + Date.now() + "-" + Math.floor(Math.random() * 99999)));
  const latestRef = useRef({});
  const latestHtmlRef = useRef("");
  const saveTimerRef = useRef(null);
  const mountedRef = useRef(true);

  function fmtHora(d) { return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  function draftKey() { return "central-projetos-note-draft-" + draftIdRef.current; }
  function writeLocalDraft(snap, html, clear) {
    try {
      if (clear) { window.localStorage.removeItem(draftKey()); return; }
      window.localStorage.setItem(draftKey(), JSON.stringify({
        titulo: snap.titulo, categoria: snap.categoria, tags: snap.tags, html, updatedAt: Date.now(),
      }));
    } catch (e) { /* localStorage indisponível — rascunho local é apenas um reforço best-effort */ }
  }

  /* carregamento inicial + verificação de rascunho local recuperável — roda uma única vez */
  useEffect(() => {
    mountedRef.current = true;
    const existing = realIdRef.current ? ctx.notes.find((n) => n.id === realIdRef.current) : null;
    let initialHtml = "";
    if (existing) {
      setTitulo(existing.titulo || "");
      setCategoria(existing.categoria || "");
      setTagsState(existing.tags || []);
      setProjectIdState(existing.projectId || "");
      setMeetingIdState(existing.meetingId || "");
      setMateriais(existing.materiaisRelacionados || []);
      initialHtml = existing.conteudoHtml != null ? existing.conteudoHtml : plainTextToHtml(existing.conteudo);
    } else {
      setProjectIdState(route.projectId || "");
      setMeetingIdState(route.meetingId || "");
    }
    latestHtmlRef.current = initialHtml;
    if (editorRef.current) editorRef.current.innerHTML = initialHtml;
    // faz o Enter criar <p> (em vez do <div> padrão do Chrome), consistente com o CSS e a exportação para Word
    try { document.execCommand("defaultParagraphSeparator", false, "p"); } catch (e) { /* comando não suportado — segue com o padrão do navegador */ }
    try {
      const raw = window.localStorage.getItem(draftKey());
      if (raw) {
        const draft = JSON.parse(raw);
        const draftHtml = draft.html || "";
        const sameTitulo = (draft.titulo || "") === (existing ? existing.titulo || "" : "");
        if (draftHtml !== initialHtml || !sameTitulo) setDraftBanner(draft);
      }
    } catch (e) { /* localStorage indisponível — ignora silenciosamente */ }
    setReady(true);
    return () => { mountedRef.current = false; flushSaveOnUnmount(); };
    // eslint-disable-next-line
  }, []);

  /* mantém uma cópia sempre atualizada dos campos em uma ref, para o autosave (debounced) nunca ler um valor obsoleto */
  useEffect(() => {
    latestRef.current = { titulo, categoria, tags: tagsState, projectId: projectIdState || null, meetingId: meetingIdState || null, materiais };
  });

  /* se o projeto muda para um que não tem a reunião selecionada, limpa a seleção de reunião */
  useEffect(() => {
    if (!projectIdState) { if (meetingIdState) setMeetingIdState(""); return; }
    if (meetingIdState && !ctx.meetings.some((m) => m.id === meetingIdState && m.projectId === projectIdState)) setMeetingIdState("");
    // eslint-disable-next-line
  }, [projectIdState]);

  /* salva o que houver pendente ao desmontar (navegar para outra tela, fechar, etc.) — melhor esforço.
     O rascunho local só é removido depois de uma confirmação real do Google Drive: se a aba fechar
     antes dessa confirmação chegar (o que é possível, já que chamadas assíncronas podem não terminar
     a tempo do navegador fechar), o rascunho permanece disponível para recuperação na próxima abertura. */
  function flushSaveOnUnmount() {
    if (saveTimerRef.current) { clearTimeout(saveTimerRef.current); saveTimerRef.current = null; }
    const snap = latestRef.current || {};
    const html = latestHtmlRef.current || "";
    const hasContent = (snap.titulo && snap.titulo.trim()) || htmlToPlainText(html).trim();
    if (!hasContent) return;
    writeLocalDraft(snap, html, false);
    const payload = { titulo: snap.titulo, conteudoHtml: html, conteudo: htmlToPlainText(html), categoria: snap.categoria, tags: snap.tags || [], materiaisRelacionados: snap.materiais || [], projectId: snap.projectId || null, meetingId: snap.meetingId || null };
    let persisted;
    if (!realIdRef.current) {
      const rec = ctx.addNote(payload);
      realIdRef.current = rec.id;
      persisted = rec._persisted;
    } else {
      persisted = ctx.updateNote(realIdRef.current, payload);
    }
    if (persisted && persisted.then) {
      persisted.then(() => { writeLocalDraft(snap, html, true); }).catch(() => {});
    }
  }

  function scheduleSave() {
    if (!ready) return;
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    setSaveStatus("saving");
    saveTimerRef.current = setTimeout(doSave, 900);
  }

  async function doSave() {
    saveTimerRef.current = null;
    const snap = latestRef.current;
    const html = latestHtmlRef.current || "";
    const hasContent = (snap.titulo && snap.titulo.trim()) || htmlToPlainText(html).trim();
    if (!hasContent) { if (mountedRef.current) setSaveStatus("idle"); return; }
    const payload = { titulo: snap.titulo, conteudoHtml: html, conteudo: htmlToPlainText(html), categoria: snap.categoria, tags: snap.tags || [], materiaisRelacionados: snap.materiais || [], projectId: snap.projectId || null, meetingId: snap.meetingId || null };
    try {
      if (!realIdRef.current) {
        // cria a nota no primeiro autosave; não navega/atualiza a rota aqui de propósito — evitaria resetar o scroll
        // e fechar a barra lateral no meio da digitação
        const rec = ctx.addNote(payload);
        realIdRef.current = rec.id;
        await rec._persisted; // só considera salvo depois da confirmação real (response.ok) do Google Drive
      } else {
        await ctx.updateNote(realIdRef.current, payload);
      }
      writeLocalDraft(snap, html, true);
      if (mountedRef.current) { setSaveStatus("saved"); setLastSavedAt(new Date()); }
    } catch (e) {
      console.warn("Falha ao salvar anotação automaticamente:", e);
      if (mountedRef.current) {
        // quando o armazenamento do artifact simplesmente não está disponível nesta visualização, o app
        // inteiro já sinaliza isso de forma discreta na barra lateral — aqui evitamos duplicar um alarme de
        // "erro" a cada tecla; "Erro ao salvar" fica reservado para uma falha real com o armazenamento pronto
        if (ctx.dbStatus === "unavailable") { setSaveStatus("saved"); setLastSavedAt(new Date()); }
        else setSaveStatus("error");
      }
    }
  }

  function noteField(patch, htmlOverride) {
    writeLocalDraft({ ...latestRef.current, ...patch }, htmlOverride != null ? htmlOverride : latestHtmlRef.current, false);
    scheduleSave();
  }

  function handleTituloChange(e) { const v = e.target.value; setTitulo(v); noteField({ titulo: v }); }
  function handleCategoriaChange(e) { const v = e.target.value; setCategoria(v); noteField({ categoria: v }); }
  function handleProjectChange(e) { const v = e.target.value; setProjectIdState(v); noteField({ projectId: v || null }); }
  function handleMeetingChange(e) { const v = e.target.value; setMeetingIdState(v); noteField({ meetingId: v || null }); }
  function toggleMaterial(id) {
    const next = materiais.includes(id) ? materiais.filter((x) => x !== id) : [...materiais, id];
    setMateriais(next);
    noteField({ materiais: next });
  }
  function addTagFromInput() {
    const v = tagInput.trim();
    if (v && !tagsState.includes(v)) {
      const next = [...tagsState, v];
      setTagsState(next);
      noteField({ tags: next });
    }
    setTagInput("");
  }
  function handleTagInputKeyDown(e) {
    if (e.key === "Enter") { e.preventDefault(); addTagFromInput(); }
    else if (e.key === "Backspace" && !tagInput && tagsState.length > 0) {
      const next = tagsState.slice(0, -1);
      setTagsState(next);
      noteField({ tags: next });
    }
  }
  function removeTag(t) {
    const next = tagsState.filter((x) => x !== t);
    setTagsState(next);
    noteField({ tags: next });
  }

  function handleEditorInput() {
    const html = editorRef.current ? editorRef.current.innerHTML : "";
    latestHtmlRef.current = html;
    noteField({}, html);
  }
  function execEditorCommand(cmd) {
    if (editorRef.current) editorRef.current.focus();
    if (cmd === "checklist") { insertChecklistItemAtCursor(); handleEditorInput(); return; }
    if (cmd === "link") {
      const url = window.prompt("Endereço do link (inclua https://):", "https://");
      if (url) document.execCommand("createLink", false, url);
      handleEditorInput();
      return;
    }
    if (cmd === "highlight") { document.execCommand("hiliteColor", false, "#FFE066"); handleEditorInput(); return; }
    if (cmd.indexOf("block:") === 0) { document.execCommand("formatBlock", false, cmd.slice(6)); handleEditorInput(); return; }
    document.execCommand(cmd);
    handleEditorInput();
  }
  function handleEditorKeyDown(e) {
    if (e.key !== "Enter") return;
    const sel = window.getSelection();
    if (!sel || !sel.anchorNode) return;
    const node = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
    const item = node && node.closest && node.closest(".note-checklist-item");
    if (!item) return;
    e.preventDefault();
    const textEl = item.querySelector(".note-checklist-text");
    const isEmpty = !textEl || !textEl.textContent.replace(/ /g, "").trim();
    if (isEmpty) {
      const p = document.createElement("p");
      p.innerHTML = "<br>";
      item.replaceWith(p);
      const range = document.createRange();
      range.selectNodeContents(p);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    } else {
      const novo = document.createElement("div");
      novo.className = "note-checklist-item";
      novo.setAttribute("data-checked", "false");
      novo.innerHTML = '<span class="note-checklist-mark" contenteditable="false">☐</span><span class="note-checklist-text">&nbsp;</span>';
      item.after(novo);
      const range = document.createRange();
      range.selectNodeContents(novo.querySelector(".note-checklist-text"));
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    }
    handleEditorInput();
  }
  function handleEditorClick(e) {
    const mark = e.target.closest && e.target.closest(".note-checklist-mark");
    if (!mark) return;
    const item = mark.closest(".note-checklist-item");
    const checked = item.getAttribute("data-checked") === "true";
    item.setAttribute("data-checked", checked ? "false" : "true");
    mark.textContent = checked ? "☐" : "☑";
    handleEditorInput();
  }
  function handlePageKeyDown(e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
      e.preventDefault();
      if (saveTimerRef.current) { clearTimeout(saveTimerRef.current); saveTimerRef.current = null; }
      doSave();
    }
  }

  /* alerta o navegador ao fechar a aba/atualizar com o autosave ainda pendente, e tenta salvar mesmo assim */
  useEffect(() => {
    function onBeforeUnload(e) {
      const pendente = !!saveTimerRef.current;
      if (pendente) flushSaveOnUnmount();
    }
    window.addEventListener("beforeunload", onBeforeUnload);
    return () => window.removeEventListener("beforeunload", onBeforeUnload);
    // eslint-disable-next-line
  }, []);

  function restoreDraft() {
    if (!draftBanner) return;
    setTitulo(draftBanner.titulo || "");
    setCategoria(draftBanner.categoria || "");
    setTagsState(draftBanner.tags || []);
    latestHtmlRef.current = draftBanner.html || "";
    if (editorRef.current) editorRef.current.innerHTML = draftBanner.html || "";
    setDraftBanner(null);
    noteField({ titulo: draftBanner.titulo || "", categoria: draftBanner.categoria || "", tags: draftBanner.tags || [] }, draftBanner.html || "");
  }
  function discardDraft() {
    writeLocalDraft(null, null, true);
    setDraftBanner(null);
  }

  function goBack() {
    if (projectIdState) ctx.openProject(projectIdState, "notas");
    else ctx.navigate("notes");
  }
  async function handleExport() {
    if (saveTimerRef.current) { clearTimeout(saveTimerRef.current); saveTimerRef.current = null; await doSave(); }
    let note = realIdRef.current ? ctx.notes.find((n) => n.id === realIdRef.current) : null;
    if (!note && realIdRef.current) {
      // a criação acabou de acontecer neste mesmo ciclo e ctx.notes ainda não refletiu — monta os dados equivalentes para exportar mesmo assim
      note = { id: realIdRef.current, titulo, conteudoHtml: latestHtmlRef.current, categoria, tags: tagsState, projectId: projectIdState || null, meetingId: meetingIdState || null, criadoEm: TODAY, criadoHora: "" };
    }
    if (!note) return; // anotação ainda completamente vazia — nada a exportar
    ctx.downloadNoteAsWord(note);
  }
  function handleDelete() {
    if (!realIdRef.current) { goBack(); return; }
    if (!window.confirm("Excluir esta anotação definitivamente? Essa ação não pode ser desfeita.")) return;
    ctx.deleteNote(realIdRef.current);
    goBack();
  }

  const liveNote = realIdRef.current ? ctx.notes.find((n) => n.id === realIdRef.current) : null;
  const availableMeetings = projectIdState ? ctx.meetings.filter((m) => m.projectId === projectIdState) : [];
  const availableDocs = ctx.documents.filter((d) => !projectIdState || d.projectId === projectIdState);

  let statusLabel = "";
  if (saveStatus === "saving") statusLabel = "Salvando...";
  else if (saveStatus === "saved") {
    statusLabel = ctx.dbStatus === "unavailable"
      ? "Alterações salvas nesta sessão (armazenamento indisponível)"
      : (lastSavedAt ? "Salvo automaticamente às " + fmtHora(lastSavedAt) : "Alterações salvas");
  }
  else if (saveStatus === "error") statusLabel = "Erro ao salvar — tentando novamente na próxima alteração";

  return (
    <div className="note-editor-page" onKeyDown={handlePageKeyDown}>
      <div className="note-editor-topbar">
        <div className="note-editor-topbar-left">
          <button className="btn btn-ghost btn-sm" onClick={goBack}><Icon name="arrowLeft" size={14} /> Voltar</button>
          <span className={cx("note-editor-savestatus", saveStatus)}>
            {saveStatus === "saving" && <Icon name="refresh" size={12} />}
            {saveStatus === "saved" && <Icon name="check" size={12} />}
            {saveStatus === "error" && <Icon name="alert" size={12} />}
            {statusLabel}
          </span>
        </div>
        <div className="note-editor-actions">
          <button className="btn btn-ghost btn-sm" onClick={handleExport}><Icon name="external" size={13} /> Exportar Word</button>
          <button className="btn btn-danger-ghost btn-sm" onClick={handleDelete}><Icon name="x" size={13} /> Excluir</button>
        </div>
      </div>

      {draftBanner && (
        <div className="note-editor-draftbanner">
          <span><Icon name="alert" size={13} /> Encontramos um rascunho não salvo desta anotação. Deseja recuperá-lo?</span>
          <span style={{ display: "flex", gap: 8 }}>
            <button className="btn btn-primary btn-sm" onClick={restoreDraft}>Recuperar rascunho</button>
            <button className="btn btn-ghost btn-sm" onClick={discardDraft}>Descartar</button>
          </span>
        </div>
      )}

      <input type="text" className="note-editor-title" placeholder="Título da anotação" value={titulo} onChange={handleTituloChange} autoFocus />

      <div className="note-editor-meta">
        <select value={projectIdState} onChange={handleProjectChange}>
          <option value="">Geral (sem projeto)</option>
          {ctx.projects.filter((p) => !p.arquivado).map((p) => <option key={p.id} value={p.id}>{p.nome}</option>)}
        </select>
        <select value={categoria} onChange={handleCategoriaChange}>
          <option value="">Categoria: nenhuma</option>
          {(ctx.listas.nota_categoria || []).filter((i) => i.ativo).map((i) => <option key={i.id} value={i.id}>{i.nome}</option>)}
        </select>
        {projectIdState && (
          <select value={meetingIdState} onChange={handleMeetingChange}>
            <option value="">Sem reunião vinculada</option>
            {availableMeetings.map((m) => <option key={m.id} value={m.id}>{m.titulo} — {fmtDate(m.data)}</option>)}
          </select>
        )}
      </div>

      <div className="note-editor-tags-row">
        {tagsState.map((t) => <span key={t} className="tag-chip">{t}<button type="button" onClick={() => removeTag(t)}>×</button></span>)}
        <input type="text" className="note-editor-tags-input" placeholder="Adicionar tag e pressionar Enter"
          value={tagInput} onChange={(e) => setTagInput(e.target.value)} onKeyDown={handleTagInputKeyDown} onBlur={addTagFromInput} />
      </div>

      {availableDocs.length > 0 && (
        <div className="note-editor-materiais">
          <div className="note-editor-materiais-label">Documentos relacionados (opcional)</div>
          {availableDocs.map((d) => (
            <span key={d.id} className={cx("material-chip", materiais.includes(d.id) && "active")} onClick={() => toggleMaterial(d.id)}>
              <Icon name="doc" size={11} /> {d.nome}
            </span>
          ))}
        </div>
      )}

      <EditorToolbar onCommand={execEditorCommand} />
      <div ref={editorRef} className="note-editor-content" contentEditable suppressContentEditableWarning
        onInput={handleEditorInput} onKeyDown={handleEditorKeyDown} onClick={handleEditorClick} />

      <div className="note-editor-footer">
        {liveNote ? (
          <>
            <span>Criada em {fmtDate(liveNote.criadoEm)}{liveNote.criadoHora ? " às " + liveNote.criadoHora : ""}</span>
            <span>Última edição em {fmtDate(liveNote.editadoEm)}{liveNote.editadoHora ? " às " + liveNote.editadoHora : ""}</span>
          </>
        ) : <span>Ainda não salva — comece a digitar para salvar automaticamente</span>}
      </div>
    </div>
  );
}

/* ==================================================================================
   LEMBRETES
   ================================================================================== */
function ReminderRow({ reminder: r, ctx }) {
  const project = r.projectId ? projectById(r.projectId) : null;
  return (
    <div className={cx("item-row", "task-row", r.feito && "done")}>
      <button className={cx("task-checkbox", r.feito && "done")} onClick={() => ctx.toggleReminder(r.id)} title="Concluir/reabrir">
        {r.feito && <Icon name="check" size={11} />}
      </button>

  );

function BackupView({ ctx }) {
  const fileRef = useRef(null);
  const [pending, setPending] = useState(null); // { parsed, resumo }
  const [error, setError] = useState("");

  const counts = {
    "Projetos": ctx.projects.length, "Marcos": ctx.milestones.length,
    "Tarefas": ctx.tasks.length, "Reuniões": ctx.meetings.length, "Decisões": ctx.decisions.length,
    "Pendências": ctx.pendencies.length, "Riscos/problemas/impedimentos": ctx.risks.length, "Mudanças": ctx.changes.length,
    "Diário": ctx.diary.length, "Notas": ctx.notes.length, "Lembretes": ctx.reminders.length, "Documentos": ctx.documents.length,
  };

  function handleFile(e) {
    setError(""); setPending(null);
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        if (!parsed || typeof parsed !== "object" || !parsed.data || typeof parsed.data !== "object") {
          setError("Arquivo de backup inválido — estrutura não reconhecida.");
          return;
        }
        const resumo = Object.entries({
          Projetos: parsed.data.projetos, Marcos: parsed.data.marcos,
          Tarefas: parsed.data.tasks, Reuniões: parsed.data.meetings, Decisões: parsed.data.decisions,
          Pendências: parsed.data.pendencies, "Riscos/problemas/impedimentos": parsed.data.risks, Mudanças: parsed.data.changes,
          Diário: parsed.data.diary, Notas: parsed.data.notes, Lembretes: parsed.data.reminders, Documentos: parsed.data.documents,
        }).map(([label, arr]) => [label, Array.isArray(arr) ? arr.length : 0]);
        setPending({ parsed, resumo });
      } catch (err) {
        setError("Não foi possível ler o arquivo — verifique se é um JSON de backup válido.");
      }
    };
    reader.readAsText(file);
  }

  async function confirmRestore() {
    if (!pending) return;
    await ctx.importBackup(pending.parsed);
    setPending(null);
    if (fileRef.current) fileRef.current.value = "";
  }

  async function handleExportarELimpar() {
    const backupOk = await ctx.downloadBackup();
    if (!backupOk) return; // backup falhou (ou foi cancelado) — nunca limpa dados sem um backup confirmado
    const ok = window.confirm(
      "O backup foi baixado. Confirma limpar TODOS os dados atuais (projetos, tarefas, notas, etc.) para começar do zero — por exemplo, ao trocar de empresa? Esta ação não pode ser desfeita."
    );
    if (!ok) return;
    await ctx.limparTudo();
  }

  return (
    <div className="content-scroll narrow" style={{ padding: 0 }}>
      <div className="section-head">
        <h2>Dados e Backup</h2>
        <span className="hint">Exporte um arquivo de backup com todos os dados do protótipo, ou restaure a partir de um backup anterior</span>
      </div>

      <div className="card" style={{ padding: 18, marginBottom: 20 }}>
        <div style={{ fontWeight: 700, fontSize: 13.5, marginBottom: 10 }}>Exportar backup</div>
        <div className="field-grid" style={{ margin: "0 0 14px" }}>
          {Object.entries(counts).map(([label, n]) => (
            <div className="field" key={label}><span className="k">{label}</span><span className="v mono">{n}</span></div>
          ))}
        </div>
        <button className="btn btn-primary btn-sm" onClick={ctx.downloadBackup} disabled={ctx.downloadsStatus !== "ready"}
          title={ctx.downloadsStatus !== "ready" ? "Exportação indisponível nesta visualização" : ""}>
          <Icon name="doc" size={13} /> Exportar Backup (.json)
        </button>
        <p className="hint" style={{ marginTop: 10 }}>
          O arquivo inclui projetos, marcos, tarefas, reuniões, decisões, pendências, riscos, mudanças, diário, notas,
          lembretes e materiais — tudo é restaurado na importação de um backup.
        </p>
      </div>

      <div className="card" style={{ padding: 18 }}>
        <div style={{ fontWeight: 700, fontSize: 13.5, marginBottom: 6 }}>Importar backup</div>
        <p className="hint" style={{ margin: "0 0 12px" }}>Substitui os dados atuais pelos dados do arquivo selecionado. Esta ação não pode ser desfeita.</p>
        <input ref={fileRef} type="file" accept="application/json" onChange={handleFile} />
        {error && <div className="stale-alert" style={{ marginTop: 10 }}><Icon name="alert" size={12} /> {error}</div>}
        {pending && (
          <div style={{ marginTop: 14, border: "1px dashed var(--accent-strong)", borderRadius: "var(--radius-md)", padding: 14, background: "rgba(255,153,51,0.06)" }}>
            <div style={{ fontWeight: 700, fontSize: 12.5, marginBottom: 8 }}>Confirmar substituição dos dados atuais?</div>
            <div className="field-grid" style={{ margin: "0 0 12px" }}>
              {pending.resumo.map(([label, n]) => (
                <div className="field" key={label}><span className="k">{label}</span><span className="v mono">{n}</span></div>
              ))}
            </div>
            <p className="hint" style={{ margin: "0 0 12px" }}>Todos os dados atuais dessas áreas serão substituídos pelos dados do arquivo. Esta ação não pode ser desfeita.</p>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="btn btn-ghost btn-sm" onClick={() => { setPending(null); if (fileRef.current) fileRef.current.value = ""; }}>Cancelar</button>
              <button className="btn btn-primary btn-sm" onClick={confirmRestore}>Substituir dados atuais</button>
            </div>
          </div>
        )}
      </div>

      <div className="card" style={{ padding: 18, marginTop: 20 }}>
        <div style={{ fontWeight: 700, fontSize: 13.5, marginBottom: 6 }}>Encerrar uso e começar do zero</div>
        <p className="hint" style={{ margin: "0 0 12px" }}>
          Baixa o backup completo (o mesmo de acima) e, depois de confirmado, limpa todos os dados atuais —
          útil, por exemplo, ao trocar de empresa e reaproveitar este mesmo arquivo do zero.
        </p>
        <button className="btn btn-ghost btn-sm" onClick={handleExportarELimpar} disabled={ctx.downloadsStatus !== "ready"}>
          <Icon name="alert" size={13} /> Exportar tudo e limpar dados
        </button>
      </div>
    </div>
  );
}

        Renomear um item não afeta registros já lançados com ele — só muda o texto exibido. Itens já usados em
        registros, ou essenciais para o funcionamento do app, não podem ser excluídos — apenas desativados.
      </p>
      <div className="filters-bar">
        <select value={selected} onChange={(e) => setSelected(e.target.value)}>
          {listIds.map((id) => <option key={id} value={id}>{DEFAULT_LISTS[id].label}</option>)}
        </select>
      </div>

      <form className="quick-add" onSubmit={handleAdd} style={{ marginBottom: 12 }}>
        <input type="text" placeholder="Novo item…" value={novo} onChange={(e) => setNovo(e.target.value)} />
        <button type="submit" className="btn btn-primary btn-sm">Adicionar</button>
      </form>

      <div className="list-stack">
        {itens.length === 0 && <EmptyState text="Nenhum item nesta lista ainda." />}
        {itens.map((item, idx) => (
          <div className="item-row" key={item.id} style={{ cursor: "default" }}>
            <span className="feed-icon tone-neutral" style={{ marginTop: 1 }}><Icon name="layers" size={14} /></span>
            <div className="item-row-main">
              {editingItemId === item.id
                ? <input type="text" autoFocus value={editNome} onChange={(e) => setEditNome(e.target.value)}
                    onBlur={() => saveEditNome(item)} onKeyDown={(e) => { if (e.key === "Enter") saveEditNome(item); if (e.key === "Escape") setEditingItemId(null); }}
                    style={{ ...fieldInputStyle, maxWidth: 280 }} />
                : <span className="item-row-title" onClick={() => startEditNome(item)} style={{ cursor: "text" }} title="Clique para renomear">{item.nome}</span>}
              <span className="item-row-sub">id interno: {item.id}{item.systemRole ? ` · usado internamente (${item.systemRole})` : ""}</span>
            </div>
            <div className="item-row-side">
              <button className="icon-btn" title="Mover para cima" onClick={() => ctx.moveListItem(selected, item.id, -1)} disabled={idx === 0}>▲</button>
              <button className="icon-btn" title="Mover para baixo" onClick={() => ctx.moveListItem(selected, item.id, 1)} disabled={idx === itens.length - 1}>▼</button>
              <Pill tone={item.ativo ? "success" : "neutral"}>{item.ativo ? "Ativo" : "Inativo"}</Pill>
              <button className="btn btn-ghost btn-sm" onClick={() => ctx.toggleListItemAtivo(selected, item.id)}>{item.ativo ? "Desativar" : "Ativar"}</button>
              {!item.systemRole && (
                <button className="icon-btn" title="Excluir" onClick={() => handleDelete(item)}><Icon name="trash" size={13} /></button>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

    ctx.updateGoogleAccountCalendarios(account.id, next.length ? next : ["primary"]);

        </div>
        <Pill tone={GOOGLE_ACCOUNT_STATUS_TONE[status] || "neutral"}>{GOOGLE_ACCOUNT_STATUS_LABEL[status] || status}</Pill>

      <div className="field-grid" style={{ marginTop: 12, marginBottom: 12 }}>
        <div className="field"><span className="k">Serviços</span><span className="v">{[account.usaDrive && "Google Drive", account.usaAgenda && "Google Agenda"].filter(Boolean).join(" · ") || "—"}</span></div>
        <div className="field"><span className="k">Última sincronização da agenda</span><span className="v">{account.usaAgenda ? fmtDateTime(account.ultimaSincronizacao) : "—"}</span></div>
      </div>
      {error && <div className="stale-alert" style={{ marginBottom: 12 }}><Icon name="alert" size={12} /> {error}</div>}

      {account.usaAgenda && status === "conectado" && (
        <div style={{ marginBottom: 12 }}>
          <div className="k" style={{ marginBottom: 6 }}>Calendários exibidos na Central</div>

function ConfigIdentidadeVisualTab({ ctx }) {
  const [nomeApp, setNomeApp] = useState(ctx.identidadeVisual.nomeApp || "");
  const [subtitulo, setSubtitulo] = useState(ctx.identidadeVisual.subtitulo || "");
  const [error, setError] = useState("");
  const fileRef = useRef(null);

  function saveTexto(e) {
    e.preventDefault();
    ctx.updateIdentidadeVisual({ nomeApp: nomeApp.trim() || "Central de Projetos", subtitulo: subtitulo.trim() });
    ctx.setToast("Identidade visual atualizada.");
  }

  function handleLogoFile(e) {
    setError("");
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (["image/png", "image/jpeg", "image/webp"].indexOf(file.type) === -1) {
      setError("Formato não suportado — envie PNG, JPG ou WebP.");
      return;
    }
    if (file.size > 3 * 1024 * 1024) {
      setError("Arquivo muito grande — o limite é 3 MB.");
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxSize = 240;
        let width = img.width, height = img.height;
        if (width > maxSize || height > maxSize) {
          const scale = maxSize / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const c = canvas.getContext("2d");
        c.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL(file.type === "image/png" ? "image/png" : "image/jpeg", 0.85);
        ctx.updateIdentidadeVisual({ logoDataUrl: dataUrl });
        ctx.setToast("Logo atualizado.");
      };
      img.onerror = () => setError("Não foi possível processar essa imagem.");
      img.src = String(reader.result);
    };
    reader.onerror = () => setError("Não foi possível ler o arquivo.");
    reader.readAsDataURL(file);
    if (fileRef.current) fileRef.current.value = "";
  }

  function removeLogo() { ctx.updateIdentidadeVisual({ logoDataUrl: null }); }
  function restaurarPadrao() {
    setNomeApp(IDENTIDADE_VISUAL_PADRAO.nomeApp);
    setSubtitulo(IDENTIDADE_VISUAL_PADRAO.subtitulo);
    ctx.updateIdentidadeVisual({ nomeApp: IDENTIDADE_VISUAL_PADRAO.nomeApp, subtitulo: IDENTIDADE_VISUAL_PADRAO.subtitulo, logoDataUrl: null });
  }

  return (
    <div>
      <div className="section-head"><h2>Identidade visual</h2></div>
      <form className="card" style={{ padding: 18, marginBottom: 16 }} onSubmit={saveTexto}>
        <div className="field-grid" style={{ marginTop: 0, marginBottom: 12 }}>
          <div className="field"><span className="k">Nome da aplicação</span><input type="text" value={nomeApp} onChange={(e) => setNomeApp(e.target.value)} style={fieldInputStyle} /></div>
          <div className="field"><span className="k">Subtítulo</span><input type="text" value={subtitulo} onChange={(e) => setSubtitulo(e.target.value)} style={fieldInputStyle} /></div>
        </div>
        <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
          <button type="button" className="btn btn-ghost btn-sm" onClick={restaurarPadrao}>Restaurar padrão</button>
          <button type="submit" className="btn btn-primary btn-sm">Salvar</button>
        </div>
      </form>

      <div className="card" style={{ padding: 18 }}>
        <div style={{ fontWeight: 700, fontSize: 13.5, marginBottom: 8 }}>Logo</div>
        <div style={{ display: "flex", alignItems: "center", gap: 16, marginBottom: 12, flexWrap: "wrap" }}>
          <div style={{ width: 56, height: 56, borderRadius: 10, border: "1px solid var(--border)", display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden", background: "var(--surface-sunken)" }}>
            {ctx.identidadeVisual.logoDataUrl
              ? <img src={ctx.identidadeVisual.logoDataUrl} alt="Logo" style={{ maxWidth: "100%", maxHeight: "100%", objectFit: "contain" }} />
              : <span style={{ fontSize: 10.5, color: "var(--text-muted)" }}>sem logo</span>}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button type="button" className="btn btn-ghost btn-sm" onClick={() => fileRef.current && fileRef.current.click()}><Icon name="upload" size={13} /> {ctx.identidadeVisual.logoDataUrl ? "Substituir" : "Enviar logo"}</button>
            {ctx.identidadeVisual.logoDataUrl && <button type="button" className="btn btn-ghost btn-sm" onClick={removeLogo}>Remover</button>}
          </div>
          <input ref={fileRef} type="file" accept="image/png,image/jpeg,image/webp" style={{ display: "none" }} onChange={handleLogoFile} />
        </div>
        <p className="hint" style={{ margin: 0 }}>PNG, JPG ou WebP, até 3 MB. A imagem é redimensionada automaticamente para exibição na barra lateral.</p>
        {error && <div className="stale-alert" style={{ marginTop: 10 }}><Icon name="alert" size={12} /> {error}</div>}
      </div>
    </div>
  );
}

  const collectionMap = { tarefa: ctx.tasks, decisao: ctx.decisions, pendencia: ctx.pendencies, risco: ctx.risks, mudanca: ctx.changes, documento: ctx.documents, marco: ctx.milestones };
  const rec = (collectionMap[type] || []).find((x) => x.id === id);

  const project = projectById(rec.projectId);

    <>

        <div>

        {type === "tarefa" && <TaskDetail rec={rec} ctx={ctx} onClose={onClose} />}
        {type === "decisao" && <DecisionDetail rec={rec} ctx={ctx} onClose={onClose} />}
        {type === "pendencia" && <PendencyDetail rec={rec} ctx={ctx} onClose={onClose} />}
        {type === "risco" && <RiskDetail rec={rec} ctx={ctx} onClose={onClose} />}
        {type === "mudanca" && <ChangeDetail rec={rec} ctx={ctx} onClose={onClose} />}
        {type === "documento" && <MaterialDetail rec={rec} ctx={ctx} onClose={onClose} />}
        {type === "marco" && <MilestoneDetail rec={rec} ctx={ctx} onClose={onClose} />}
      </div>
    </>
  );
}
function recTitle(type, rec) {
  return { tarefa: rec.titulo, decisao: rec.decisao, pendencia: rec.pendencia, risco: rec.descricao, mudanca: rec.novaDefinicao, documento: rec.nome, marco: rec.marco, reuniao: rec.titulo, nota: rec.titulo }[type];
}

/* drawer de um evento do Google Agenda (fora do sistema de goToRecord/GenericDrawerContent, de propósito —
   evento do Google não é um registro da Central, é uma leitura ao vivo da agenda conectada) */
function GoogleEventDrawerContent({ eventKey, onClose, ctx }) {
  const ev = (ctx.googleEvents || []).find((e) => e.key === eventKey);
  const linkedProjectId = ((ctx.googleEventLinks || []).find((l) => l.id === eventKey) || {}).projectId || "";
  const [selectedProject, setSelectedProject] = useState(linkedProjectId);
  useEffect(() => { setSelectedProject(linkedProjectId); }, [linkedProjectId]);

  if (!ev) return <div className="drawer-body"><EmptyState text="Evento não encontrado — pode ter sido removido do Google Agenda ou a agenda ainda não foi sincronizada nesta sessão." /></div>;

  const conta = ctx.googleAccounts.find((a) => a.id === ev.accountId);
  const calendario = (ctx.googleCalendarsByAccount[ev.accountId] || []).find((c) => c.id === ev.calendarId);
  const project = linkedProjectId ? projectById(linkedProjectId) : null;

  function vincular(e) {
    e.preventDefault();
    ctx.linkGoogleEventToProject(ev.key, selectedProject || null);
    ctx.setToast(selectedProject ? "Evento vinculado ao projeto." : "Vínculo com projeto removido.");
  }

  return (
    <>
      <div className="drawer-header">
        <div>
          <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: ".04em", color: "var(--text-muted)", fontWeight: 700, marginBottom: 6 }}>Evento do Google Agenda</div>
          <h2>{ev.titulo}</h2>
          {project && <a onClick={() => { onClose(); ctx.openProject(project.id); }} style={{ cursor: "pointer" }}>{project.nome}</a>}
        </div>
        <button className="drawer-close" onClick={onClose}><Icon name="x" /></button>
      </div>
      <div className="drawer-body">
        <div className="field-grid" style={{ marginTop: 0 }}>
          <div className="field"><span className="k">Data</span><span className="v">{fmtDateLong(ev.data)}</span></div>
          <div className="field"><span className="k">Horário</span><span className="v">{ev.diaInteiro ? "Dia inteiro" : (ev.horario || "—")}</span></div>
          <div className="field"><span className="k">Conta</span><span className="v">{conta ? (conta.apelido || conta.email) : "—"}</span></div>
          <div className="field"><span className="k">Calendário</span><span className="v">{calendario ? calendario.nome : ev.calendarId}</span></div>
          <div className="field"><span className="k">Organizador</span><span className="v">{ev.organizador || "—"}</span></div>
          <div className="field"><span className="k">Local</span><span className="v">{ev.local || "—"}</span></div>
        </div>
        {ev.participantes && ev.participantes.length > 0 && (
          <div className="field-block" style={{ margin: "0 0 12px" }}>
            <span className="k">Participantes</span>
            <span className="v">{ev.participantes.join(", ")}</span>
          </div>
        )}
        {ev.descricao && (
