<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Central de Projetos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   CENTRAL DE PROJETOS — design tokens e estilos
   ========================================================================== */

:root {
  /* ---- cores institucionais ---- */
  --primary: #102850;
  --accent: #FF9933;
  --neutral: #727376;
  --bg-soft: #F1F1F1;

  /* ---- paleta clara (padrão) ---- */
  --bg: #F1F1F1;
  --bg-canvas: #F1F1F1;
  --surface: #FFFFFF;
  --surface-raised: #FFFFFF;
  --surface-sunken: #E9EAEC;
  --sidebar-bg: #102850;
  --sidebar-bg-active: #1B3A6E;
  --sidebar-text: #C7D2E6;
  --sidebar-text-active: #FFFFFF;
  --sidebar-border: rgba(255,255,255,0.10);

  --border: #DEDFE2;
  --border-strong: #C7C9CD;
  --text-primary: #17202E;
  --text-secondary: #52565E;
  --text-muted: #83868D;
  --text-on-navy: #EDF1F8;
  --accent: #FF9933;
  --accent-strong: #D97A16;
  --link: #1B3A6E;

  --success: #1F7A54;
  --success-bg: #E4F3EC;
  --warning: #C97400;
  --warning-bg: #FFF1DC;
  --danger: #C1442D;
  --danger-bg: #FBE7E2;
  --info: #3C5C8F;
  --info-bg: #E7ECF5;
  --neutral: #727376;
  --neutral-bg: #EAEAEB;

  --shadow-sm: 0 1px 2px rgba(16,40,80,0.06), 0 1px 1px rgba(16,40,80,0.04);
  --shadow-md: 0 4px 14px rgba(16,40,80,0.10), 0 2px 4px rgba(16,40,80,0.06);
  --shadow-lg: 0 16px 40px rgba(16,40,80,0.18);

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;

  --font-display: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1626;
    --bg-canvas: #0B1626;
    --surface: #101E33;
    --surface-raised: #14263F;
    --surface-sunken: #0A1420;
    --sidebar-bg: #0A1830;
    --sidebar-bg-active: #1B3A6E;
    --sidebar-text: #9FB1CE;
    --sidebar-text-active: #FFFFFF;
    --sidebar-border: rgba(255,255,255,0.08);

    --border: #223554;
    --border-strong: #2E4670;
    --text-primary: #EDF1F8;
    --text-secondary: #AEBBD1;
    --text-muted: #7E8CA6;
    --text-on-navy: #EDF1F8;
    --accent: #FFA845;
    --accent-strong: #FFBE71;
    --link: #8FB0E8;

    --success: #4CBE8D;
    --success-bg: rgba(76,190,141,0.14);
    --warning: #FFB258;
    --warning-bg: rgba(255,178,88,0.14);
    --danger: #F0836A;
    --danger-bg: rgba(240,131,106,0.14);
    --info: #8CA9DD;
    --info-bg: rgba(140,169,221,0.14);
    --neutral: #9A9CA1;
    --neutral-bg: rgba(154,156,161,0.14);

    --shadow-sm: 0 1px 2px rgba(0,0,0,0.30);
    --shadow-md: 0 4px 14px rgba(0,0,0,0.36);
    --shadow-lg: 0 16px 40px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"] {
  --bg: #0B1626;
  --bg-canvas: #0B1626;
  --surface: #101E33;
  --surface-raised: #14263F;
  --surface-sunken: #0A1420;
  --sidebar-bg: #0A1830;
  --sidebar-bg-active: #1B3A6E;
  --sidebar-text: #9FB1CE;
  --sidebar-text-active: #FFFFFF;
  --sidebar-border: rgba(255,255,255,0.08);

  --border: #223554;
  --border-strong: #2E4670;
  --text-primary: #EDF1F8;
  --text-secondary: #AEBBD1;
  --text-muted: #7E8CA6;
  --text-on-navy: #EDF1F8;
  --accent: #FFA845;
  --accent-strong: #FFBE71;
  --link: #8FB0E8;

  --success: #4CBE8D;
  --success-bg: rgba(76,190,141,0.14);
  --warning: #FFB258;
  --warning-bg: rgba(255,178,88,0.14);
  --danger: #F0836A;
  --danger-bg: rgba(240,131,106,0.14);
  --info: #8CA9DD;
  --info-bg: rgba(140,169,221,0.14);
  --neutral: #9A9CA1;
  --neutral-bg: rgba(154,156,161,0.14);

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.30);
  --shadow-md: 0 4px 14px rgba(0,0,0,0.36);
  --shadow-lg: 0 16px 40px rgba(0,0,0,0.5);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; color: var(--text-primary); }
p { margin: 0; }
button { font-family: inherit; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
::selection { background: var(--accent); color: #17202E; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ---------------------------------- APP SHELL --------------------------------- */
#root { height: 100%; }
.app-shell {
  display: grid;
  grid-template-columns: 260px 1fr;
  height: 100vh;
  background: var(--bg-canvas);
}

/* ------------------------------------ SIDEBAR ---------------------------------- */
.sidebar {
  background: var(--sidebar-bg);
  color: var(--sidebar-text);
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
  gap: 4px;
  overflow-y: auto;
  border-right: 1px solid var(--sidebar-border);
}
.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px 18px 8px;
}
.sidebar-brand-mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(155deg, var(--accent), #E07A00);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 800; color: #17202E; font-size: 15px;
  flex-shrink: 0;
}
.sidebar-brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.sidebar-brand-text strong { color: #fff; font-family: var(--font-display); font-size: 14.5px; font-weight: 700; }
.sidebar-brand-text span { color: var(--sidebar-text); font-size: 11.5px; }

.sidebar-nav { display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px; }
.sidebar-link {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: var(--radius-sm);
  color: var(--sidebar-text); font-size: 13.5px; font-weight: 500;
  cursor: pointer; border: none; background: none; text-align: left; width: 100%;
  transition: background .12s ease, color .12s ease;
}
.sidebar-link:hover { background: rgba(255,255,255,0.06); color: #fff; text-decoration: none; }
.sidebar-link.active { background: var(--sidebar-bg-active); color: var(--sidebar-text-active); }
.sidebar-link .icon { width: 17px; text-align: center; flex-shrink: 0; opacity: .9; }
.sidebar-link .count {
  margin-left: auto; font-family: var(--font-mono); font-size: 11px;
  background: rgba(255,255,255,0.12); padding: 1px 6px; border-radius: 20px;
}
.sidebar-link.active .count { background: rgba(255,255,255,0.22); }

.sidebar-section-title {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
  color: rgba(199,210,230,0.55); font-weight: 700; padding: 16px 10px 6px;
}
.sidebar-projects { display: flex; flex-direction: column; gap: 1px; }
.sidebar-project {
  display: flex; align-items: center; gap: 9px; padding: 7px 10px;
  border-radius: var(--radius-sm); cursor: pointer; border: none; background: none;
  color: var(--sidebar-text); font-size: 13px; text-align: left; width: 100%;
}
.sidebar-project:hover { background: rgba(255,255,255,0.06); color: #fff; }
.sidebar-project.active { background: var(--sidebar-bg-active); color: #fff; }
.sidebar-project-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

.sidebar-footer {
  margin-top: auto; padding-top: 14px; border-top: 1px solid var(--sidebar-border);
  display: flex; align-items: center; gap: 10px; padding-left: 8px;
}
.sidebar-user-avatar {
  width: 30px; height: 30px; border-radius: 50%; background: var(--accent);
  color: #17202E; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.sidebar-footer-text { line-height: 1.25; overflow: hidden; }
.sidebar-footer-text strong { color: #fff; font-size: 12.5px; display: block; }
.sidebar-footer-text span { color: var(--sidebar-text); font-size: 11px; }
.theme-toggle {
  margin-left: auto; background: rgba(255,255,255,0.08); border: none; color: var(--sidebar-text);
  width: 26px; height: 26px; border-radius: 50%; cursor: pointer; flex-shrink: 0; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
}
.theme-toggle:hover { background: rgba(255,255,255,0.16); color: #fff; }

/* ------------------------------------ MAIN ------------------------------------- */
.main-col { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 28px; border-bottom: 1px solid var(--border);
  background: var(--surface); flex-shrink: 0; position: relative; z-index: 30;
}
.topbar-title { display: flex; flex-direction: column; gap: 1px; margin-right: 6px; min-width: 0; }
.topbar-title h1 { font-size: 17px; }
.topbar-breadcrumb { font-size: 12px; color: var(--text-muted); display: flex; gap: 6px; align-items: center; }
.topbar-breadcrumb button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 12px; padding: 0; font-family: inherit; }
.topbar-breadcrumb button:hover { color: var(--link); text-decoration: underline; }

.search-wrap { position: relative; flex: 1; max-width: 420px; margin-left: auto; }
.search-input {
  width: 100%; padding: 8px 12px 8px 34px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--surface-sunken); color: var(--text-primary); font-size: 13px;
}
.search-input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 13px; pointer-events: none; }
.search-results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
  max-height: 420px; overflow-y: auto; z-index: 50;
}
.search-results-group { padding: 6px 0; border-bottom: 1px solid var(--border); }
.search-results-group:last-child { border-bottom: none; }
.search-results-group-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); font-weight: 700; padding: 6px 14px 4px; }
.search-result-item { display: flex; flex-direction: column; gap: 1px; padding: 7px 14px; cursor: pointer; }
.search-result-item:hover { background: var(--surface-sunken); }
.search-result-item strong { font-size: 12.5px; font-weight: 600; }
.search-result-item span { font-size: 11.5px; color: var(--text-muted); }
.search-empty { padding: 18px 14px; text-align: center; color: var(--text-muted); font-size: 12.5px; }

.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; white-space: nowrap;
  font-family: inherit; transition: filter .12s ease, background .12s ease;
}
.btn:active { filter: brightness(0.94); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--link); }
.btn-accent { background: var(--accent); color: #17202E; }
.btn-accent:hover { filter: brightness(1.06); }
.btn-ghost { background: transparent; color: var(--text-secondary); border-color: var(--border); }
.btn-ghost:hover { background: var(--surface-sunken); color: var(--text-primary); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-danger-ghost { background: transparent; color: var(--danger); border-color: var(--danger-bg); }
.btn-danger-ghost:hover { background: var(--danger-bg); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn {
  width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface);
  color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0;
}
.icon-btn:hover { background: var(--surface-sunken); color: var(--text-primary); }
.mobile-menu-btn { display: none; }

.content-scroll { flex: 1; overflow-y: auto; padding: 24px 28px 60px; }
.content-scroll.narrow { max-width: 1180px; }

/* --------------------------------- KPI / STAT TILES ----------------------------- */
.kpi-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 22px; }
.kpi-tile {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; cursor: pointer;
  box-shadow: var(--shadow-sm); transition: box-shadow .15s ease, transform .15s ease;
}
.kpi-tile:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.kpi-tile-label { font-size: 11.5px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.kpi-tile-value { font-family: var(--font-display); font-size: 28px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi-tile-sub { font-size: 11.5px; color: var(--text-muted); }
.kpi-tile.tone-danger .kpi-tile-value { color: var(--danger); }
.kpi-tile.tone-warning .kpi-tile-value { color: var(--warning); }
.kpi-tile.tone-accent .kpi-tile-value { color: var(--accent-strong); }
.kpi-tile.tone-info .kpi-tile-value { color: var(--info); }

.mini-stats-row { display: flex; gap: 18px; margin: -10px 0 20px; flex-wrap: wrap; }
.mini-stat { font-size: 12.5px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
.mini-stat strong { font-family: var(--font-mono); color: var(--text-primary); }

/* ----------------------------------- SECTIONS ----------------------------------- */
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 15px; }
.section-head .hint { font-size: 12px; color: var(--text-muted); }

.filters-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.filters-bar select, .filters-bar input[type="text"] {
  padding: 7px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--surface); color: var(--text-primary); font-size: 12.5px; font-family: inherit;
}
.filters-bar select:focus, .filters-bar input:focus { outline: none; border-color: var(--accent); }
.view-toggle { display: flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; margin-left: auto; }
.view-toggle button { border: none; background: var(--surface); color: var(--text-secondary); padding: 7px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
.view-toggle button.active { background: var(--primary); color: #fff; }
.filters-clear { font-size: 12px; color: var(--link); background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; }

/* ------------------------------------ BADGES ------------------------------------ */
.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px;
  font-size: 11px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; line-height: 1.5;
}
.pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.tone-success { background: var(--success-bg); color: var(--success); }
.tone-warning { background: var(--warning-bg); color: var(--warning); }
.tone-danger { background: var(--danger-bg); color: var(--danger); }
.tone-info { background: var(--info-bg); color: var(--info); }
.tone-neutral { background: var(--neutral-bg); color: var(--neutral); }
.tone-accent { background: rgba(255,153,51,0.16); color: var(--accent-strong); }

.priority-tag { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.priority-tag.alta { color: var(--danger); }
.priority-tag.media { color: var(--warning); }
.priority-tag.baixa { color: var(--text-muted); }

/* ------------------------------------- CARDS ------------------------------------- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
}
.projects-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.project-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 16px 16px 14px; cursor: pointer; box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column; gap: 10px; transition: box-shadow .15s ease, transform .15s ease, border-color .15s ease;
  border-left: 3px solid var(--border-strong);
}
.project-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.project-card.tone-saude-saudavel { border-left-color: var(--success); }
.project-card.tone-saude-atencao { border-left-color: var(--warning); }
.project-card.tone-saude-critico { border-left-color: var(--danger); }

.project-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.project-card-title { font-family: var(--font-display); font-size: 14.5px; font-weight: 700; }
.project-card-area { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
.project-card-people { display: flex; gap: 14px; font-size: 11.5px; color: var(--text-secondary); }
.project-card-people div { display: flex; flex-direction: column; gap: 1px; }
.project-card-people span.label { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); }

.progress-track { height: 6px; border-radius: 20px; background: var(--surface-sunken); overflow: hidden; }
.progress-fill { height: 100%; border-radius: 20px; background: var(--link); }
.progress-row { display: flex; align-items: center; gap: 8px; }
.progress-row .pct { font-family: var(--font-mono); font-size: 12px; font-weight: 700; width: 34px; text-align: right; flex-shrink: 0; }

.project-card-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 11.5px; color: var(--text-secondary); }
.project-card-meta .k { color: var(--text-muted); }
.project-card-counts { display: flex; gap: 12px; font-size: 11.5px; color: var(--text-secondary); border-top: 1px dashed var(--border); padding-top: 9px; margin-top: 2px; }
.project-card-counts b { font-family: var(--font-mono); color: var(--text-primary); }
.project-card-footer { font-size: 10.5px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }

/* project table */
.data-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
table.data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 900px; }
table.data-table th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--surface-sunken); white-space: nowrap; }
table.data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.data-table tbody tr { cursor: pointer; }
table.data-table tbody tr:hover { background: var(--surface-sunken); }
table.data-table tbody tr:last-child td { border-bottom: none; }
.table-name-cell strong { display: block; font-size: 12.5px; }
.table-name-cell span { font-size: 11px; color: var(--text-muted); }

/* ------------------------------------ AVATARS ------------------------------------ */
.avatar {
  width: 22px; height: 22px; border-radius: 50%; background: var(--primary); color: #fff;
  font-size: 9.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.avatar.lg { width: 32px; height: 32px; font-size: 12px; }
.person-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }

/* ------------------------------------- FEED --------------------------------------- */
.feed-list { display: flex; flex-direction: column; }
.feed-item {
  display: flex; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--border); cursor: pointer; align-items: flex-start;
}
.feed-item:last-child { border-bottom: none; }
.feed-item:hover .feed-title { color: var(--link); text-decoration: underline; }
.feed-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; margin-top: 1px; }
.feed-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.feed-time { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
.feed-title { font-size: 12.5px; font-weight: 600; color: var(--text-primary); }
.feed-desc { font-size: 12px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-project { font-size: 11px; color: var(--text-muted); }

/* -------------------------------------- TABS -------------------------------------- */
.tabs-strip { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; margin-bottom: 20px; }
.tab-btn {
  padding: 10px 14px; font-size: 12.5px; font-weight: 600; color: var(--text-muted); background: none; border: none;
  cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: inherit;
  display: flex; align-items: center; gap: 6px;
}
.tab-btn:hover { color: var(--text-primary); }
.tab-btn.active { color: var(--link); border-bottom-color: var(--accent); }
.tab-btn .badge-count { background: var(--surface-sunken); color: var(--text-muted); font-family: var(--font-mono); font-size: 10.5px; padding: 1px 6px; border-radius: 10px; }
.tab-btn.active .badge-count { background: rgba(255,153,51,0.18); color: var(--accent-strong); }

/* ---------------------------------- PROJECT HEADER --------------------------------- */
.project-header {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 20px 22px; margin-bottom: 18px; box-shadow: var(--shadow-sm);
}
.project-header-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.project-header-badges { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.project-header h1 { font-size: 21px; margin-bottom: 4px; }
.project-header .objetivo { font-size: 13px; color: var(--text-secondary); max-width: 640px; margin-bottom: 2px; }
.project-header-meta { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 14px; }
.project-header-meta-item { display: flex; flex-direction: column; gap: 3px; }
.project-header-meta-item .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); font-weight: 700; }
.project-header-meta-item .v { font-size: 12.5px; color: var(--text-primary); font-weight: 600; }
.project-header-progress { min-width: 180px; }

.attention-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 20px; }
.attention-tile {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px;
  cursor: pointer; display: flex; flex-direction: column; gap: 4px;
}
.attention-tile:hover { border-color: var(--border-strong); }
.attention-tile .n { font-family: var(--font-display); font-size: 20px; font-weight: 800; }
.attention-tile .l { font-size: 11px; color: var(--text-muted); font-weight: 600; }
.attention-tile.tone-danger .n { color: var(--danger); }
.attention-tile.tone-warning .n { color: var(--warning); }

/* ------------------------------------- LIST ITEMS ----------------------------------- */
.list-stack { display: flex; flex-direction: column; gap: 8px; }
.item-row {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; cursor: pointer;
}
.item-row:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.item-row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.item-row-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.item-row-sub { font-size: 12px; color: var(--text-secondary); }
.item-row-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.item-row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
.item-row-date { font-size: 11.5px; color: var(--text-muted); font-family: var(--font-mono); }
.origin-tag { font-size: 11px; color: var(--text-muted); display: inline-flex; align-items: center; gap: 4px; }
.origin-tag .link-out { color: var(--link); cursor: pointer; }
.origin-tag .link-out:hover { text-decoration: underline; }

.group-heading { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
.group-heading:first-child { margin-top: 0; }
.group-heading .n { font-family: var(--font-mono); background: var(--surface-sunken); padding: 1px 7px; border-radius: 10px; }
.group-heading.tone-danger { color: var(--danger); }
.group-heading.tone-warning { color: var(--warning); }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 12.5px; }
.empty-state .icon { font-size: 26px; margin-bottom: 8px; opacity: .6; }

/* ------------------------------------ TASK CARD -------------------------------------- */
.task-checkbox {
  width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border-strong); flex-shrink: 0;
  cursor: pointer; margin-top: 2px; display: flex; align-items: center; justify-content: center; background: var(--surface); font-size: 11px; color: #fff;
}
.task-checkbox.done { background: var(--success); border-color: var(--success); }
.task-row.done .item-row-title { text-decoration: line-through; color: var(--text-muted); }

/* ------------------------------------ QUICK ADD -------------------------------------- */
.quick-add {
  display: flex; gap: 8px; margin-bottom: 18px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 8px; align-items: center;
}
.quick-add input[type="text"] { flex: 1; border: none; background: none; padding: 6px 8px; font-size: 13px; color: var(--text-primary); font-family: inherit; }
.quick-add input[type="text"]:focus { outline: none; }
.quick-add select { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 8px; font-size: 12px; background: var(--surface); color: var(--text-secondary); font-family: inherit; }

/* --------------------------------- DIARY / TIMELINE ----------------------------------- */
.diary-day-group { margin-bottom: 22px; }
.diary-day-label { font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--link); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.diary-entries { position: relative; padding-left: 20px; border-left: 2px solid var(--border); display: flex; flex-direction: column; gap: 14px; }
.diary-entry { position: relative; }
.diary-entry::before {
  content: ""; position: absolute; left: -25px; top: 3px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--border);
}
.diary-entry-time { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
.diary-entry-title { font-size: 13px; font-weight: 600; margin: 2px 0 3px; cursor: pointer; }
.diary-entry-title:hover { color: var(--link); text-decoration: underline; }
.diary-entry-desc { font-size: 12.5px; color: var(--text-secondary); }
.diary-filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.chip {
  padding: 5px 11px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary);
}
.chip.active { background: var(--accent); color: #17202E; border-color: var(--accent); }

/* -------------------------------------- MILESTONES -------------------------------------- */
.milestone-track { display: flex; flex-direction: column; }
.milestone-row { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); }
.milestone-row:last-child { border-bottom: none; }
.milestone-marker { width: 30px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
.milestone-marker .dot { width: 13px; height: 13px; border-radius: 50%; border: 3px solid var(--border-strong); background: var(--surface); }
.milestone-marker .dot.done { background: var(--success); border-color: var(--success); }
.milestone-marker .dot.risk { background: var(--danger); border-color: var(--danger); }
.milestone-marker .dot.progress { background: var(--info); border-color: var(--info); }
.milestone-marker .line { width: 2px; flex: 1; background: var(--border); margin-top: 4px; }
.milestone-body { flex: 1; display: flex; flex-direction: column; gap: 5px; padding-top: 1px; }
.milestone-title { font-size: 13.5px; font-weight: 700; }
.milestone-meta { font-size: 12px; color: var(--text-secondary); display: flex; gap: 14px; flex-wrap: wrap; }

/* -------------------------------------- MODAL / DRAWER ----------------------------------- */
.overlay {
  position: fixed; inset: 0; background: rgba(10,20,35,0.5); z-index: 100;
  display: flex; justify-content: flex-end; animation: fadeIn .15s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.drawer {
  width: min(720px, 94vw); height: 100%; background: var(--bg); box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column; animation: slideIn .18s ease;
}
@keyframes slideIn { from { transform: translateX(24px); opacity: .6; } to { transform: translateX(0); opacity: 1; } }
.drawer-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
.drawer-header h2 { font-size: 16.5px; margin-bottom: 4px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 22px 24px 40px; }
.drawer-close { background: var(--surface-sunken); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; color: var(--text-secondary); font-size: 14px; flex-shrink: 0; }
.drawer-close:hover { background: var(--border); color: var(--text-primary); }

.modal-center { display: flex; align-items: center; justify-content: center; padding: 24px; }
.modal-box { width: min(640px, 100%); background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); max-height: 88vh; display: flex; flex-direction: column; }

.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; margin: 16px 0; }
.field-grid.full { grid-template-columns: 1fr; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); font-weight: 700; }
.field .v { font-size: 13px; color: var(--text-primary); }
.field-block { margin: 16px 0; }
.field-block .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); font-weight: 700; margin-bottom: 6px; display: block; }
.field-block .v { font-size: 13px; color: var(--text-primary); line-height: 1.6; }
.divider { height: 1px; background: var(--border); margin: 18px 0; border: none; }

.subrecord-chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
.subrecord-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: var(--radius-sm);
  background: var(--surface-sunken); border: 1px solid var(--border); font-size: 12px; cursor: pointer; color: var(--text-secondary);
}
.subrecord-chip:hover { border-color: var(--border-strong); color: var(--text-primary); }

/* -------------------------------------- AI PANEL ------------------------------------------ */
.ai-banner {
  border: 1px dashed var(--accent-strong); background: rgba(255,153,51,0.08); border-radius: var(--radius-md);
  padding: 14px 16px; display: flex; align-items: center; gap: 14px; margin: 18px 0;
}
.ai-banner .ai-icon {
  width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(155deg, var(--accent), #E07A00);
  display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; color: #17202E;
}
.ai-banner-text { flex: 1; }
.ai-banner-text strong { font-size: 13px; display: block; margin-bottom: 2px; }
.ai-banner-text span { font-size: 12px; color: var(--text-secondary); }
.ai-loading { display: flex; align-items: center; gap: 10px; padding: 22px 0; justify-content: center; color: var(--text-secondary); font-size: 13px; }
.spinner {
  width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--border); border-top-color: var(--accent);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.ai-review-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.ai-review-summary { background: var(--surface-sunken); border-radius: var(--radius-md); padding: 12px 14px; font-size: 12.5px; color: var(--text-secondary); margin: 12px 0 20px; line-height: 1.6; }
.suggestion-group { margin-bottom: 20px; }
.suggestion-group-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin-bottom: 8px; }
.suggestion-card {
  border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 8px; background: var(--surface);
  display: flex; flex-direction: column; gap: 8px; transition: opacity .15s ease;
}
.suggestion-card.status-added { border-color: var(--success); background: var(--success-bg); }
.suggestion-card.status-ignored { opacity: .5; }
.suggestion-card-title { font-size: 13px; font-weight: 600; }
.suggestion-card-meta { font-size: 11.5px; color: var(--text-muted); display: flex; gap: 10px; flex-wrap: wrap; }
.suggestion-card-actions { display: flex; gap: 8px; margin-top: 2px; }
.suggestion-status-flag { font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
.suggestion-status-flag.added { color: var(--success); }
.suggestion-status-flag.ignored { color: var(--text-muted); }
.suggestion-edit-form { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.suggestion-edit-form input, .suggestion-edit-form select, .suggestion-edit-form textarea {
  padding: 7px 9px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 12.5px; font-family: inherit; background: var(--surface); color: var(--text-primary); width: 100%;
}
.suggestion-edit-form textarea { resize: vertical; min-height: 50px; }
.ai-confirm-bar {
  position: sticky; bottom: -40px; margin: 0 -24px -40px; padding: 14px 24px; background: var(--surface);
  border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px; box-shadow: 0 -4px 14px rgba(0,0,0,0.06);
}
.ai-confirm-bar .summary { font-size: 12.5px; color: var(--text-secondary); flex: 1; }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #17202E;
  padding: 11px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg); z-index: 200;
  display: flex; align-items: center; gap: 8px; animation: toastIn .2s ease;
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* -------------------------------------- SEARCH VIEW -------------------------------------------- */
.search-view-results { display: flex; flex-direction: column; gap: 26px; }

/* -------------------------------------- DB STATUS (sidebar) -------------------------------------------- */
.db-status { display: flex; align-items: center; gap: 7px; font-size: 10.5px; color: var(--sidebar-text); opacity: .75; padding: 10px 8px 2px; line-height: 1.4; }
.db-status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; background: var(--neutral); }
.db-status-dot.tone-success { background: var(--success); }
.db-status-dot.tone-info { background: var(--info); }
.db-status-dot.tone-danger { background: var(--danger); }
.db-status-dot.tone-neutral { background: var(--sidebar-text); }

/* -------------------------------------- PLANEJAMENTO (calendário/cronograma) -------------------------------------------- */
.planning-hint { font-size: 12.5px; color: var(--text-muted); margin: -6px 0 16px; }

/* -------------------------------------- NOTAS -------------------------------------------- */
.note-quick-add {
  display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 12px; margin-bottom: 16px;
}
.note-quick-add input[type="text"], .note-quick-add select {
  padding: 7px 9px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--surface); color: var(--text-primary); font-size: 13px; font-family: inherit;
}
.note-quick-add textarea {
  padding: 8px 9px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface);
  color: var(--text-primary); font-size: 13px; font-family: inherit; resize: vertical; min-height: 66px;
}
.note-quick-add .btn { align-self: flex-end; }

.notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.note-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 13px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow-sm);
}
.note-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
.note-card-title { font-size: 13px; font-weight: 700; color: var(--text-primary); }
.note-card-excerpt { font-size: 12px; color: var(--text-secondary); line-height: 1.5; white-space: pre-line; }
.note-card-footer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; font-size: 11px; color: var(--text-muted); }
.note-card-meeting { display: inline-flex; align-items: center; gap: 4px; }
.note-card-date { margin-left: auto; }
.note-content-view {
  white-space: pre-line; font-size: 13px; line-height: 1.65; color: var(--text-primary);
  background: var(--surface-sunken); border-radius: var(--radius-sm); padding: 12px 14px;
}

/* -------------------------------------- CALENDÁRIO -------------------------------------------- */
.calendar-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.calendar-month-label { font-family: var(--font-display); font-size: 15px; min-width: 160px; }
.calendar-legend { display: flex; gap: 14px; margin-left: auto; font-size: 11.5px; color: var(--text-muted); flex-wrap: wrap; }
.calendar-legend span { display: inline-flex; align-items: center; gap: 5px; }
.calendar-legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.calendar-weekday { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); font-weight: 700; text-align: center; padding-bottom: 4px; }
.calendar-cell {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  min-height: 92px; min-width: 0; padding: 6px 7px; display: flex; flex-direction: column; gap: 4px; cursor: default;
}
.calendar-cell.empty { background: transparent; border-color: transparent; }
.calendar-cell.has-items { cursor: pointer; }
.calendar-cell.has-items:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.calendar-cell.today { border-color: var(--accent-strong); box-shadow: 0 0 0 1px var(--accent-strong) inset; }
.calendar-day-num { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted); font-weight: 700; }
.calendar-cell.today .calendar-day-num { color: var(--accent-strong); }
.calendar-day-items { display: flex; flex-direction: column; gap: 3px; overflow: hidden; min-width: 0; }
.calendar-item-chip {
  display: block; width: 100%; max-width: 100%; box-sizing: border-box;
  font-size: 10.5px; padding: 2px 6px; border-radius: 5px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; background: var(--surface-sunken); color: var(--text-secondary); border-left: 2px solid var(--neutral);
}
.calendar-item-chip.kind-reuniao { border-left-color: var(--info); }
.calendar-item-chip.kind-tarefa { border-left-color: var(--accent-strong); }
.calendar-item-chip.kind-marco { border-left-color: var(--success); }
.calendar-item-chip.kind-google { border-left-color: var(--neutral); }
.calendar-more { font-size: 10px; color: var(--text-muted); padding-left: 2px; }
.calendar-day-dots { display: none; gap: 3px; }
.calendar-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--neutral); }
.calendar-dot.kind-reuniao { background: var(--info); }
.calendar-dot.kind-tarefa { background: var(--accent-strong); }
.calendar-dot.kind-marco { background: var(--success); }
.calendar-dot.kind-google { background: var(--neutral); }

/* -------------------------------------- GANTT -------------------------------------------- */
.gantt-card { padding: 18px 18px 6px; overflow-x: auto; }
.gantt-scroll { min-width: 780px; position: relative; }
.gantt-months { position: relative; height: 20px; margin-bottom: 6px; border-bottom: 1px solid var(--border); }
.gantt-month-tick { position: absolute; top: 0; font-size: 10.5px; color: var(--text-muted); transform: translateX(-2px); white-space: nowrap; }
.gantt-rows { position: relative; }
.gantt-today-line { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--accent-strong); z-index: 3; pointer-events: none; }
.gantt-row { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.gantt-row:last-child { border-bottom: none; }
.gantt-row-label {
  width: 180px; flex: 0 0 180px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary);
}
.gantt-row-label:hover { color: var(--link); text-decoration: underline; }
.gantt-row-track { position: relative; flex: 1; height: 24px; background: var(--surface-sunken); border-radius: 6px; }
.gantt-bar {
  position: absolute; top: 3px; height: 18px; border-radius: 5px; background: var(--neutral);
  cursor: pointer; overflow: hidden; box-shadow: var(--shadow-sm);
}
.gantt-bar-fill { height: 100%; background: rgba(0,0,0,0.18); }
.gantt-bar.tone-saude-saudavel { background: var(--success); }
.gantt-bar.tone-saude-atencao { background: var(--warning); }
.gantt-bar.tone-saude-critico { background: var(--danger); }
.gantt-milestone {
  position: absolute; top: 50%; width: 11px; height: 11px; background: var(--surface); border: 2.5px solid var(--text-primary);
  transform: translate(-50%, -50%) rotate(45deg); cursor: pointer; z-index: 2;
}
.gantt-milestone.risk { border-color: var(--danger); }

function projectById(id) {
  return CURRENT_PROJECTS.find((p) => p.id === id) || null;

let CURRENT_PEOPLE = null; // null até a migração/carregamento terminar — ver App()
function personLabel(key) {
  if (!key) return "";
  const p = CURRENT_PEOPLE && CURRENT_PEOPLE.find((x) => x.id === key);
  if (p) return p.nome;
  return PEOPLE[key] ? PEOPLE[key].nome : key;
}
function initialsFromName(nome) {
  const partes = (nome || "").trim().split(/\s+/).filter(Boolean);
  if (partes.length === 0) return "??";
  if (partes.length === 1) return partes[0].slice(0, 2).toUpperCase();
  return (partes[0][0] + partes[partes.length - 1][0]).toUpperCase();
}
function personInitials(key) {
  if (!key) return "??";
  const p = CURRENT_PEOPLE && CURRENT_PEOPLE.find((x) => x.id === key);
  if (p) return p.iniciais || initialsFromName(p.nome);
  return PEOPLE[key] ? PEOPLE[key].iniciais : "??";
}
let CURRENT_EMPRESAS = [];
function empresaById(id) {
  if (!id) return null;
  return CURRENT_EMPRESAS.find((e) => e.id === id) || null;
}
function empresaLabel(id) {
  const e = empresaById(id);
  return e ? e.nome : "Pessoal / Sem empresa";
}
function daysBetween(dateA, dateB) {
  const a = new Date(dateA + "T00:00:00");
  const b = new Date(dateB + "T00:00:00");
  return Math.round((b - a) / 86400000);
}

/* ----------------------------------- HELPERS ---------------------------------- */
function cx(...parts) { return parts.filter(Boolean).join(" "); }
function normalize(str) {
  return (str || "").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
}
function fmtDate(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
/* formata um timestamp ISO completo (ex.: "última sincronização"), diferente de fmtDate (que espera só data) */
function fmtDateTime(iso) {
  if (!iso) return "—";
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return "—";
  const dd = String(dt.getDate()).padStart(2, "0");
  const mm = String(dt.getMonth() + 1).padStart(2, "0");
  const hh = String(dt.getHours()).padStart(2, "0");
  const mi = String(dt.getMinutes()).padStart(2, "0");
  return `${dd}/${mm}/${dt.getFullYear()} ${hh}:${mi}`;
}
function fmtDateLong(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  return `${parseInt(d, 10)} de ${MESES_FULL[parseInt(m, 10) - 1]} de ${y}`;
}
function fmtDateWeekday(iso) {
  const dt = new Date(iso + "T00:00:00");
  return `${DIAS_SEMANA[dt.getDay()]}, ${parseInt(iso.split("-")[2],10)} de ${MESES_FULL[dt.getMonth()]}`;
}
function relLabel(iso, hora) {
  const diff = daysBetween(iso, TODAY);
  let d;
  if (diff === 0) d = "Hoje";
  else if (diff === 1) d = "Ontem";
  else if (diff === -1) d = "Amanhã";
  else { const [y, m, day] = iso.split("-"); d = `${day}/${m}`; }
  return hora ? `${d}, ${hora}` : d;
}
function daysUntil(iso) { return daysBetween(TODAY, iso); }
function statusClass(str) { return normalize(str).replace(/\s+/g, ""); }

function personChip(key) {
  if (!key) return null;
  return { nome: personLabel(key), iniciais: personInitials(key) };
}

/* tone helpers */
function projectTone(status) {
  return { "Em andamento": "info", "Aguardando": "warning", "Planejamento": "neutral", "Pausado": "neutral", "Concluído": "success" }[status] || "neutral";
}
function saudeTone(saude) {
  return { "Saudável": "success", "Atenção": "warning", "Crítico": "danger" }[saude] || "neutral";
}
/* "sem atualização recente" — 7 dias sem "movimentação relevante" (reunião, decisão, pendência,
   tarefa, anotação, material, risco, mudança ou atualização do diário), exceto projetos concluídos ou
   arquivados. Todas essas ações já alimentam o Diário do projeto (ver addTask/addNote/addDocument/
   addDiaryEntry e os fluxos manuais e de IA), por isso o Diário é usado como fonte técnica única —
   evitando checar cada coleção separadamente e garantindo que a regra reflita a movimentação real. */
function lastActivityDate(project, ctx) {
  let latest = project.ultimaAtualizacao;
  (ctx.diary || []).forEach((d) => { if (d.projectId === project.id && d.data > latest) latest = d.data; });
  return latest;
}
function isStale(project, ctx) {
  if (project.status === "Concluído" || project.arquivado) return false;
  return daysBetween(lastActivityDate(project, ctx), TODAY) >= 7;
}
function taskTone(status) {
  return { "Concluído": "success", "Em andamento": "info", "Aguardando": "warning", "A fazer": "neutral" }[status] || "neutral";
}
function pendTone(status) {
  return { "Atrasada": "danger", "Aberta": "warning", "Resolvida": "success" }[status] || "neutral";
}
function decisionTone(status) {
  return { "Definida": "success", "Revisada": "info", "Em análise": "warning", "Aguardando definição": "warning", "Cancelada": "neutral" }[status] || "neutral";
}
function milestoneTone(status) {
  return { "Concluído": "success", "Em risco": "danger", "Atrasado": "danger", "Em andamento": "info", "Não iniciado": "neutral", "Cancelado": "neutral" }[status] || "neutral";
}
function riskTone(tipo) {
  return { "Risco": "warning", "Problema": "danger", "Impedimento": "accent" }[tipo] || "neutral";
}
function priorityClass(p) { return normalize(p); }

/* Prioridade de Tarefas e Projetos: escala numérica fixa 0–3 (0 = crítica/pra ontem, 3 = sem
   prioridade), com cor por nível — não é mais uma lista configurável (ver DEFAULT_LISTS), já que
   o significado de cada nível é fixo. priorityInfo aceita também os valores antigos em texto
   ("Alta"/"Média"/"Baixa") para não quebrar registros gravados antes desta mudança. */
const PRIORITY_LEVELS = [
  { valor: 0, nome: "P0 · Crítica", descricao: "Crítica — para ontem", tone: "danger" },
  { valor: 1, nome: "P1 · Alta", descricao: "Alta prioridade", tone: "warning" },
  { valor: 2, nome: "P2 · Média", descricao: "Prioridade média", tone: "info" },
  { valor: 3, nome: "P3 · Sem prioridade", descricao: "Sem prioridade definida", tone: "neutral" },
];
function priorityInfo(v) {
  let n = v;
  if (typeof v !== "number") {
    n = v === "Alta" ? 1 : v === "Baixa" ? 3 : 2; // "Média" ou qualquer outro valor antigo cai em P2
  }
  return PRIORITY_LEVELS.find((l) => l.valor === n) || PRIORITY_LEVELS[2];
}
function PriorityBadge({ value }) {
  const info = priorityInfo(value);
  return <span className={cx("pill", "tone-" + info.tone)} title={info.descricao}>{info.nome}</span>;
}
function PrioritySelect({ value, onChange }) {
  return (
    <select className="v" value={priorityInfo(value).valor} onChange={(e) => onChange(Number(e.target.value))} style={fieldInputStyle}>
      {PRIORITY_LEVELS.map((l) => <option key={l.valor} value={l.valor}>{l.nome}</option>)}
    </select>
  );
}

/* ------------------------- LISTAS E CATEGORIAS CONFIGURÁVEIS: select reutilizável ------------------------- */
/* Usado em todo formulário que antes tinha uma lista fixa (status, saúde, prioridade, tipo, área etc.).
   Mostra apenas itens ativos da lista configurada em Configurações > Listas e Categorias, sempre na
   ordem definida lá, e permite adicionar um item novo na hora ("+ Adicionar novo…"), sem sair da tela. */
function ConfigListSelect({ ctx, listId, value, onChange, allowEmpty, emptyLabel = "—", style, allowInlineAdd = true }) {
  const itens = (ctx.listas[listId] || []).filter((i) => i.ativo || i.id === value).sort((a, b) => a.ordem - b.ordem);
  function handleChange(e) {
    const v = e.target.value;
    if (v === "__novo__") {
      const nome = window.prompt("Nome do novo item:");
      if (nome && nome.trim()) {
        const item = ctx.addListItem(listId, nome);
        if (item) onChange(item.id);
      }
      return;
    }
    onChange(v);
  }
  return (
    <select value={value || ""} onChange={handleChange} style={style || fieldInputStyle}>
      {allowEmpty && <option value="">{emptyLabel}</option>}
      {itens.map((i) => <option key={i.id} value={i.id}>{i.nome}</option>)}
      {allowInlineAdd && <option value="__novo__">+ Adicionar novo…</option>}
    </select>
  );
}

/* ------------------------- PESSOAS: select reutilizável (Responsável/Sponsor) ------------------------- */
function PersonSelect({ ctx, value, onChange, role, allowEmpty, emptyLabel = "—", style }) {
  const pessoas = (ctx.pessoas || []).filter((p) => (p.ativo || p.id === value) && (role === "sponsor" ? true : p.podeResponsavel !== false)).filter((p) => role !== "sponsor" || p.podeSponsor);
  function handleChange(e) {
    const v = e.target.value;
    if (v === "__nova__") {
      const nome = window.prompt("Nome da nova pessoa:");
      if (nome && nome.trim()) {
        const rec = ctx.addPessoa({ nome, podeResponsavel: true, podeSponsor: role === "sponsor" });
        onChange(rec.id);
      }
      return;
    }
    onChange(v);
  }
  return (
    <select value={value || ""} onChange={handleChange} style={style || fieldInputStyle}>
      {allowEmpty && <option value="">{emptyLabel}</option>}
      {pessoas.map((p) => <option key={p.id} value={p.id}>{p.nome}</option>)}
      <option value="__nova__">+ Adicionar pessoa…</option>
    </select>
  );
}

/* Botão para escolher um arquivo ("file") ou pasta ("folder") do Google Drive via Picker, numa das
   contas conectadas (conta de dados da Central + contas adicionais com Drive ativo). Quando há mais
   de uma conta disponível, mostra um pequeno seletor antes de abrir o Picker — nunca assume qual
   conta usar. startFolder (opcional) = {accountId, id} do projeto: se a conta escolhida for a mesma
   dona da pasta, o Picker já abre navegando a partir dela. */
function DrivePickerButton({ ctx, mode = "file", startFolder, onPick, label }) {
  const [showChooser, setShowChooser] = useState(false);
  const contas = [
    { id: null, label: "Conta de dados da Central" },
    ...ctx.googleAccounts.filter((a) => a.usaDrive).map((a) => ({ id: a.id, label: a.apelido || a.email })),
  ];

  function escolher(accountId) {
    setShowChooser(false);
    const startFolderId = startFolder && startFolder.accountId === accountId ? startFolder.id : undefined;
    ctx.openDrivePicker({ accountId, mode, startFolderId, onPick });
  }

  return (
    <div className="drive-picker-btn">
      <button type="button" className="btn btn-ghost btn-sm" onClick={() => contas.length > 1 ? setShowChooser((v) => !v) : escolher(null)}>
        <Icon name="link" size={13} /> {label}
      </button>
      {showChooser && (
        <div className="drive-account-chooser">
          <div className="drive-account-chooser-label">Escolha a conta</div>
          {contas.map((c) => <button type="button" key={c.id || "central"} onClick={() => escolher(c.id)}>{c.label}</button>)}
        </div>
      )}
    </div>
  );
}

<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>`;
const DOCX_RELS = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>`;
function docxAppProps(nomeApp) {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>${docxXmlEscape(nomeApp || "Central de Projetos")}</Application></Properties>`;
}
function docxXmlEscape(str) {
  return String(str == null ? "" : str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&apos;");
}
function docxCoreProps(title, nomeApp) {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${docxXmlEscape(title)}</dc:title><dc:creator>${docxXmlEscape(nomeApp || "Central de Projetos")}</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString()}</dcterms:created></cp:coreProperties>`;
}
function docxParagraphsXml(lines) {
  return lines.map((l) => {
    const pPr = [];
    if (l.indent) pPr.push(`<w:ind w:left="${l.indent}"/>`);
    const pPrXml = pPr.length ? `<w:pPr>${pPr.join("")}</w:pPr>` : "";
    const runsSrc = l.runs || [{ text: l.text, bold: l.bold, italic: l.italic, underline: l.underline, size: l.size, color: l.color, mono: l.mono }];
    const runsXml = runsSrc.map((r) => {
      if (r.text == null || r.text === "") return "";
      const rpr = [];
      if (r.bold) rpr.push("<w:b/>");
      if (r.italic) rpr.push("<w:i/>");
      if (r.underline) rpr.push(`<w:u w:val="single"/>`);
      if (r.size) rpr.push(`<w:sz w:val="${r.size}"/><w:szCs w:val="${r.size}"/>`);
      if (r.color) rpr.push(`<w:color w:val="${r.color}"/>`);
      if (r.mono) rpr.push(`<w:rFonts w:ascii="Consolas" w:hAnsi="Consolas"/>`);
      const rprXml = rpr.length ? `<w:rPr>${rpr.join("")}</w:rPr>` : "";
      return `<w:r>${rprXml}<w:t xml:space="preserve">${docxXmlEscape(r.text)}</w:t></w:r>`;
    }).join("");
    return `<w:p>${pPrXml}${runsXml}</w:p>`;
  }).join("");
}

/* ---- conversão de HTML da anotação (editor rico) em texto simples e em linhas para o Word ---- */
function htmlToPlainText(html) {
  const div = document.createElement("div");
  div.innerHTML = html || "";
  const BLOCK = new Set(["P", "DIV", "H1", "H2", "H3", "H4", "LI", "BLOCKQUOTE", "PRE", "HR"]);
  const out = [];
  function walk(node) {
    node.childNodes.forEach((child) => {
      if (child.nodeType === 3) { out.push(child.textContent); return; }
      if (child.nodeType !== 1) return;
      if (child.tagName === "BR") { out.push("\n"); return; }
      if (child.classList && child.classList.contains("note-checklist-item")) {
        out.push(child.getAttribute("data-checked") === "true" ? "☑ " : "☐ ");
      }
      walk(child);
      if (BLOCK.has(child.tagName)) out.push("\n");
    });
  }
  walk(div);
  return out.join("").replace(/\n{3,}/g, "\n\n").trim();
}
/* converte texto simples (registros antigos, sem conteudoHtml) em HTML básico de parágrafos,
   usado como fallback tanto em addNote quanto na abertura do editor completo */
function plainTextToHtml(text) {
  if (!text) return "";
  return "<p>" + text.split("\n").map(docxXmlEscape).join("</p><p>") + "</p>";
}
function collectInlineRuns(node, fmt) {
  fmt = fmt || {};
  let runs = [];
  node.childNodes.forEach((child) => {
    if (child.nodeType === 3) {
      if (child.textContent) runs.push({ text: child.textContent, ...fmt });
      return;
    }
    if (child.nodeType !== 1) return;
    if (child.tagName === "BR") { runs.push({ text: " " }); return; }
    const tag = child.tagName;
    const next = { ...fmt };
    if (tag === "B" || tag === "STRONG") next.bold = true;
    if (tag === "I" || tag === "EM") next.italic = true;
    if (tag === "U") next.underline = true;
    if (tag === "MARK" || (child.style && child.style.backgroundColor)) next.color = "C97400";
    if (tag === "CODE") next.mono = true;
    runs = runs.concat(collectInlineRuns(child, next));
  });
  return runs;
}
/* transforma o HTML do editor em "linhas" no formato aceito por docxParagraphsXml, preservando
   títulos, listas, checklist e formatação básica (negrito/itálico/sublinhado) */
function htmlToDocxLines(html) {
  const div = document.createElement("div");
  div.innerHTML = html || "";
  const lines = [];
  function pushBlock(node, prefix, baseFmt) {
    const runs = collectInlineRuns(node, baseFmt || { size: 22 });
    if (prefix) runs.unshift({ text: prefix, size: (baseFmt && baseFmt.size) || 22 });
    if (runs.length === 0) runs.push({ text: "", size: 22 });
    lines.push({ runs, indent: baseFmt && baseFmt.indent });
  }
  Array.from(div.childNodes).forEach((node) => {
    if (node.nodeType === 3) { if (node.textContent.trim()) pushBlock(node, "", { size: 22 }); return; }
    if (node.nodeType !== 1) return;
    const tag = node.tagName;
    if (tag === "H2") { pushBlock(node, "", { bold: true, size: 28 }); return; }
    if (tag === "H3") { pushBlock(node, "", { bold: true, size: 24 }); return; }
    if (tag === "BLOCKQUOTE") { pushBlock(node, "", { italic: true, size: 22, color: "595959", indent: 360 }); return; }
    if (tag === "PRE") { pushBlock(node, "", { mono: true, size: 20, indent: 360 }); return; }
    if (tag === "HR") { lines.push({ runs: [{ text: "―――――――――――――――――――", color: "AEB2B8", size: 18 }] }); return; }
    if (tag === "UL") { Array.from(node.children).forEach((li) => pushBlock(li, "•  ", { size: 22, indent: 360 })); return; }
    if (tag === "OL") { Array.from(node.children).forEach((li, i) => pushBlock(li, (i + 1) + ".  ", { size: 22, indent: 360 })); return; }
    if (node.classList && node.classList.contains("note-checklist-item")) {
      const checked = node.getAttribute("data-checked") === "true";
      const textEl = node.querySelector(".note-checklist-text") || node;
      pushBlock(textEl, checked ? "☑  " : "☐  ", { size: 22, indent: 360 });
      return;
    }
    // parágrafo padrão (P, DIV ou qualquer outro bloco)
    if (!node.textContent.trim() && node.children.length === 0) { lines.push({ runs: [{ text: "" }] }); return; }
    pushBlock(node, "", { size: 22 });
  });
  if (lines.length === 0) lines.push({ runs: [{ text: "" }] });
  return lines;
}
async function buildNoteDocx(note, project, meeting, nomeApp) {
  const zip = new JSZip();
  zip.file("[Content_Types].xml", DOCX_CONTENT_TYPES);
  zip.file("_rels/.rels", DOCX_RELS);
  zip.file("docProps/core.xml", docxCoreProps(note.titulo || "Nota", nomeApp));
  zip.file("docProps/app.xml", docxAppProps(nomeApp));

  const lines = [{ text: note.titulo || "Nota", bold: true, size: 32 }];
  const meta = [];
  if (project) meta.push("Projeto: " + project.nome);
  if (note.categoria) meta.push("Categoria: " + note.categoria);
  if (note.tags && note.tags.length > 0) meta.push("Tags: " + note.tags.join(", "));
  if (meeting) meta.push("Reunião: " + meeting.titulo + " (" + fmtDate(meeting.data) + ")");
  meta.push("Registrada em " + fmtDate(note.criadoEm) + (note.criadoHora ? " às " + note.criadoHora : ""));
  meta.forEach((m) => lines.push({ text: m, italic: true, color: "595959", size: 18 }));
  lines.push({ text: "" });
  const bodyLines = note.conteudoHtml ? htmlToDocxLines(note.conteudoHtml) : (note.conteudo || "").split("\n").map((ln) => ({ text: ln, size: 22 }));
  bodyLines.forEach((l) => lines.push(l));

  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${docxParagraphsXml(lines)}<w:sectPr/></w:body></w:document>`;
  zip.file("word/document.xml", documentXml);
  return zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}
function slugifyFilename(str) {
  return (str || "nota").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/(^-+|-+$)/g, "").slice(0, 60) || "nota";
}

  /* ---- login com Google e acesso ao Drive pessoal (substitui a capacidade "db" do Artifact) ---- */
  const tokenClientRef = useRef(null);
  const accessTokenRef = useRef(null);

  const [authStatus, setAuthStatus] = useState(

  /* ---- contas Google conectadas (Fase 2): Drive e/ou Agenda, independentes da conta de dados acima ----
     googleAccountTokensRef guarda, só em memória (nunca persistido), o token client e o access token de
