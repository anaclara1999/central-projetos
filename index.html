/* Lê um arquivo de imagem, redimensiona (maxSize no maior lado) e devolve um dataURL JPEG —
   mesma técnica usada no upload do logo, reaproveitada aqui para prints colados (Ctrl+V) ou
   anexados a uma tarefa/comentário, para não deixar o JSON de dados pesado demais. */
function readAndCompressImage(file, maxSize, cb) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      let width = img.width, height = img.height;
      if (width > maxSize || height > maxSize) {
        const scale = maxSize / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      cb(canvas.toDataURL("image/jpeg", 0.82));
    };
    img.src = String(reader.result);
  };
  reader.readAsDataURL(file);
}
function pasteImageItems(e, onImage) {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.indexOf("image/") === 0) {
      e.preventDefault();
      onImage(item.getAsFile());
    }
  }
}

function AttachmentsBlock({ task, ctx }) {
  const fileRef = useRef(null);
  const anexos = task.anexos || [];

  function addFile(file) {
    if (!file) return;
    if (file.type.indexOf("image/") === 0) {
      readAndCompressImage(file, 1000, (dataUrl) => {
        ctx.addTaskAttachment(task.id, { nome: file.name || "print.jpg", tipo: "imagem", dataUrl });
      });
      return;
    }
    if (file.size > 4 * 1024 * 1024) { ctx.setToast("Arquivo muito grande — o limite é 4 MB."); return; }
    const reader = new FileReader();
    reader.onload = () => ctx.addTaskAttachment(task.id, { nome: file.name, tipo: file.type || "arquivo", tamanho: file.size, dataUrl: String(reader.result) });
    reader.readAsDataURL(file);
  }

  return (
    <div className="field-block">
      <span className="k">Anexos {anexos.length > 0 && <span style={{ textTransform: "none", fontWeight: 500, color: "var(--text-muted)" }}>— {anexos.length}</span>}</span>
      {anexos.length > 0 && (
        <div className="attachment-grid">
          {anexos.map((a) => (
            <div className="attachment-card" key={a.id}>
              {a.tipo === "imagem"
                ? <a href={a.dataUrl} target="_blank" rel="noreferrer"><img src={a.dataUrl} alt={a.nome} /></a>
                : <a href={a.dataUrl} target="_blank" rel="noreferrer" download={a.nome} className="attachment-card-file"><Icon name="doc" size={18} /><span>{a.nome}</span></a>}
              <button className="icon-btn attachment-remove" title="Remover anexo" onClick={() => ctx.removeTaskAttachment(task.id, a.id)}><Icon name="x" size={11} /></button>
            </div>
          ))}
        </div>
      )}
      <div className="attachment-dropzone" tabIndex={0} onPaste={(e) => pasteImageItems(e, addFile)}>
        <Icon name="upload" size={15} />
        <span>Clique aqui e pressione Ctrl+V para colar um print, ou{" "}
          <button type="button" className="link-btn" onClick={() => fileRef.current && fileRef.current.click()}>escolha um arquivo</button>
        </span>
      </div>
      <input ref={fileRef} type="file" multiple hidden onChange={(e) => { Array.from(e.target.files || []).forEach(addFile); e.target.value = ""; }} />
    </div>
  );
}

function CommentsBlock({ task, ctx }) {
  const [texto, setTexto] = useState("");
  const [pendentes, setPendentes] = useState([]);
  const fileRef = useRef(null);
  const comentarios = task.comentarios || [];

  function addPendingImage(file) {
    if (!file) return;
    readAndCompressImage(file, 900, (dataUrl) => {
      setPendentes((prev) => [...prev, { _id: "tmp" + Date.now() + Math.random(), nome: file.name || "print.jpg", tipo: "imagem", dataUrl }]);
    });
  }
  function handleSubmit(e) {
    e.preventDefault();
    if (!texto.trim() && pendentes.length === 0) return;
    ctx.addTaskComment(task.id, texto, pendentes.map(({ _id, ...rest }) => rest));
    setTexto(""); setPendentes([]);
  }

  return (
    <div className="field-block">
      <span className="k">Comentários {comentarios.length > 0 && <span style={{ textTransform: "none", fontWeight: 500, color: "var(--text-muted)" }}>— {comentarios.length}</span>}</span>
      {comentarios.length === 0 && <div style={{ fontSize: 12.5, color: "var(--text-muted)", marginBottom: 8 }}>Nenhum comentário ainda.</div>}
      <div className="comment-list">
        {comentarios.map((c) => (
          <div className="comment-item" key={c.id}>
            <div className="comment-item-head">
              <PersonChip personKey={c.autor} />
              <span className="comment-item-date">{fmtDate(c.data)} {c.hora}</span>
              <button className="icon-btn" title="Excluir comentário" onClick={() => ctx.deleteTaskComment(task.id, c.id)}><Icon name="x" size={11} /></button>
            </div>
            {c.texto && <div className="comment-item-text">{c.texto}</div>}
            {c.anexos && c.anexos.length > 0 && (
              <div className="attachment-grid">
                {c.anexos.map((a, i) => (
                  <a key={i} href={a.dataUrl} target="_blank" rel="noreferrer" className="attachment-card"><img src={a.dataUrl} alt={a.nome} /></a>
                ))}
              </div>
            )}
          </div>
        ))}
      </div>
      <form onSubmit={handleSubmit} style={{ marginTop: 8 }}>
        <textarea placeholder="Escreva um comentário — cole um print com Ctrl+V…" value={texto} onChange={(e) => setTexto(e.target.value)}
          onPaste={(e) => pasteImageItems(e, addPendingImage)} rows={2} style={{ ...fieldInputStyle, resize: "vertical" }} />
        {pendentes.length > 0 && (
          <div className="attachment-grid" style={{ marginTop: 6 }}>
            {pendentes.map((a) => (
              <div className="attachment-card" key={a._id}>
                <img src={a.dataUrl} alt={a.nome} />
                <button type="button" className="icon-btn attachment-remove" onClick={() => setPendentes((prev) => prev.filter((x) => x._id !== a._id))}><Icon name="x" size={11} /></button>
              </div>
            ))}
          </div>
        )}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 6 }}>
          <button type="button" className="btn btn-ghost btn-sm" onClick={() => fileRef.current && fileRef.current.click()}><Icon name="upload" size={12} /> Anexar print</button>
          <button type="submit" className="btn btn-primary btn-sm">Comentar</button>
        </div>
        <input ref={fileRef} type="file" accept="image/*" multiple hidden onChange={(e) => { Array.from(e.target.files || []).forEach(addPendingImage); e.target.value = ""; }} />
      </form>
    </div>
  );
}

        <div className="field"><span className="k">Data realizada</span><span className="v mono">{m.dataRealizada ? fmtDate(m.dataRealizada) : "—"}</span></div>
      </div>
      {m.descricao && <div className="field-block"><span className="k">Descrição</span><span className="v">{m.descricao}</span></div>}
      {m.dependencias.length > 0 && <div className="field-block"><span className="k">Dependências / observações de dependência</span><span className="v">{m.dependencias.join(", ")}</span></div>}
      {m.observacoes && <div className="field-block"><span className="k">Observações</span><span className="v">{m.observacoes}</span></div>}
      <div style={{ display: "flex", gap: 8, marginTop: 14, flexWrap: "wrap" }}>
        <button className="btn btn-ghost btn-sm" onClick={() => ctx.openMilestoneForm(m.projectId, m)}><Icon name="edit" size={13} /> Editar marco</button>
        {m.status !== "Concluído" && <button className="btn btn-ghost btn-sm" onClick={() => ctx.completeMilestone(m.id)}><Icon name="check" size={13} /> Concluir marco</button>}
        {m.status !== "Cancelado" && m.status !== "Concluído" && <button className="btn btn-danger-ghost btn-sm" onClick={() => ctx.cancelMilestone(m.id)}><Icon name="x" size={13} /> Cancelar marco</button>}
      </div>
    </>
  );
}

/* Anotações não abrem mais em drawer — usam a tela cheia dedicada NoteEditorView (ver goToRecord). */

/* ==================================================================================
   DRAWER DE REUNIÃO + ANÁLISE DE IA (simulada)
   ================================================================================== */
function MeetingDrawer({ id, onClose, ctx }) {
  const m = ctx.meetings.find((x) => x.id === id);
  const project = m ? projectById(m.projectId) : null;
  const [showTranscricao, setShowTranscricao] = useState(false);
  const [aiState, setAiState] = useState("idle"); // idle | loading | reviewing
  const [reviewState, setReviewState] = useState(null);

  if (!m) return null;
  const suggestions = SIMULATED_AI_SUGGESTIONS[m.id];
  const canRunAi = m.aiAnalysis.status === "not_run" && suggestions;

  function runAnalysis() {
    setAiState("loading");
    setTimeout(() => {
      const init = {};
      ["decisoes", "pendencias", "tarefas", "riscos", "mudancas"].forEach((k) => {
        init[k] = (suggestions[k] || []).map((it) => ({ ...it, _status: "pending", _editing: false }));
      });
      setReviewState(init);
      setAiState("reviewing");
    }, 1400);
  }
  function setItemStatus(cat, idx, status) {
    setReviewState((prev) => {
      const next = { ...prev, [cat]: prev[cat].map((it, i) => i === idx ? { ...it, _status: it._status === status ? "pending" : status, _editing: false } : it) };
      return next;
    });
  }
  function toggleEdit(cat, idx) {
    setReviewState((prev) => ({ ...prev, [cat]: prev[cat].map((it, i) => i === idx ? { ...it, _editing: !it._editing } : it) }));
  }
  function editField(cat, idx, field, value) {
    setReviewState((prev) => ({ ...prev, [cat]: prev[cat].map((it, i) => i === idx ? { ...it, [field]: value } : it) }));
  }
  function confirmAll() {
    ctx.confirmAiSuggestions(m, reviewState);
    setAiState("idle");
    setReviewState(null);
  }
  function cancelReview() { setAiState("idle"); setReviewState(null); }

  const totalDecided = reviewState ? Object.values(reviewState).flat().filter((i) => i._status === "added").length : 0;
  const totalItems = reviewState ? Object.values(reviewState).flat().length : 0;

  return (
    <div className="overlay" onClick={onClose}>
      <div className="drawer" onClick={(e) => e.stopPropagation()}>
        <div className="drawer-header">
          <div>
            <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: ".04em", color: "var(--text-muted)", fontWeight: 700, marginBottom: 6 }}>
              Reunião {m.googleEvent && <Pill tone="neutral">Importada do Google Agenda</Pill>}
            </div>
            <h2>{m.titulo}</h2>
            {project && <a onClick={() => { onClose(); ctx.openProject(project.id); }} style={{ cursor: "pointer" }}>{project.nome}</a>}
          </div>
          <button className="drawer-close" onClick={onClose}><Icon name="x" /></button>
        </div>
        <div className="drawer-body">
          <div className="field-grid">
            <div className="field"><span className="k">Data</span><span className="v mono">{fmtDate(m.data)}</span></div>
            <div className="field"><span className="k">Horário</span><span className="v mono">{m.horario}</span></div>
            <div className="field full" style={{ gridColumn: "1 / -1" }}><span className="k">Participantes</span>
              <div className="subrecord-chip-list">{m.participantes.map((p) => <span key={p} className="subrecord-chip"><Avatar person={p} /> {personLabel(p)}</span>)}</div>
            </div>
          </div>
          <div className="field-block"><span className="k">Objetivo</span><span className="v">{m.objetivo}</span></div>
          {m.resumo && <div className="field-block"><span className="k">Resumo</span><span className="v">{m.resumo}</span></div>}
          <div className="field-block">
            <span className="k">Anotações {m.transcricao && (
              <button className="btn btn-ghost btn-sm" style={{ marginLeft: 8, padding: "2px 8px" }} onClick={() => setShowTranscricao((s) => !s)}>
                {showTranscricao ? "Ver anotações" : "Ver transcrição"}
              </button>
            )}</span>
            <span className="v" style={{ whiteSpace: "pre-line" }}>{showTranscricao && m.transcricao ? m.transcricao : (m.anotacoes || "Sem anotações registradas.")}</span>
          </div>
          {(m.linkGravacao || m.anexos.length > 0) && (
            <div className="field-grid">
              {m.linkGravacao && <div className="field"><span className="k">Gravação</span><span className="v"><a href={m.linkGravacao} target="_blank" rel="noreferrer">Abrir gravação <Icon name="external" size={11} /></a></span></div>}
              {m.anexos.length > 0 && <div className="field"><span className="k">Anexos</span><span className="v">{m.anexos.join(" · ")}</span></div>}
            </div>
          )}

          {(m.decisoesIds?.length || m.pendenciasIds?.length || m.tarefasIds?.length || m.riscosIds?.length || m.mudancasIds?.length || m.documentosIds?.length) > 0 && (
            <>
              <hr className="divider" />
              <div style={{ fontSize: 12, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".04em", color: "var(--text-muted)", marginBottom: 10 }}>Registros gerados por esta reunião</div>
              <RelatedChips label="Decisões" ids={m.decisoesIds} type="decisao" ctx={ctx} labelFn={(id) => ctx.decisions.find((x) => x.id === id)?.decisao} />
              <RelatedChips label="Pendências" ids={m.pendenciasIds} type="pendencia" ctx={ctx} labelFn={(id) => ctx.pendencies.find((x) => x.id === id)?.pendencia} />
              <RelatedChips label="Tarefas" ids={m.tarefasIds} type="tarefa" ctx={ctx} labelFn={(id) => ctx.tasks.find((x) => x.id === id)?.titulo} />
              <RelatedChips label="Riscos" ids={m.riscosIds} type="risco" ctx={ctx} labelFn={(id) => ctx.risks.find((x) => x.id === id)?.descricao} />
              <RelatedChips label="Mudanças" ids={m.mudancasIds} type="mudanca" ctx={ctx} labelFn={(id) => ctx.changes.find((x) => x.id === id)?.novaDefinicao} />
              <RelatedChips label="Documentos" ids={m.documentosIds} type="documento" ctx={ctx} labelFn={(id) => ctx.documents.find((x) => x.id === id)?.nome} />
            </>
          )}

          <hr className="divider" />

          {/* --------------------- ANÁLISE DE REUNIÃO POR IA (simulada) --------------------- */}
          {m.aiAnalysis.status === "reviewed" && aiState === "idle" && (
            <div className="ai-banner">
              <div className="ai-icon"><Icon name="sparkles" size={17} /></div>
              <div className="ai-banner-text">
                <strong>Sugestões de IA já revisadas</strong>
                <span>Os itens identificados por IA nesta reunião já foram avaliados e, quando aceitos, geraram os registros listados acima.</span>
              </div>
            </div>
          )}

          {canRunAi && aiState === "idle" && (
            <div className="ai-banner">
              <div className="ai-icon"><Icon name="sparkles" size={17} /></div>
              <div className="ai-banner-text">
                <strong>Análise de reunião por IA</strong>
                <span>Identifica decisões, pendências, tarefas, riscos e mudanças a partir das anotações — nada é gravado sem sua revisão.</span>
              </div>
              <button className="btn btn-accent btn-sm" onClick={runAnalysis}><Icon name="sparkles" size={13} /> Analisar reunião com IA</button>
            </div>
          )}

          {!canRunAi && m.aiAnalysis.status === "not_run" && (
            <div className="ai-banner">
              <div className="ai-icon"><Icon name="sparkles" size={17} /></div>
              <div className="ai-banner-text">
                <strong>Análise de reunião por IA</strong>
                <span>Disponível assim que houver anotações ou transcrição suficientes para análise.</span>
              </div>
            </div>
          )}

          {aiState === "loading" && (
            <div className="ai-banner" style={{ display: "block" }}>
              <div className="ai-loading"><span className="spinner" /> Analisando anotações da reunião…</div>
            </div>
          )}

          {aiState === "reviewing" && reviewState && (
            <div>
              <div className="ai-review-head"><Icon name="sparkles" size={16} style={{ color: "var(--accent-strong)" }} /><strong style={{ fontSize: 13.5 }}>Sugestões da IA — revise antes de confirmar</strong></div>
              <div className="ai-review-summary"><strong>Resumo sugerido: </strong>{suggestions.resumo}</div>

              <SuggestionGroup title="Decisões identificadas" cat="decisoes" items={reviewState.decisoes}
                render={(it) => <><div className="suggestion-card-title">{it.titulo}</div>{it.contexto && <div className="suggestion-card-meta">{it.contexto}</div>}</>}
                editFields={[{ key: "titulo", label: "Decisão", type: "textarea" }]}
                setItemStatus={setItemStatus} toggleEdit={toggleEdit} editField={editField} />

              <SuggestionGroup title="Pendências identificadas" cat="pendencias" items={reviewState.pendencias}
                render={(it) => <><div className="suggestion-card-title">{it.titulo}</div><div className="suggestion-card-meta">{it.dependeDe && <span>Depende de {personLabel(it.dependeDe)}</span>}{it.prazoSugerido && <span>Prazo sugerido: {fmtDate(it.prazoSugerido)}</span>}</div></>}
                editFields={[{ key: "titulo", label: "Pendência", type: "textarea" }, { key: "prazoSugerido", label: "Prazo", type: "date" }]}
                setItemStatus={setItemStatus} toggleEdit={toggleEdit} editField={editField} />

              <SuggestionGroup title="Tarefas sugeridas" cat="tarefas" items={reviewState.tarefas}
                render={(it) => <><div className="suggestion-card-title">{it.titulo}</div><div className="suggestion-card-meta">{it.responsavelSugerido && <span>Responsável: {personLabel(it.responsavelSugerido)}</span>}{it.prazoSugerido && <span>Prazo: {fmtDate(it.prazoSugerido)}</span>}</div></>}
                editFields={[{ key: "titulo", label: "Tarefa", type: "textarea" }, { key: "prazoSugerido", label: "Prazo", type: "date" }]}
                setItemStatus={setItemStatus} toggleEdit={toggleEdit} editField={editField} />

              <SuggestionGroup title="Riscos identificados" cat="riscos" items={reviewState.riscos}
                render={(it) => <><div className="suggestion-card-title">{it.titulo}</div><div className="suggestion-card-meta"><span>{it.tipo}</span><span>Impacto {it.impacto}</span>{it.probabilidade && <span>Probabilidade {it.probabilidade}</span>}</div></>}
                editFields={[{ key: "titulo", label: "Descrição do risco", type: "textarea" }]}
                setItemStatus={setItemStatus} toggleEdit={toggleEdit} editField={editField} />

              <SuggestionGroup title="Mudanças de escopo identificadas" cat="mudancas" items={reviewState.mudancas}
                render={(it) => <><div className="suggestion-card-title">{it.titulo}</div></>}
                editFields={[{ key: "titulo", label: "Mudança", type: "textarea" }]}
                setItemStatus={setItemStatus} toggleEdit={toggleEdit} editField={editField} />

              <div className="ai-confirm-bar">
                <span className="summary">{totalDecided} de {totalItems} itens marcados para adicionar. Itens ignorados ou não revisados não serão gravados.</span>
                <button className="btn btn-ghost btn-sm" onClick={cancelReview}>Cancelar</button>
                <button className="btn btn-primary btn-sm" onClick={confirmAll}>Confirmar seleção</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function RelatedChips({ label, ids, type, ctx, labelFn }) {
  if (!ids || ids.length === 0) return null;
  return (
    <div className="field-block">
      <span className="k">{label}</span>
      <div className="subrecord-chip-list">
        {ids.map((id) => <span key={id} className="subrecord-chip" onClick={() => ctx.goToRecord(type, id)}>{labelFn(id) || id}</span>)}
      </div>
    </div>
  );
}

function SuggestionGroup({ title, cat, items, render, editFields, setItemStatus, toggleEdit, editField }) {
  if (!items || items.length === 0) return null;
  return (
    <div className="suggestion-group">
      <div className="suggestion-group-title">{title}</div>
      {items.map((it, idx) => (
        <div key={idx} className={cx("suggestion-card", it._status === "added" && "status-added", it._status === "ignored" && "status-ignored")}>
          {!it._editing && render(it)}
          {it._editing && (
            <div className="suggestion-edit-form">
              {editFields.map((f) => (
                <div key={f.key}>
                  <span className="k" style={{ fontSize: 10, textTransform: "uppercase", color: "var(--text-muted)", fontWeight: 700 }}>{f.label}</span>
                  {f.type === "textarea"
                    ? <textarea value={it[f.key] || ""} onChange={(e) => editField(cat, idx, f.key, e.target.value)} />
                    : <input type={f.type} value={it[f.key] || ""} onChange={(e) => editField(cat, idx, f.key, e.target.value)} />}
                </div>
              ))}
            </div>
          )}
          <div className="suggestion-card-actions">
            {it._status === "added" && <span className="suggestion-status-flag added"><Icon name="check" size={12} /> Será adicionado</span>}
            {it._status === "ignored" && <span className="suggestion-status-flag ignored"><Icon name="x" size={12} /> Ignorado</span>}
            <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
              {it._editing ? (
                <button className="btn btn-ghost btn-sm" onClick={() => toggleEdit(cat, idx)}>Concluir edição</button>
              ) : (
                <>
                  <button className="btn btn-ghost btn-sm" onClick={() => toggleEdit(cat, idx)}><Icon name="edit" size={12} /> Editar</button>
                  <button className="btn btn-ghost btn-sm" onClick={() => setItemStatus(cat, idx, "ignored")}><Icon name="x" size={12} /> Ignorar</button>
                  <button className="btn btn-accent btn-sm" onClick={() => setItemStatus(cat, idx, "added")}><Icon name="check" size={12} /> Adicionar</button>
                </>
              )}
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ==================================================================================
   BOTÃO GLOBAL "+ NOVO" — captura rápida a partir de qualquer tela
   ================================================================================== */
const NEW_ITEM_TYPES = [
  { key: "tarefa", label: "Tarefa", icon: "check", geral: true },
  { key: "nota", label: "Anotação", icon: "book", geral: true },
  { key: "lembrete", label: "Lembrete", icon: "bell", geral: true },
  { key: "reuniao", label: "Reunião", icon: "users", geral: false },
  { key: "pendencia", label: "Pendência", icon: "clock", geral: false },
  { key: "decisao", label: "Decisão", icon: "flag", geral: false },
  { key: "risco", label: "Risco / Problema / Impedimento", icon: "alert", geral: false },
  { key: "material", label: "Documento", icon: "doc", geral: false },
];

function NewItemButton({ ctx }) {
  const [open, setOpen] = useState(false);
  const [tipo, setTipo] = useState(null);
  const contextProjectId = ctx.route && ctx.route.view === "project" ? ctx.route.projectId : "";

  function close() { setOpen(false); setTipo(null); }
  function selectTipo(k) {
    // Anotação nunca usa o formulário pequeno — vai direto para o editor completo em tela cheia
    if (k === "nota") { close(); ctx.openNoteEditor("new", contextProjectId ? { projectId: contextProjectId } : {}); return; }
    // Decisão, Pendência e Risco têm formulários completos próprios — não usam o formulário pequeno
    if (k === "decisao") { close(); ctx.openDecisionForm(contextProjectId || null, null); return; }
    if (k === "pendencia") { close(); ctx.openPendencyForm(contextProjectId || null, null); return; }
    if (k === "risco") { close(); ctx.openRiskForm(contextProjectId || null, null); return; }
    setTipo(k);
  }

  return (
    <>
      <button className="fab-new" onClick={() => setOpen(true)} title="Criar novo item">
        <Icon name="plus" size={20} />
      </button>
      {open && (
        <div className="overlay modal-center" onClick={close}>
          <div className="modal-box" onClick={(e) => e.stopPropagation()} style={{ width: "min(480px, 100%)" }}>
            <div className="drawer-header">
              <h2 style={{ fontSize: 15 }}>{tipo ? "Novo — " + NEW_ITEM_TYPES.find((t) => t.key === tipo).label : "+ Novo"}</h2>
              <button className="drawer-close" onClick={close}><Icon name="x" /></button>
            </div>
            <div className="drawer-body" style={{ padding: 18 }}>
              {!tipo && (
                <div className="new-item-menu">
                  {NEW_ITEM_TYPES.map((t) => (
                    <button key={t.key} className="new-item-option" onClick={() => selectTipo(t.key)}>
                      <Icon name={t.icon} size={18} />
                      <span>{t.label}</span>
                    </button>
                  ))}
                </div>
              )}
              {tipo && <NewItemForm tipo={tipo} ctx={ctx} contextProjectId={contextProjectId} onBack={() => setTipo(null)} onDone={close} />}
            </div>
          </div>
        </div>
      )}
    </>
  );
}

function NewItemForm({ tipo, ctx, contextProjectId, onBack, onDone }) {
  // Nota, Decisão, Pendência e Risco são interceptados em selectTipo() e nunca chegam aqui —
  // este formulário pequeno hoje só atende Tarefa, Lembrete, Reunião e Material.
  const typeInfo = NEW_ITEM_TYPES.find((t) => t.key === tipo);
  const [projectId, setProjectId] = useState(contextProjectId || "");
  const [titulo, setTitulo] = useState("");
  const [conteudo, setConteudo] = useState("");
  const [prazo, setPrazo] = useState("");
  const [tipoMaterial, setTipoMaterial] = useState("");
  const [classificacaoMaterial, setClassificacaoMaterial] = useState("");
  const [linkMaterial, setLinkMaterial] = useState("");
  const [error, setError] = useState("");

  function handleSubmit(e) {
    e.preventDefault();
    setError("");
    if (!titulo.trim()) { setError(tipo === "material" ? "Preencha o nome do documento." : "Preencha o título."); return; }
    if (!typeInfo.geral && !projectId) { setError("Selecione um projeto — este tipo de registro exige um projeto."); return; }
    const pid = projectId || null;
    if (tipo === "tarefa") ctx.addTask({ titulo, projectId: pid, prazo: prazo || null });
    if (tipo === "lembrete") ctx.addReminder({ texto: titulo, projectId: pid });
    if (tipo === "reuniao") ctx.addMeetingManual({ titulo, projectId: pid, objetivo: conteudo });
    if (tipo === "material") ctx.addDocument({ projectId: pid, nome: titulo, categoria: tipoMaterial || undefined, classificacao: classificacaoMaterial || undefined, link: linkMaterial });
    onDone();
  }

  return (
    <form onSubmit={handleSubmit}>
      <div className="field-block" style={{ margin: "0 0 12px" }}>
        <span className="k">{tipo === "reuniao" ? "Título da reunião" : tipo === "lembrete" ? "Texto do lembrete" : tipo === "material" ? "Nome do documento" : "Título"}</span>
        <input type="text" value={titulo} onChange={(e) => setTitulo(e.target.value)} autoFocus
          style={{ width: "100%", padding: "7px 9px", borderRadius: 6, border: "1px solid var(--border)", background: "var(--surface)", fontFamily: "inherit", fontSize: 13 }} />
      </div>
      <div className="field-block" style={{ margin: "0 0 12px" }}>
        <span className="k">Projeto {!typeInfo.geral && "(obrigatório)"}</span>
        <select value={projectId} onChange={(e) => setProjectId(e.target.value)}
          style={{ width: "100%", padding: "7px 9px", borderRadius: 6, border: "1px solid var(--border)", background: "var(--surface)", fontFamily: "inherit", fontSize: 13 }}>
          {typeInfo.geral && <option value="">Geral (sem projeto)</option>}
          {!typeInfo.geral && <option value="">Selecione um projeto…</option>}
          {ctx.projects.filter((p) => !p.arquivado).map((p) => <option key={p.id} value={p.id}>{p.nome}</option>)}
        </select>
      </div>
      {tipo === "tarefa" && (
        <div className="field-block" style={{ margin: "0 0 12px" }}>
          <span className="k">Prazo</span>
          <input type="date" value={prazo} onChange={(e) => setPrazo(e.target.value)}
            style={{ padding: "6px 9px", borderRadius: 6, border: "1px solid var(--border)", background: "var(--surface)", fontFamily: "inherit", fontSize: 13 }} />
        </div>
      )}
      {tipo === "reuniao" && (
        <div className="field-block" style={{ margin: "0 0 12px" }}>
          <span className="k">Objetivo</span>
          <textarea value={conteudo} onChange={(e) => setConteudo(e.target.value)} rows={3}
            style={{ width: "100%", padding: "7px 9px", borderRadius: 6, border: "1px solid var(--border)", background: "var(--surface)", fontFamily: "inherit", fontSize: 13, resize: "vertical" }} />
        </div>
      )}
      {tipo === "material" && (
        <>
          <div className="field-grid" style={{ margin: "0 0 12px" }}>
            <div className="field"><span className="k">Tipo</span><ConfigListSelect ctx={ctx} listId="material_tipo" value={tipoMaterial} onChange={setTipoMaterial} allowEmpty emptyLabel="Selecione…" /></div>
            <div className="field"><span className="k">Classificação</span><ConfigListSelect ctx={ctx} listId="material_classificacao" value={classificacaoMaterial} onChange={setClassificacaoMaterial} allowEmpty emptyLabel="Selecione…" /></div>
          </div>
          <div className="field-block" style={{ margin: "0 0 12px" }}>
            <span className="k">Link (https://…)</span>
            <input type="text" value={linkMaterial} onChange={(e) => setLinkMaterial(e.target.value)}
              style={{ width: "100%", padding: "7px 9px", borderRadius: 6, border: "1px solid var(--border)", background: "var(--surface)", fontFamily: "inherit", fontSize: 13 }} />
          </div>
        </>
      )}
      {error && <div className="stale-alert" style={{ marginBottom: 12 }}><Icon name="alert" size={12} /> {error}</div>}
      <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
        <button type="button" className="btn btn-ghost btn-sm" onClick={onBack}>Voltar</button>
        <button type="submit" className="btn btn-primary btn-sm">Criar</button>
      </div>
    </form>
  );
}

/* ==================================================================================
   PROJETOS EDITÁVEIS — criar / editar
   ================================================================================== */
const fieldInputStyle = { width: "100%", padding: "7px 9px", borderRadius: 6, border: "1px solid var(--border)", background: "var(--surface)", fontFamily: "inherit", fontSize: 13 };
function ProjectFormModal({ data, ctx, onClose }) {
  const p = data.project;
  const [nome, setNome] = useState(p ? p.nome : "");
  const [descricao, setDescricao] = useState(p ? p.descricao : "");
  const [objetivo, setObjetivo] = useState(p ? p.objetivo : "");
  const [area, setArea] = useState(p ? p.area : "");
  const [empresaId, setEmpresaId] = useState(p ? (p.empresaId || "") : "");
  const [responsavel, setResponsavel] = useState(p ? p.responsavel : "clara");
  const [sponsor, setSponsor] = useState(p ? (p.sponsor || "") : "");
  const [prioridade, setPrioridade] = useState(priorityInfo(p ? p.prioridade : 2).valor);
  const [status, setStatus] = useState(p ? p.status : "Planejamento");
  const [saude, setSaude] = useState(p ? p.saude : "Saudável");
  const [dataInicio, setDataInicio] = useState(p ? p.dataInicio : TODAY);
  const [prazoPrevisto, setPrazoPrevisto] = useState(p ? p.prazoPrevisto : TODAY);
  const [percentual, setPercentual] = useState(p ? p.percentual : 0);
  const [proximaAcao, setProximaAcao] = useState(p ? (p.proximaAcao || "") : "");
  const [dependeDeIds, setDependeDeIds] = useState(p ? (p.dependeDeIds || []) : []);
  const [observacoes, setObservacoes] = useState(p ? (p.observacoes || "") : "");
  const [error, setError] = useState("");

  const outrosProjetos = ctx.projects.filter((x) => !p || x.id !== p.id);

  function toggleDependeDe(id) {
    setDependeDeIds((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);
  }
  function handleSubmit(e) {
    e.preventDefault();
    if (!nome.trim()) { setError("Preencha o nome do projeto."); return; }
    const payload = { nome, descricao, objetivo, area, empresaId: empresaId || null, responsavel, sponsor: sponsor || null, prioridade, status, saude,
      dataInicio, prazoPrevisto, percentual: Number(percentual) || 0, proximaAcao, dependeDeIds, observacoes };
    if (data.mode === "create") ctx.addProject(payload);
    else ctx.updateProject(p.id, payload);
    onClose();
  }

  return (
    <div className="overlay modal-center" onClick={onClose}>
      <div className="modal-box" onClick={(e) => e.stopPropagation()} style={{ width: "min(640px, 100%)" }}>
        <div className="drawer-header">
          <h2 style={{ fontSize: 15 }}>{data.mode === "create" ? "Novo projeto" : "Editar projeto"}</h2>
          <button className="drawer-close" onClick={onClose}><Icon name="x" /></button>
        </div>
        <form onSubmit={handleSubmit}>
          <div className="drawer-body" style={{ padding: 18, maxHeight: "70vh" }}>
            <div className="field-block" style={{ margin: "0 0 12px" }}>
              <span className="k">Nome</span>
              <input type="text" value={nome} onChange={(e) => setNome(e.target.value)} autoFocus style={fieldInputStyle} />
            </div>
            <div className="field-block" style={{ margin: "0 0 12px" }}>
              <span className="k">Objetivo</span>
              <textarea value={objetivo} onChange={(e) => setObjetivo(e.target.value)} rows={2} style={{ ...fieldInputStyle, resize: "vertical" }} />
            </div>
            <div className="field-block" style={{ margin: "0 0 12px" }}>
              <span className="k">Descrição</span>
              <textarea value={descricao} onChange={(e) => setDescricao(e.target.value)} rows={2} style={{ ...fieldInputStyle, resize: "vertical" }} />
            </div>
            <div className="field-grid">
              <div className="field"><span className="k">Empresa</span>
                <select value={empresaId} onChange={(e) => setEmpresaId(e.target.value)} style={fieldInputStyle}>
                  <option value="">Pessoal / Sem empresa</option>
                  {ctx.empresas.filter((e) => e.ativa || e.id === empresaId).map((e) => <option key={e.id} value={e.id}>{e.nome}</option>)}
                </select>
              </div>
              <div className="field"><span className="k">Área</span><ConfigListSelect ctx={ctx} listId="projeto_area" value={area} onChange={setArea} allowEmpty emptyLabel="—" /></div>
              <div className="field"><span className="k">Prioridade</span><PrioritySelect value={prioridade} onChange={setPrioridade} /></div>
              <div className="field"><span className="k">Responsável</span><PersonSelect ctx={ctx} value={responsavel} onChange={setResponsavel} role="responsavel" /></div>
              <div className="field"><span className="k">Sponsor</span><PersonSelect ctx={ctx} value={sponsor} onChange={setSponsor} role="sponsor" allowEmpty emptyLabel="—" /></div>
              <div className="field"><span className="k">Status</span><ConfigListSelect ctx={ctx} listId="projeto_status" value={status} onChange={setStatus} /></div>
              <div className="field"><span className="k">Saúde</span><ConfigListSelect ctx={ctx} listId="projeto_saude" value={saude} onChange={setSaude} /></div>
              <div className="field"><span className="k">Data de início</span><input type="date" value={dataInicio} onChange={(e) => setDataInicio(e.target.value)} style={fieldInputStyle} /></div>
              <div className="field"><span className="k">Prazo previsto</span><input type="date" value={prazoPrevisto} onChange={(e) => setPrazoPrevisto(e.target.value)} style={fieldInputStyle} /></div>

            </div>

                <span className="k">Depende de</span>

/* ==================================================================================
   IMPORTAR WORD (.docx) PARA ANOTAÇÕES — via Mammoth.js, 100% no navegador
   ================================================================================== */
function ImportarWordModal({ ctx, projectId, onClose }) {
  const [fileName, setFileName] = useState("");
  const [status, setStatus] = useState("idle"); // idle | lendo | pronto | erro
  const [html, setHtml] = useState("");
  const [warnings, setWarnings] = useState([]);
  const [error, setError] = useState("");
  const [titulo, setTitulo] = useState("");
  const [tipo, setTipo] = useState("Anotação"); // Anotação | Ata | Transcrição
  const [selProjectId, setSelProjectId] = useState(projectId || "");
  const [meetingId, setMeetingId] = useState("");
  const [categoria, setCategoria] = useState("");
  const [tagsText, setTagsText] = useState("");
  const fileRef = useRef(null);

  const reunioesDoProjeto = ctx.meetings.filter((m) => m.projectId === selProjectId);

  function handleFile(e) {
    setError(""); setStatus("idle"); setHtml(""); setWarnings([]);
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!/\.docx$/i.test(file.name)) { setError("Selecione um arquivo .docx."); return; }
    setFileName(file.name);
    setTitulo(file.name.replace(/\.docx$/i, ""));
    setStatus("lendo");
    const reader = new FileReader();
    reader.onload = () => {
      if (!window.mammoth) { setError("Biblioteca de conversão (Mammoth.js) não carregou — verifique a conexão e tente novamente."); setStatus("erro"); return; }
      window.mammoth.convertToHtml({ arrayBuffer: reader.result })
        .then((result) => {
          setHtml(result.value || "");
          setWarnings((result.messages || []).map((m) => m.message));
          setStatus("pronto");
        })
        .catch((err) => {
          console.warn("Falha ao converter .docx:", err);
          setError("Não foi possível ler este arquivo. Verifique se é um .docx válido.");
          setStatus("erro");
        });
    };
    reader.onerror = () => { setError("Não foi possível ler o arquivo."); setStatus("erro"); };
    reader.readAsArrayBuffer(file);
  }

  function handleImportar() {
    if (!html) return;
    const tags = tagsText.split(",").map((t) => t.trim()).filter(Boolean);
    ctx.addNote({
      titulo: titulo || fileName.replace(/\.docx$/i, ""), conteudoHtml: html,
      categoria: categoria || null, tags, projectId: selProjectId || null,
      meetingId: tipo !== "Anotação" ? (meetingId || null) : null,
      origemTipo: tipo, origemArquivo: fileName,
    });
    ctx.setToast("Anotação importada do Word.");
    onClose();
  }

  return (
    <div className="overlay modal-center" onClick={onClose}>
      <div className="modal-box" onClick={(e) => e.stopPropagation()} style={{ width: "min(680px, 100%)" }}>
        <div className="drawer-header">
          <h2 style={{ fontSize: 15 }}>Importar Word para Anotações</h2>
          <button className="drawer-close" onClick={onClose}><Icon name="x" /></button>
        </div>
        <div className="drawer-body" style={{ padding: 18, maxHeight: "75vh" }}>
          {status === "idle" && (
            <div className="field-block" style={{ margin: "0 0 12px" }}>
              <span className="k">Arquivo (.docx)</span>
              <input ref={fileRef} type="file" accept=".docx" onChange={handleFile} style={fieldInputStyle} />
              <span className="hint" style={{ marginTop: 6, display: "block" }}>
                A conversão acontece inteiramente no seu navegador (via Mammoth.js) — o arquivo não é enviado para nenhum servidor.
              </span>
            </div>
          )}
          {status === "lendo" && <EmptyState text={`Lendo ${fileName}…`} />}
          {error && <div className="stale-alert" style={{ marginBottom: 12 }}><Icon name="alert" size={12} /> {error}</div>}

          {status === "pronto" && (
            <>
              <div className="field-block" style={{ margin: "0 0 12px" }}>
                <span className="k">Título</span>
                <input type="text" value={titulo} onChange={(e) => setTitulo(e.target.value)} style={fieldInputStyle} />
              </div>
              <div className="field-grid" style={{ marginTop: 0 }}>
                <div className="field"><span className="k">Tipo</span>
                  <select value={tipo} onChange={(e) => setTipo(e.target.value)} style={fieldInputStyle}>
                    <option value="Anotação">Anotação</option>
                    <option value="Ata">Ata</option>
                    <option value="Transcrição">Transcrição</option>
                  </select>
                </div>
                <div className="field"><span className="k">Projeto</span>
                  <select value={selProjectId} onChange={(e) => { setSelProjectId(e.target.value); setMeetingId(""); }} style={fieldInputStyle}>
                    <option value="">Geral (sem projeto)</option>
                    {ctx.projects.filter((p) => !p.arquivado).map((p) => <option key={p.id} value={p.id}>{p.nome}</option>)}
                  </select>
                </div>
                {tipo !== "Anotação" && selProjectId && (
                  <div className="field"><span className="k">Reunião vinculada</span>
                    <select value={meetingId} onChange={(e) => setMeetingId(e.target.value)} style={fieldInputStyle}>
                      <option value="">—</option>
                      {reunioesDoProjeto.map((m) => <option key={m.id} value={m.id}>{m.titulo} ({fmtDate(m.data)})</option>)}
                    </select>
                  </div>
                )}
                <div className="field"><span className="k">Categoria</span><ConfigListSelect ctx={ctx} listId="nota_categoria" value={categoria} onChange={setCategoria} allowEmpty emptyLabel="—" /></div>
              </div>
              <div className="field-block" style={{ margin: "0 0 12px" }}>
                <span className="k">Tags (separadas por vírgula)</span>
                <input type="text" value={tagsText} onChange={(e) => setTagsText(e.target.value)} style={fieldInputStyle} />
              </div>
              {warnings.length > 0 && (
                <div className="stale-alert" style={{ marginBottom: 12 }}>
                  <Icon name="alert" size={12} /> Algumas formatações do documento original podem não ter sido preservadas ({warnings.length} aviso(s) do conversor).
                </div>
              )}
              <div className="field-block" style={{ margin: "0 0 6px" }}>
                <span className="k">Pré-visualização do conteúdo importado</span>
                <div className="note-editor-content" style={{ border: "1px solid var(--border)", borderRadius: 8, padding: 12, maxHeight: 260, overflowY: "auto", background: "var(--surface)" }}
                  dangerouslySetInnerHTML={{ __html: html }} />
              </div>
              <p className="hint" style={{ margin: "6px 0 0" }}>
                O arquivo .docx original não é enviado nem armazenado — apenas o conteúdo é importado como anotação
                na Central. Fazer upload do arquivo original para Documentos (em vez de só linkar um arquivo já
                existente no Drive) é uma evolução prevista para uma próxima fase.
              </p>
            </>
          )}
        </div>
        <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", padding: "14px 18px", borderTop: "1px solid var(--border)" }}>
          <button type="button" className="btn btn-ghost btn-sm" onClick={onClose}>Cancelar</button>
          {status === "pronto" && <button type="button" className="btn btn-primary btn-sm" onClick={handleImportar}>Importar como anotação</button>}
        </div>
      </div>
    </div>
  );
}

function QuickListRow({ item, ctx, onClose }) {
  if (item.type === "projeto") {
    const p = projectById(item.id);
    if (!p) return null;
    return (
      <div className="item-row" onClick={() => { onClose(); ctx.openProject(p.id); }}>
        <div className="item-row-main">
          <span className="item-row-title">{p.nome}</span>
          <span className="item-row-sub">{p.area} · {personLabel(p.responsavel)}</span>
        </div>
        <div className="item-row-side">
          <Pill tone={projectTone(p.status)} dot>{p.status}</Pill>
        </div>
      </div>
    );
  }
  if (item.type === "googleEvent") {
    const ev = (ctx.googleEvents || []).find((e) => e.key === item.id);
    if (!ev) return null;
    const conta = ctx.googleAccounts.find((a) => a.id === ev.accountId);
    return (
      <div className="item-row" onClick={() => { onClose(); ctx.goToRecord(item.type, item.id); }}>
        <div className="item-row-main">
          <span className="item-row-title">{ev.titulo}</span>
          <span className="item-row-sub">{conta ? (conta.apelido || conta.email) : "Google Agenda"}</span>
        </div>
        <div className="item-row-side">
          <span className="item-row-date mono">{ev.diaInteiro ? "Dia inteiro" : (ev.horario || "—")}</span>
        </div>
      </div>
    );
  }
  const collectionMap = { tarefa: ctx.tasks, decisao: ctx.decisions, pendencia: ctx.pendencies, risco: ctx.risks, mudanca: ctx.changes, documento: ctx.documents, marco: ctx.milestones, reuniao: ctx.meetings, nota: ctx.notes };
  const rec = (collectionMap[item.type] || []).find((x) => x.id === item.id);
  if (!rec) return null;
  const project = projectById(rec.projectId);
  return (
    <div className="item-row" onClick={() => { onClose(); ctx.goToRecord(item.type, item.id); }}>
      <div className="item-row-main">
        <span className="item-row-title">{recTitle(item.type, rec)}</span>
        <span className="item-row-sub">{project?.nome}</span>
      </div>
      <div className="item-row-side">
        {item.type === "pendencia" && <Pill tone={pendTone(rec.status)}>{rec.status}</Pill>}
        {item.type === "decisao" && <Pill tone={decisionTone(rec.status)}>{rec.status}</Pill>}
        {item.type === "marco" && <span className="item-row-date mono">{fmtDate(rec.previsao)}</span>}
        {item.type === "reuniao" && <span className="item-row-date mono">{fmtDate(rec.data)}</span>}
        {item.type === "tarefa" && <Pill tone={taskTone(rec.status)}>{rec.status}</Pill>}
      </div>
    </div>
  );
}

function SearchView({ query, results, goToRecord, setSearchQuery, navigate }) {
  const grouped = {};
  results.forEach((r) => { (grouped[r.type] = grouped[r.type] || []).push(r); });
  const order = ["projeto", "reuniao", "decisao", "pendencia", "tarefa", "documento", "risco", "mudanca", "marco", "nota", "lembrete", "diario"];

  return (
    <div className="content-scroll narrow" style={{ padding: 0 }}>
      <div className="section-head">
        <h2>Busca geral</h2>
        <span className="hint">Cruza projetos, reuniões, decisões, pendências, documentos, tarefas e diário</span>
      </div>
      <div style={{ maxWidth: 460, marginBottom: 22 }}>
        <div className="search-wrap" style={{ maxWidth: "none", margin: 0 }}>
          <Icon name="search" size={14} className="search-icon" />
          <input className="search-input" type="text" placeholder="Digite um termo — ex.: calendário, homologação, fornecedores…" value={query} onChange={(e) => setSearchQuery(e.target.value)} autoFocus />
        </div>
      </div>

      {!query.trim() && <EmptyState icon="search" text="Digite um termo para buscar em todos os registros do portfólio." />}
      {query.trim() && results.length === 0 && <EmptyState icon="search" text={`Nenhum resultado encontrado para “${query}”.`} />}

      <div className="search-view-results">
        {order.filter((t) => grouped[t]).map((type) => (
          <div key={type}>
            <div className="group-heading"><Icon name={SEARCH_TYPE_ICON[type]} size={13} /> {SEARCH_TYPE_LABELS[type]} <span className="n">{grouped[type].length}</span></div>
            <div className="list-stack">
              {grouped[type].map((r) => (
                <div className="item-row" key={type + r.id} onClick={() => type === "projeto" ? navigate("project", { projectId: r.id, tab: "visao" }) : goToRecord(type, r.id)}>
                  <div className="item-row-main">
                    <span className="item-row-title">{r.title}</span>
                    <span className="item-row-sub">{r.subtitle}</span>
                  </div>
                  <Icon name="chevronRight" size={15} style={{ color: "var(--text-muted)", marginTop: 4 }} />
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ==================================================================================

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
